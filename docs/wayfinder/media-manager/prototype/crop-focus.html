<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crop and focus point — three ways</title>
<style>
:root{
  /* Media manager (Tiles) */
  --primary:#2459d3;--selected:#eaf1ff;--text:#182233;--muted:#596577;--line:#dce2ea;--subtle:#f6f8fb;
  /* Editor chrome (theme.css, light) */
  --ed-text:#010925;--ed-muted:#3c4961;--ed-panel:#cfd7f9;--ed-action:#275ac8;--ed-on:#fbfbfd;--ed-bg:#f1f4ff;--ed-toolbar:#e1e4f2;--ed-surface:#fbfbfd;
  --ed-hover:rgba(1,9,37,.09);--ed-current:rgba(39,90,200,.16);--ed-line:rgba(1,9,37,.16);
  --ed-shadow:0 12px 32px rgba(1,9,37,.18);--ed-shadow-s:0 2px 6px rgba(1,9,37,.18);
  --comp:#864ad2;--comp-surf:#f5eeff;--comp-text:#5e2b9a;
  --ok-bg:#edf8f0;--ok-fg:#2e5d3c;--ok-line:#cbe7d3;--warn-bg:#fff8eb;--warn-fg:#80551c;--warn-line:#ecdfc4;
  --tap:36px;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;color:var(--text)
}
@media (max-width:700px),(pointer:coarse){:root{--tap:44px}}
*{box-sizing:border-box}
body{margin:0;padding:16px 12px 32px;background:#fff}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
.i{width:16px;height:16px;flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- Mockup page ---------- */
.wrap{max-width:1320px;margin:0 auto}
.intro h1{font-size:22px;letter-spacing:-.4px;line-height:1.25}
.intro p{color:var(--muted);margin-top:4px;max-width:760px}
.dirs{display:flex;gap:6px;margin:16px 0 10px;flex-wrap:wrap}
.dirs button{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:600;text-align:left}
.dirs button:hover{background:var(--subtle)}
.dirs button[aria-selected=true]{background:var(--selected);border-color:#b8cdf8;color:#173d97}
.dirs .letter{display:grid;place-items:center;width:30px;height:30px;border-radius:999px;background:#fff;border:1px solid #c5d0df;font-weight:700;flex:none}
.dirs button[aria-selected=true] .letter{background:var(--primary);border-color:var(--primary);color:#fff}
.dir-sum{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin:6px 0 14px}
.dir-sum p{max-width:760px}
.try{font-size:13px;color:var(--muted);padding:6px 10px;border-radius:8px;background:var(--subtle)}
.examples{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.examples .lbl{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:var(--tap);padding:4px 14px;font-weight:550;font-size:13px}
.seg button[aria-pressed=true]{background:var(--selected);color:#173d97}

/* ---------- Editor frame ---------- */
.editor{position:relative;border:1px solid #c9d1e6;border-radius:12px;background:var(--ed-bg);color:var(--ed-text);font-size:13px;overflow:clip}
.ed-top{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 12px;background:var(--ed-toolbar);border-bottom:1px solid #cdd3ea;flex-wrap:wrap}
.ed-site{font-weight:650}
.ed-page{color:var(--ed-muted)}
.ed-tabs{display:flex;gap:2px;margin-left:auto}
.ed-tabs button{border:0;background:transparent;border-radius:6px;min-height:var(--tap);padding:0 12px;font-weight:600;color:var(--ed-muted);display:flex;align-items:center;gap:6px}
.ed-tabs button:hover{background:var(--ed-hover)}
.ed-tabs button[aria-pressed=true]{background:var(--ed-current);color:var(--ed-text)}
.ed-devices{display:flex;gap:2px;color:var(--ed-muted)}
.ed-devices span{display:grid;place-items:center;width:28px;height:28px;border-radius:6px}
.ed-devices span.on{background:var(--ed-current);color:var(--ed-text)}
.ed-body{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0;min-height:520px}
.canvas{padding:18px;min-width:0}
.side{border-left:1px solid #d3d9ee;background:#f7f8fd;padding:14px;min-width:0;display:flex;flex-direction:column;gap:14px}
@media (max-width:980px){.ed-body{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #d3d9ee}}

/* ---------- Pretend website ---------- */
.site{container:site/inline-size;background:#fbf8f4;color:#211d1a;border-radius:6px;box-shadow:0 1px 3px rgba(1,9,37,.12);font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
.s-nav{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid #eee5da;gap:12px}
.s-logo{font-family:Georgia,"Times New Roman",serif;font-size:18px}
.s-nav nav{display:flex;gap:16px;font-size:13px;color:#6b6158}
.s-hero{padding:26px 22px;display:grid;gap:22px}
.s-eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#a0522d;font-weight:600}
.s-hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:32px;line-height:1.15;margin:6px 0 10px;letter-spacing:-.5px}
.s-hero p{color:#5e554d}
.s-btn{display:inline-block;margin-top:16px;padding:9px 16px;border-radius:999px;background:#211d1a;color:#fbf8f4;font-size:13px;font-weight:600}
.s-cards{padding:8px 22px 28px}
.s-cards h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:24px;margin-bottom:14px}
.s-grid{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
.s-card{background:#fff;border-radius:10px;overflow:visible;border:1px solid #eee5da;min-width:0}
.s-card .s-card-body{padding:12px 14px 16px}
.s-card h3{font-size:15px}
.s-card p{font-size:13px;color:#6b6158;margin-top:2px}
.s-card .pimg,.s-card .place{border-radius:10px 10px 0 0}
.s-card .pimg{display:block}
@container site (min-width:620px){
  .s-hero{grid-template-columns:1fr 1.15fr;align-items:center;gap:32px;padding:38px 30px}
  .s-hero h1{font-size:38px}
  .s-cards{padding:8px 30px 34px}
  .s-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .s-nav{padding:16px 30px}
}
.pimg{display:block;width:100%;height:auto;border-radius:8px;background:#e9e2d8}
.s-card .pimg{border-radius:10px 10px 0 0}
.place{position:relative;display:block;min-width:0}
.place-pick{padding:0;border:0;background:transparent;width:100%;display:block;border-radius:8px}
.place-pick:hover .pimg{outline:2px solid rgba(39,90,200,.45);outline-offset:-2px}
.sel-frame{position:relative;outline:2px solid var(--ed-action);outline-offset:2px;border-radius:8px}
.s-card .sel-frame{border-radius:10px 10px 0 0}
.sel-frame .size-tag{position:absolute;right:6px;bottom:6px;background:rgba(1,9,37,.72);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;pointer-events:none}

/* ---------- Edit bar (src/components/edit-bar.css) ---------- */
.bar-wrap{position:relative;width:max-content;max-width:var(--barmax,100%);margin-bottom:8px;z-index:20;font-size:13px;color:var(--ed-text);font-family:Inter,-apple-system,"Segoe UI",sans-serif;line-height:1.3}
.eb{display:flex;flex-direction:column;align-items:flex-start}
.eb-label{display:inline-flex;align-items:center;height:24px;padding:0 2px;border-radius:6px 6px 6px 0;background:var(--ed-panel);box-shadow:var(--ed-shadow-s);font-size:12px;font-weight:600;white-space:nowrap;gap:2px}
.eb-label--comp{background:var(--comp-surf);color:var(--comp-text)}
.eb-label .eb-kind{display:inline-flex;align-items:center;gap:5px;padding:0 6px}
.eb-label .i{width:14px;height:14px}
.eb-label .sep{opacity:.7}
.eb-controls{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border-radius:0 8px 8px 8px;background:var(--ed-panel);box-shadow:var(--ed-shadow);max-width:100%}
.eb-group{display:inline-flex;align-items:center;gap:2px;flex-wrap:nowrap}
.eb-rule{width:1px;align-self:stretch;margin:4px 3px;background:var(--ed-line)}
.eb-controls>.eb-group:first-child>.eb-rule{display:none}
.eb-btn{display:inline-flex;align-items:center;gap:5px;min-height:var(--tap);min-width:var(--tap);justify-content:center;border:0;border-radius:6px;padding:0 8px;background:transparent;white-space:nowrap;line-height:1.3}
.eb-btn:hover{background:var(--ed-hover)}
.eb-btn[aria-pressed=true],.eb-btn[aria-expanded=true]{background:var(--ed-action);color:var(--ed-on)}
.eb-btn .sub{font-weight:600;opacity:.75;font-size:12px}
.eb-btn.icon-only{padding:0}
.eb-btn.dim{color:var(--ed-muted)}
.eb-labelled{display:inline-flex;align-items:center;gap:6px;padding-left:6px;white-space:nowrap}
.eb-select{height:var(--tap);border:1px solid var(--ed-line);border-radius:6px;padding:0 6px;background:var(--ed-surface);min-width:0}
.eb-select:hover{background:#fff}

/* popovers off the bar */
.pop{position:absolute;top:100%;left:0;margin-top:6px;width:min(340px,var(--barmax,340px));padding:12px;border-radius:8px;background:var(--ed-panel);box-shadow:var(--ed-shadow);z-index:30;display:flex;flex-direction:column;gap:10px}
.pop-left .pop{left:auto;right:calc(100% + 10px);top:0;margin-top:0;width:var(--popw,340px)}
.pop-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pop-head b{font-size:13px}
.pop .hint{font-size:12px;color:var(--ed-muted);line-height:1.45}
.icon-x{border:0;background:transparent;border-radius:6px;width:var(--tap);height:var(--tap);display:grid;place-items:center}
.icon-x:hover{background:var(--ed-hover)}
.fp-pic{position:relative;border-radius:6px;overflow:hidden;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none;background:#000}
.fp-pic img{display:block;width:100%;height:auto;pointer-events:none}
.fp-win{position:absolute;border:2px solid #fff;border-radius:3px;box-shadow:0 0 0 999px rgba(1,9,37,.55);pointer-events:none}
.fp-dot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;padding:0;background:transparent;border-radius:999px;touch-action:none;cursor:grab;display:grid;place-items:center}
.fp-dot::before{content:"";width:22px;height:22px;border-radius:999px;border:3px solid #fff;background:rgba(39,90,200,.85);box-shadow:0 1px 6px rgba(0,0,0,.55)}
.fp-dot:active{cursor:grabbing}
.fp-dot:focus-visible{outline:none}
.fp-dot:focus-visible::before{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ed-action)}
.fp-pic.off{cursor:default}
.fp-pic.off .fp-dot{display:none}
.pop-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pop-foot .small{font-size:12px;color:var(--ed-muted)}
.ed-btn{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);border:1px solid var(--ed-line);border-radius:6px;padding:0 10px;background:var(--ed-surface);font-weight:550}
.ed-btn:hover{background:#fff}
.ed-btn.primary{background:var(--ed-action);border-color:var(--ed-action);color:var(--ed-on)}
.ed-btn.primary:hover{background:#204ba8}
.shape-off{font-size:12px;line-height:1.45;padding:10px;border-radius:6px;background:rgba(255,255,255,.55)}
.rp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rp-tile{position:relative;padding:0;border:0;border-radius:6px;overflow:hidden;aspect-ratio:1;background:#dfe4f3}
.rp-tile img{width:100%;height:100%;object-fit:cover;display:block}
.rp-tile span{position:absolute;inset:auto 0 0 0;padding:14px 6px 5px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(1,9,37,.72));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-tile:hover img{filter:brightness(1.08)}

/* ---------- Side panel ---------- */
.side h3{font-size:13px;font-weight:650;display:flex;align-items:center;gap:6px}
.side .sub{font-size:12px;color:var(--ed-muted);margin-top:2px}
.pv-list{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
.pv-item{margin:0}
.pv-item figcaption{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ed-muted);margin-bottom:5px}
.pv-viewport{position:relative;overflow:hidden;border-radius:8px;border:1px solid #cdd3ea;background:#fbf8f4;width:100%}
.pv-phone .pv-viewport{width:200px;border-radius:18px;border:6px solid #1c2233}
.pv-frame{position:absolute;top:0;left:0;transform-origin:0 0;pointer-events:none}
.pv-frame .site{border-radius:0;box-shadow:none}
.pv-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.45;border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok-fg)}
.note.info{border-color:#c9d6f5;background:#eef3ff;color:#21386f}
.note .i{width:18px;height:18px;margin-top:1px}
.note .x{margin-left:auto;margin-top:-6px;margin-right:-6px;flex:none;border:0;background:transparent;border-radius:6px;width:var(--tap);height:var(--tap);display:grid;place-items:center;color:inherit}
.note .x:hover{background:rgba(0,0,0,.06)}
.card-box{padding:12px;border-radius:8px;background:#fff;border:1px solid #d9dfef;display:flex;flex-direction:column;gap:8px}
.card-box p{font-size:12.5px;color:var(--ed-muted)}
.mini-media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini-tile{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:1;background:#dfe4f3}
.mini-tile img{width:100%;height:100%;object-fit:cover;display:block}
.mini-tile .nm{position:absolute;inset:auto 0 0 0;padding:16px 7px 6px;color:#fff;font-size:11px;font-weight:600;background:linear-gradient(transparent,rgba(24,34,51,.78));line-height:1.3}
.mini-tile .nm small{display:block;font-weight:500;opacity:.9}
.chip-new{position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;background:#fff;color:var(--primary);border-radius:999px;padding:1px 8px;box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* ---------- Media manager (Tiles look) ---------- */
.mm{padding:16px;color:var(--text);font-size:14px;background:#fff;min-height:520px}
.mm-bar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-bottom:14px}
.mm-search{position:relative}
.mm-search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.mm-search input{width:100%;min-height:44px;border:1px solid #cbd3df;border-radius:999px;padding:0 14px 0 36px;background:var(--subtle)}
.mm-bar select{min-height:44px;border:1px solid var(--line);border-radius:999px;padding:0 12px;background:#fff}
.mm-pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:1px solid var(--line);border-radius:999px;padding:0 14px;background:#fff;font-weight:550}
.mm-pill:hover{background:var(--subtle)}
.mm-pill.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.mm-pill.primary:hover{background:#1749bd}
.mm-pill:disabled{opacity:.5;cursor:default}
.mm-ctx{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#21386f;background:#eef3ff;border:1px solid #c9d6f5;border-radius:999px;padding:4px 6px 4px 12px;margin-bottom:12px;width:max-content;max-width:100%}
.mm-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
@media (max-width:980px){.mm-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:600px){.mm-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mm-tile{position:relative;padding:0;border:0;border-radius:4px;overflow:hidden;aspect-ratio:1;background:#eef1f6;display:block;width:100%}
.mm-tile img{width:100%;height:100%;object-fit:cover;display:block}
.mm-tile .nm{position:absolute;inset:auto 0 0 0;padding:22px 8px 7px;color:#fff;font-size:12px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(transparent,rgba(24,34,51,.78))}
.mm-tile .badge{position:absolute;top:6px;right:6px;display:grid;place-items:center;width:24px;height:24px;border-radius:999px;background:#fff;color:#314766;border:1px solid #c2ccda;box-shadow:0 1px 3px #1822331a;font-size:12px;font-weight:650}
.mm-tile.fresh{outline:3px solid var(--primary);outline-offset:-3px}
.mm-notice{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:12px 14px;background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-line);border-radius:10px;margin-bottom:14px}
.mm-notice .txt{flex:1 1 260px;min-width:0}
.mm-notice .acts{display:flex;gap:8px;flex-wrap:wrap}
.mm-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-width:0}
.mm-head b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm-detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:18px}
@media (max-width:760px){.mm-detail{grid-template-columns:1fr}}
.mm-viewer{background:#f4f5f8;border-radius:12px;padding:14px;display:grid;place-items:center;min-width:0}
.mm-viewer>img{max-width:100%;max-height:420px;border-radius:4px;display:block}
.mm-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.mm-group{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mm-group dt{font-size:12px;color:var(--muted)}
.mm-group dd{margin:0 0 8px;font-weight:550}
.mm-group dd:last-child{margin-bottom:0}
.mm-acts{display:flex;gap:8px;flex-wrap:wrap}
.mm-tools{display:flex;flex-direction:column;gap:10px}
.mm-tools .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slider{display:flex;flex-direction:column;gap:2px}
.slider label{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between}
.slider label span{color:var(--muted);font-weight:500}
.slider input{width:100%;min-height:var(--tap);accent-color:var(--primary)}
.plain{font-size:12.5px;color:var(--muted);line-height:1.45}

/* ---------- Cropper ---------- */
.crop-stage{position:relative;width:min(100%,calc(var(--maxh,420px) * var(--r)));margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;background:#111;border-radius:4px}
.crop-stage canvas{display:block;width:100%;height:100%;border-radius:4px}
.crop-clip{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:4px}
.crop-shade{position:absolute;box-shadow:0 0 0 2000px rgba(8,12,24,.6)}
.crop-win{position:absolute;outline:2px solid #fff;cursor:move;touch-action:none}
.crop-win.fixed-full{cursor:default}
.crop-win:focus-visible{outline:3px solid #8fb0ff}
.crop-win .thirds{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(0deg,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.crop-win .h{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;touch-action:none}
.crop-win .h::before{content:"";width:16px;height:16px;background:#fff;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.h-nw{left:0;top:0;cursor:nwse-resize}.h-ne{left:100%;top:0;cursor:nesw-resize}.h-sw{left:0;top:100%;cursor:nesw-resize}.h-se{left:100%;top:100%;cursor:nwse-resize}
.crop-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

/* ---------- C crop screen ---------- */
.cs{padding:16px;background:#fff;color:var(--text);display:flex;flex-direction:column;gap:14px;font-size:14px}
.cs-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cs-head h2{font-size:17px}
.cs-head .where{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:var(--tap);border:1px solid var(--line);border-radius:999px;padding:0 14px;background:#fff;font-weight:550}
.chips button:hover{background:var(--subtle)}
.chips button[aria-checked=true]{background:var(--selected);border-color:#b8cdf8;color:#173d97}
.chips .sep{width:1px;background:var(--line);margin:4px 2px}
.cs-main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:860px){.cs-main{grid-template-columns:1fr}}
.cs-stage{background:#f4f5f8;border-radius:12px;padding:12px}
.cs-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.cs-status{margin-top:10px;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45;background:#eef3ff;border:1px solid #c9d6f5;color:#21386f}
.cs-status.cut{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-fg)}
.cs-status .i{width:18px;height:18px;margin-top:1px}
.cs-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.cpv h3{font-size:13px;font-weight:650;margin-bottom:6px}
.cutbox{position:relative;overflow:hidden;width:100%;border-radius:8px;background:#222}
.s-card .cutbox{border-radius:10px 10px 0 0}
.cutbox img{position:absolute;max-width:none;display:block}

.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#182233;color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100% - 24px);text-align:center}
@media (max-width:700px){
  .pop{position:static;width:auto;margin-top:6px}
  .bar-wrap{width:auto}
  body{padding:12px 8px 24px}
  .canvas{padding:10px}
  .side{padding:10px}
  .s-hero h1{font-size:28px}
  .mm,.cs{padding:12px}
  .mm-bar{grid-template-columns:minmax(0,1fr) auto}
  .mm-bar .mm-more{display:none}
  .dirs button{flex:1 1 100%}
}
</style>

/* ---------- Cropper (B Media and C) ---------- */
function workDims(c) { const f = c.src; return c.rot % 180 ? { W: f.h, H: f.w } : { W: f.w, H: f.h }; }
function cropRect(c) {
  if (c.shape === "free") return c.rect;

  const s = shapeOf(c.shape);
  const r = s.r || W / H;
  let w = 1, h = 1;
  if (r > W / H) h = (W / r) / H; else w = (H * r) / W;
  w /= c.zoom; h /= c.zoom;
  return { x: (1 - w) * c.fx, y: (1 - h) * c.fy, w, h };
}
function isCut(c) {

  if (c.shape === "free") return !full;

}
function newCrop(file, f, mode, init = {}) {

}
function cropperHTML(c) {
  const { W, H } = workDims(c);
  const r = cropRect(c);
  const free = c.shape === "free";
  const fixedFull = !free && r.w > .995 && r.h > .995;
  const handles = free ? `<span class="h h-nw" data-h="nw"></span><span class="h h-ne" data-h="ne"></span><span class="h h-sw" data-h="sw"></span><span class="h h-se" data-h="se"></span>` : "";
  return `<div class="crop-stage" data-k="crop-stage" style="aspect-ratio:${W} / ${H};--r:${W / H}"><canvas width="${W}" height="${H}"></canvas><div class="crop-clip"><div class="crop-shade" style="${winStyle(r)}"></div></div><div class="crop-win${fixedFull ? " fixed-full" : ""}" tabindex="0" data-k="crop-win" role="group" aria-label="${free ? "Trim area. Arrow keys move it; Shift and arrow keys change its size." : "What this spot shows. Arrow keys move it."}" style="${winStyle(r)}"><span class="thirds"></span>${handles}</div></div>`;
}
const winStyle = r => `left:${r.x * 100}%;top:${r.y * 100}%;width:${r.w * 100}%;height:${r.h * 100}%`;
const WORK = { key: null, canvas: null, url: null };
function workCanvas(c) {
  const key = `${c.file}|${c.rot}|${c.st}`;
  if (WORK.key === key && WORK.canvas) return WORK.canvas;
  const im = imgEl(c.src.src);
  const { W, H } = workDims(c);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const a = Math.abs(c.st) * Math.PI / 180;

  g.fillStyle = "#111"; g.fillRect(0, 0, W, H);
  g.translate(W / 2, H / 2); g.rotate((c.rot + c.st) * Math.PI / 180); g.scale(k, k);

  return cv;
}
function workURL(c) { workCanvas(c); if (!WORK.url) WORK.url = WORK.canvas.toDataURL("image/jpeg", .82); return WORK.url; }
function paintStage(c) {
  const stage = document.querySelector(".crop-stage canvas");
  if (!stage) return;
  const im = imgEl(c.src.src);
  const go = () => { const cv = workCanvas(c); const g = stage.getContext("2d"); stage.width = cv.width; stage.height = cv.height; g.drawImage(cv, 0, 0); updateCutPreviews(); };
  if (im.complete && im.naturalWidth) go(); else im.onload = () => { WORK.key = null; go(); };
}
function updateCropUI(c) {
  const win = document.querySelector(".crop-win");
  const r = cropRect(c);
  if (win) win.setAttribute("style", winStyle(r));
  const shade = document.querySelector(".crop-shade"); if (shade) shade.setAttribute("style", winStyle(r));
  updateCutPreviews();
  const st = document.querySelector(".cs-status");
  if (st) { const cut = isCut(c); st.classList.toggle("cut", cut); st.innerHTML = statusHTML(c); }
  const z = document.querySelector("[data-z-read]"); if (z) z.textContent = `${Math.round(c.zoom * 100)}%`;
  const s = document.querySelector("[data-st-read]"); if (s) s.textContent = `${c.st}°`;
  const save = document.querySelector('[data-act="c-save"]'); if (save) save.disabled = !isCut(c);
}
function updateCutPreviews() {
  const d = D(), c = d.crop;
  if (!c || !d.cropOpen) return;
  const r = cropRect(c), { W, H } = workDims(c);
  const url = workURL(c);
  document.querySelectorAll(".cutbox").forEach(box => {
    box.style.aspectRatio = `${r.w * W} / ${r.h * H}`;
    const im = box.querySelector("img");
    if (im.getAttribute("src") !== url) im.src = url;
    im.style.width = `${100 / r.w}%`; im.style.height = `${100 / r.h}%`;
    im.style.left = `${-r.x / r.w * 100}%`; im.style.top = `${-r.y / r.h * 100}%`;
  });
  fitPreviews();
}

/* ---------- Page ---------- */
function render() {
  const d = D();
  const k = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  const dirs = Object.entries(DIRS).map(([id, v]) => `<button role="tab" aria-selected="${S.dir === id}" data-act="dir" data-dir="${id}" data-k="dir-${id}"><span class="letter">${id}</span><span>${v.title}</span></button>`).join("");
  const info = DIRS[S.dir];
  const exampleSwitch = `<div class="examples"><span class="lbl">Selected picture:</span><div class="seg" role="group" aria-label="Selected picture"><button aria-pressed="${d.sel === "hero"}" data-act="select" data-place="hero" data-k="ex-hero">On the page</button><button aria-pressed="${d.sel === "card"}" data-act="select" data-place="card" data-k="ex-card">Inside a card</button></div><span class="lbl">Also try <b>Replace image…</b> in the edit bar.</span></div>`;
  let body;
  if (S.dir === "B" && d.view === "media") body = mediaHTML(d);
  else if (S.dir === "C" && d.cropOpen) body = cropScreenHTML(d);
  else body = `<div class="ed-body"><div class="canvas" data-canvas>${siteHTML(d, "canvas")}</div>${sideHTML(d)}</div>`;
  const tabs = S.dir === "B" ? `<div class="ed-tabs"><button aria-pressed="${d.view === "page"}" data-act="to-page" data-k="tab-page">Page</button><button aria-pressed="${d.view === "media"}" data-act="open-media" data-k="tab-media">${ic("image-square")}Media</button></div>` : `<div class="ed-tabs"></div>`;
  document.getElementById("app").innerHTML = `
    <header class="intro"><h1>Crop and focus point — three ways</h1><p>A pretend website open in the editor, with one picture selected. Everything is clickable. Switch between the three ways to compare them.</p></header>
    <div class="dirs" role="tablist" aria-label="Way to compare">${dirs}</div>
    <div class="dir-sum"><p>${info.sum}</p><p class="try">${info.tryIt}</p></div>
    ${exampleSwitch}
    <div class="editor" role="tabpanel" aria-label="${info.title}">
      <div class="ed-top"><span class="ed-site">Studio Lights</span><span class="ed-page">/ Home</span><span class="ed-devices" aria-hidden="true"><span class="on">${ic("desktop")}</span><span>${ic("device-mobile")}</span></span>${tabs}</div>
      ${body}
      ${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ""}
    </div>`;
  after();
  if (k) { const el = document.querySelector(`[data-k="${CSS.escape(k)}"]`); if (el) el.focus({ preventScroll: true }); }
}
function after() {
  const d = D();
  const canvas = document.querySelector("[data-canvas]");
  const placeEl = document.querySelector(".place.is-sel");
  if (canvas && placeEl) {
    const cr = canvas.getBoundingClientRect(), pr = placeEl.getBoundingClientRect();
    placeEl.style.setProperty("--barmax", `${Math.max(240, cr.right - pr.left - 12)}px`);
    const wrap = placeEl.querySelector(".bar-wrap");
    const room = pr.left - cr.left - 12;
    if (wrap) { wrap.classList.toggle("pop-left", room >= 290 && innerWidth > 700); placeEl.style.setProperty("--popw", `${Math.min(340, room)}px`); }
  }
  updateFocusUI();
  if (d.crop && ((S.dir === "B" && d.media.cropping && d.view === "media") || (S.dir === "C" && d.cropOpen))) paintStage(d.crop);
  fitPreviews();
}
function fitPreviews() {
  const d = D();
  document.querySelectorAll(".pv-viewport").forEach(vp => {
    const frame = vp.firstElementChild, w = +vp.dataset.w, maxh = +vp.dataset.maxh;
    const k = vp.clientWidth / w;
    frame.style.transform = `scale(${k})`;
    const total = frame.scrollHeight * k;
    const target = frame.querySelector(`[data-place="${d.sel}"],[data-cut="${d.sel}"]`);
    let shift = 0;
    if (target && total > maxh) {
      const top = target.getBoundingClientRect().top - frame.getBoundingClientRect().top;
      const h = target.getBoundingClientRect().height;
      if (top + h > maxh - 8 || top > maxh * .45) shift = Math.min(top - 16, total - maxh);
      shift = Math.max(0, shift);
    }
    frame.style.transform = `translateY(${-shift}px) scale(${k})`;
    vp.style.height = `${Math.min(total, maxh)}px`;
  });
}
function applyPlace(key) {
  const d = D(), p = d.places[key];
  document.querySelectorAll(`.pimg[data-place="${key}"]`).forEach(im => im.setAttribute("style", placeStyle(p)));
  const tag = document.querySelector(".sel-frame .size-tag"); if (tag) tag.textContent = tagText(p);
  updateFocusUI();
  fitPreviews();
}
function updateFocusUI() {
  const pic = document.querySelector(".fp-pic");
  if (!pic) return;
  const d = D(), key = pic.dataset.place, p = d.places[key], f = d.files[p.file], s = shapeOf(p.shape);
  const dot = pic.querySelector(".fp-dot"), win = pic.querySelector(".fp-win");
  dot.style.left = pct(p.fx); dot.style.top = pct(p.fy);
  const R = f.w / f.h, r = s.r || R;
  let w = 1, h = 1; if (r < R) w = r / R; else h = R / r;
  win.style.width = `${w * 100}%`; win.style.height = `${h * 100}%`;
  win.style.left = `${(1 - w) * p.fx * 100}%`; win.style.top = `${(1 - h) * p.fy * 100}%`;
  win.style.display = s.r ? "" : "none";
  const x = Math.round(p.fx * 100), y = Math.round(p.fy * 100);
  dot.setAttribute("aria-valuenow", x);
  dot.setAttribute("aria-valuetext", `${x}% across, ${y}% down`);
  const read = document.querySelector("[data-fp-read]");
  if (read) read.textContent = s.r ? (x === 50 && y === 50 ? "In the middle" : `${x}% across, ${y}% down`) : "";
}

/* ---------- Actions ---------- */
let toastTimer;
function toast(msg) { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; const t = document.querySelector(".toast"); if (t) t.remove(); }, 2600); }
function shapeName(p) { return shapeOf(p.shape).label; }
function replaceInPlace(d, key, file, how) {
  const p = d.places[key], had = p.cut;
  p.file = file; p.fx = .5; p.fy = .5; p.cut = null;
  const shapeTxt = shapeOf(p.shape).r ? `The shape (<b>${shapeName(p)}</b>) stays with this spot.` : "The shape stays Original.";
  d.note = { html: `<b>${how}</b> ${shapeTxt} The focus point went back to the middle, because it was set for the old picture.${had ? " The earlier trimmed picture stays in Media." : ""}` };
}
function openCropC(d) {
  const p = d.places[d.sel];
  if (p.cut) d.crop = newCrop(p.cut.source, d.files[p.cut.source], "place", JSON.parse(JSON.stringify(p.cut.params)));
  else d.crop = newCrop(p.file, d.files[p.file], "place", { shape: p.shape, fx: p.fx, fy: p.fy });
  d.cropOpen = true; d.pop = null;
}
function cropName(d, base) {
  const stem = base.replace(/\.[a-z0-9]+$/i, "").replace(/-crop(-\d+)?$/, "");
  let n = `${stem}-crop.webp`, i = 2;
  while (d.files[n]) n = `${stem}-crop-${i++}.webp`;
  return n;
}
function makeFile(c) {
  const cv = workCanvas(c), r = cropRect(c);
  const sx = Math.round(r.x * cv.width), sy = Math.round(r.y * cv.height), sw = Math.max(1, Math.round(r.w * cv.width)), sh = Math.max(1, Math.round(r.h * cv.height));
  const out = document.createElement("canvas"); out.width = sw; out.height = sh;
  out.getContext("2d").drawImage(cv, sx, sy, sw, sh, 0, 0, sw, sh);
  let src = out.toDataURL("image/webp", .85);
  if (!src.startsWith("data:image/webp")) src = out.toDataURL("image/jpeg", .85);
  return { src, w: sw, h: sh, kb: Math.round(src.length * .75 / 1024) };
}
function addFile(d, name, data, from, uses) {
  d.files[name] = { ...data, alt: d.files[from].alt, uses, from };
  imgEl(data.src);
  const i = d.order.indexOf(from);
  d.order = d.order.filter(n => n !== name);
  d.order.splice(i + 1, 0, name);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) { closePopOnOutside(e); return; }
  const d = D(), act = t.dataset.act;
  switch (act) {
    case "dir": S.dir = t.dataset.dir; S.toast = null; WORK.key = null; render(); break;
    case "select": d.sel = t.dataset.place; d.pop = null; d.note = null; if (S.dir === "B") d.view = "page"; if (S.dir === "C") d.cropOpen = false; render(); scrollToSel(); break;
    case "pop": d.pop = d.pop === t.dataset.pop ? null : t.dataset.pop; render(); break;
    case "pop-close": { const which = d.pop; d.pop = null; render(); const b = document.querySelector(`[data-k="eb-${which}"]`); if (b) b.focus({ preventScroll: true }); } break;
    case "fp-reset": { const p = d.places[d.sel]; p.fx = .5; p.fy = .5; applyPlace(d.sel); } break;
    case "replace": replaceInPlace(d, d.sel, t.dataset.file, `${esc(t.dataset.file)} is in.`); d.pop = null; render(); break;
    case "note-close": d.note = null; render(); break;
    case "inert": toast("Not part of this mockup"); break;
    case "open-media": d.view = "media"; d.pop = null; d.media.detail = d.places[d.sel].file; d.media.cropping = false; render(); break;
    case "to-page": d.view = "page"; d.media.cropping = false; render(); break;
    case "mm-open": d.media.detail = t.dataset.file; d.media.cropping = false; render(); break;
    case "mm-back": if (d.media.cropping) d.media.cropping = false; else d.media.detail = null; render(); break;
    case "mm-crop": d.crop = newCrop(d.media.detail, d.files[d.media.detail], "media"); d.media.cropping = true; render(); break;
    case "use-file": { const name = d.media.detail; if (name !== d.places[d.sel].file) { replaceInPlace(d, d.sel, name, `Now using ${esc(name)} here.`); } d.view = "page"; d.media.detail = null; render(); } break;
    case "use-here": { const name = d.media.fresh; const f = d.files[name]; replaceInPlace(d, d.sel, name, `Now using ${esc(name)} here.`); f.uses = ["Home"]; d.note.html += ` Other pages still use ${esc(f.from)}.`; d.media.fresh = null; d.view = "page"; render(); scrollToSel(); } break;
    case "fresh-close": d.media.fresh = null; render(); break;
    case "c-rot": { const c = d.crop; c.rot = (c.rot + 90) % 360; c.rect = { x: 0, y: 0, w: 1, h: 1 }; c.fx = c.fy = .5; render(); } break;
    case "c-reset": { const c = d.crop; Object.assign(c, { rot: 0, st: 0, zoom: 1, fx: .5, fy: .5, rect: { x: 0, y: 0, w: 1, h: 1 } }); render(); } break;
    case "c-shape": { const c = d.crop, prev = cropRect(c); c.shape = t.dataset.shape; if (c.shape === "free") c.rect = { ...prev }; else { c.zoom = Math.min(c.zoom, 3); } render(); } break;
    case "c-cancel":
      if (S.dir === "B") { d.media.cropping = false; } else { d.cropOpen = false; }
      d.crop = null; render(); if (S.dir === "C") scrollToSel(); break;
    case "c-save": {
      const c = d.crop, data = makeFile(c), name = cropName(d, c.file);
      addFile(d, name, data, c.file, []);
      d.media.cropping = false; d.media.detail = null; d.media.fresh = name; d.crop = null; render();
      document.querySelector(".editor").scrollIntoView({ block: "start", behavior: "smooth" });
    } break;
    case "c-done": {
      const c = d.crop, p = d.places[d.sel];
      if (!isCut(c)) {
        const wasCut = !!p.cut;
        p.file = c.file; p.shape = c.shape === "free" ? "original" : c.shape; p.fx = c.fx; p.fy = c.fy; p.cut = null;
        d.note = wasCut ? { kind: "info", html: "This spot is back to the original picture. The trimmed picture stays in Media." } : null;
      } else {
        const data = makeFile(c);
        const name = p.cut ? p.file : cropName(d, c.file);
        addFile(d, name, data, c.file, ["Home"]);
        p.cut = { source: c.file, params: JSON.parse(JSON.stringify({ rot: c.rot, st: c.st, shape: c.shape, zoom: c.zoom, fx: c.fx, fy: c.fy, rect: c.rect })) };
        p.file = name; p.shape = c.shape === "free" ? "original" : c.shape; p.fx = .5; p.fy = .5;
        d.note = { html: `<b>Saved as a new picture in Media; other pages still use the original.</b> This spot now shows ${esc(name)}.` };
      }
      d.cropOpen = false; d.crop = null; render(); scrollToSel();
    } break;
    case "crop-open": openCropC(d); render(); document.querySelector(".editor").scrollIntoView({ block: "start", behavior: "smooth" }); break;
  }
});
function closePopOnOutside(e) {
  const d = D();
  if (d.pop && !e.target.closest(".bar-wrap")) { d.pop = null; render(); }
}
function scrollToSel() {
  const el = document.querySelector(".place.is-sel");
  if (el) { const r = el.getBoundingClientRect(); if (r.top < 0 || r.top > innerHeight - 120) el.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
document.addEventListener("change", e => {
  const t = e.target, d = D();
  if (t.dataset.act === "shape") {
    const p = d.places[d.sel]; p.shape = t.value;
    if (d.pop === "focus") render(); else applyPlace(d.sel);
  }
});
document.addEventListener("input", e => {
  const t = e.target, d = D(), c = d.crop;
  if (!c) return;
  if (t.dataset.act === "c-zoom") { c.zoom = +t.value; updateCropUI(c); }
  if (t.dataset.act === "c-st") { c.st = +t.value; paintStage(c); updateCropUI(c); }
});

/* Focus dot and crop area: pointer + keyboard */
let drag = null;
document.addEventListener("pointerdown", e => {
  const pic = e.target.closest(".fp-pic");
  if (pic && !pic.classList.contains("off")) {
    e.preventDefault();
    pic.setPointerCapture(e.pointerId);
    drag = { kind: "focus", el: pic, key: pic.dataset.place };
    moveFocus(e);
    pic.querySelector(".fp-dot").focus({ preventScroll: true });
    return;
  }
  const stage = e.target.closest(".crop-stage");
  if (stage) {
    const c = D().crop; if (!c) return;
    e.preventDefault();
    stage.setPointerCapture(e.pointerId);
    const sr = stage.getBoundingClientRect();
    const h = e.target.closest(".h"), win = e.target.closest(".crop-win");
    const r0 = { ...cropRect(c) };
    if (h) drag = { kind: "resize", h: h.dataset.h, sr, sx: e.clientX, sy: e.clientY, r0 };
    else {
      if (!win) { // jump the area to the pointer, then move it
        const px = (e.clientX - sr.left) / sr.width, py = (e.clientY - sr.top) / sr.height;
        setRectPos(c, px - r0.w / 2, py - r0.h / 2);
      }
      drag = { kind: "move", sr, sx: e.clientX, sy: e.clientY, r0: { ...cropRect(c) } };
    }
    stage.querySelector(".crop-win").focus({ preventScroll: true });
    updateCropUI(c);
  }
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  if (drag.kind === "focus") { moveFocus(e); return; }
  const c = D().crop; if (!c) return;
  const dx = (e.clientX - drag.sx) / drag.sr.width, dy = (e.clientY - drag.sy) / drag.sr.height, r0 = drag.r0;
  if (drag.kind === "move") setRectPos(c, r0.x + dx, r0.y + dy);
  else resizeRect(c, drag.h, r0, dx, dy);
  updateCropUI(c);
});
const endDrag = () => { drag = null; };
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
function moveFocus(e) {
  const r = drag.el.getBoundingClientRect(), p = D().places[drag.key];
  p.fx = clamp((e.clientX - r.left) / r.width); p.fy = clamp((e.clientY - r.top) / r.height);
  applyPlace(drag.key);
}
function setRectPos(c, x, y) {
  if (c.shape === "free") { const r = c.rect; r.x = clamp(x, 0, 1 - r.w); r.y = clamp(y, 0, 1 - r.h); return; }
  const r = cropRect(c);
  if (1 - r.w > 1e-4) c.fx = clamp(x / (1 - r.w));
  if (1 - r.h > 1e-4) c.fy = clamp(y / (1 - r.h));
}
function resizeRect(c, h, r0, dx, dy) {
  const min = .1;
  let { x, y, w, h: hh } = r0, x2 = x + w, y2 = y + hh;
  if (h.includes("w")) x = clamp(x + dx, 0, x2 - min);
  if (h.includes("e")) x2 = clamp(x2 + dx, x + min, 1);
  if (h.includes("n")) y = clamp(y + dy, 0, y2 - min);
  if (h.includes("s")) y2 = clamp(y2 + dy, y + min, 1);
  c.rect = { x, y, w: x2 - x, h: y2 - y };
}
document.addEventListener("keydown", e => {
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const t = e.target;
  if (e.key === "Escape") { const d = D(); if (d.pop) { const which = d.pop; d.pop = null; render(); const b = document.querySelector(`[data-k="eb-${which}"]`); if (b) b.focus(); } return; }
  if (!arrows[e.key]) return;
  const [ax, ay] = arrows[e.key];
  if (t.classList.contains("fp-dot")) {
    e.preventDefault();
    const d = D(), p = d.places[t.closest(".fp-pic").dataset.place], step = e.shiftKey ? .1 : .02;
    p.fx = clamp(p.fx + ax * step); p.fy = clamp(p.fy + ay * step);
    applyPlace(t.closest(".fp-pic").dataset.place);
  } else if (t.classList.contains("crop-win")) {
    e.preventDefault();
    const c = D().crop, step = .02, r = { ...cropRect(c) };
    if (e.shiftKey && c.shape === "free") resizeRect(c, ax ? "e" : "s", r, ax * step, ay * step);
    else if (c.shape === "free") setRectPos(c, r.x + ax * step, r.y + ay * step);
    else { if (ax && 1 - r.w > 1e-4) c.fx = clamp(c.fx + ax * .05); if (ay && 1 - r.h > 1e-4) c.fy = clamp(c.fy + ay * .05); }
    updateCropUI(c);
  }
});
let rz; addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { after(); }); });
Object.values(IMGS).forEach(v => imgEl(v.src));
render();
</script>
