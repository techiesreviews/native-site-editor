const fresh=(variant)=>({variant,editorTab:'media',siteFile:'home-html',selectedPage:'home',files:structuredClone(seed),screen:'library',libraryAll:true,collectionsOpen:false,collectionReturn:null,view:variant===1?'list':'grid',filtersOpen:false,uploadFromPicker:false,pickerOpen:false,placements:{image:null,video:null,pdf:null},search:'',kind:'all',folder:'all',tag:'all',usage:'all',selected:[],activeUsage:null,usageReturn:null,detailId:null,detailBack:'library',message:'',upload:{step:0,files:[],version:'smaller',percent:0,failed:false,added:false},target:'image',picked:null,placed:null,focusOpen:false,focusX:50,focusY:50,cleanGroup:null,cleanPhase:'groups',removed:[]});
const fileById=id=>state.files.find(f=>f.id===id);
const sizeText=k=>k>=1000?`${(k/1000).toFixed(1)} MB`:`${k} KB`;

const usageText=f=>!f.checked?'Not checked yet':pageCount(f)?`Used on ${pageCount(f)} ${pageCount(f)===1?'page':'pages'}`:f.other.length?'Other uses found':'No uses found';
const badgeText=f=>!f.checked?'Not checked yet':pageCount(f)?usageText(f):f.other.length?'0 pages · Other uses found':'No uses found';
function usageBadge(f,list=false){return `<button class="usage-badge ${list?'list-badge':''}" data-action="usage" data-id="${f.id}" aria-label="${escapeHtml(f.name)}: ${badgeText(f)}. Show usage" aria-haspopup="dialog"><span class="badge-number">${f.checked?pageCount(f):'?'}</span><span class="badge-label">${badgeText(f)}</span></button>`;}
function usageDialog(){if(!state.activeUsage)return '';const f=fileById(state.activeUsage);if(!f)return '';const pages=[...new Set(f.pages.map(page=>page.split(' — ')[0]))];return `<dialog id="usage-dialog" class="usage-dialog" aria-labelledby="usage-title"><div class="usage-dialog-head"><div><p class="eyebrow">FILE USAGE</p><h2 id="usage-title">${escapeHtml(f.name)}</h2></div>${btn(icon('close')+'<span class="sr-only">Close usage</span>','close-usage','quiet')}</div><p class="scope-note">${f.checked?'Sample check: pages and site settings · today':'Not checked yet. The sample check covers pages and site settings.'}</p><h3>${f.checked?(pages.length?usageText(f):'0 pages'):'Not checked yet'}</h3>${pages.length?`<ul class="usage-list">${pages.map(page=>`<li>${escapeHtml(page)}</li>`).join('')}</ul>`:f.checked?'<p class="small muted" style="margin-top:6px">No page uses found.</p>':''}<h3 style="margin-top:20px">Other uses</h3>${f.other.length?`<ul class="usage-list">${f.other.map(use=>`<li>${escapeHtml(use)}</li>`).join('')}</ul>`:`<p class="small muted" style="margin-top:6px">${f.checked?'No other uses found in the places checked.':'Not checked yet.'}</p>`}${f.checked&&!used(f)?'<div class="warning"><strong>No uses found.</strong> Some uses may be missed. This does not guarantee that removing the file is safe.</div>':''}<div class="usage-dialog-actions">${btn('File details','usage-details','',`data-id="${f.id}"`)}${btn('Close','close-usage','primary')}</div></dialog>`;}

function mediaScope(){return state.pickerOpen?({image:'All images',video:'All videos',audio:'All audio',pdf:'All PDFs',download:'All downloads'}[state.target]):({all:'All media',image:'Images',video:'Video',audio:'Audio',documents:'Documents'}[state.kind]);}

function filters(choosing=state.pickerOpen){const activeKind=choosing?(state.target==='pdf'||state.target==='download'?'documents':state.target):state.kind;const kinds=[['all','All'],['image','Images'],['video','Video'],['audio','Audio'],['documents','Documents']];return `<div class="filters">${searchInput()}<div class="kind-buttons" role="group" aria-label="Media kind">${kinds.map(([kind,label])=>btn(label,'kind',activeKind===kind?'active':'',`data-kind="${kind}" aria-pressed="${activeKind===kind}" ${choosing&&activeKind!==kind?'disabled':''}`)).join('')}</div></div>`;}
function extraFilters(){return `<div id="collection-filters" class="extra-filters ${state.filtersOpen?'open':''}"><div class="filter"><label class="sr-only" for="folder">Collection</label><select id="folder" data-field="folder">${options([['all','All collections'],...folderNames.map(f=>[f,f])],state.folder)}</select></div></div>`;}
function filtered(choosing=false){return state.files.filter(f=>(!(choosing||state.pickerOpen)||f.kind===state.target)&&(choosing||state.pickerOpen||state.kind==='all'||(state.kind==='documents'?f.kind==='pdf'||f.kind==='download':f.kind===state.kind))&&(state.folder==='all'||f.memberships.includes(state.folder))&&`${f.name} ${f.memberships.join(' ')}`.toLowerCase().includes(state.search.toLowerCase()));}
function selected(f,choosing){return choosing?state.picked===f.id:state.selected.includes(f.id);}
function mediaRatio(f){if(f.image&&assetDimensions[f.image]){const [w,h]=assetDimensions[f.image];return w/h;}return f.kind==='video'?16/9:1;}

function fileGrid(files,choosing=state.pickerOpen){if(!files.length)return `<div class="empty"><h3>No matching media</h3>${!state.pickerOpen&&state.kind!=='all'?btn(state.search?'Search all media':'Show all media','search-all-media'):btn('Clear filters','clear-filters')}</div>`;return `<div class="photo-gallery photo-grid ${photoDirection}-grid">${files.map(f=>photoTile(f,choosing)).join('')}</div>`;}

function layoutPhotoTiles(){photoObserver?.disconnect();markSmallPreviews();photoObserver??=new ResizeObserver(entries=>{for(const entry of entries){if(Math.abs(entry.contentRect.width-Number(entry.target.dataset.gridWidth||0))>.5){entry.target.dataset.gridWidth=entry.contentRect.width;markSmallPreviews();}}});document.querySelectorAll('.photo-grid').forEach(gallery=>{gallery.dataset.gridWidth=gallery.getBoundingClientRect().width;photoObserver.observe(gallery);});}

function fileList(files,choosing=state.pickerOpen){if(!files.length)return fileGrid(files,choosing);return `<div class="list"><div class="list-head"><span></span><span>File · details</span><span>Size</span><span>Usage</span></div>${files.map(f=>`<article class="file-row ${selected(f,choosing)?'selected':''}"><button class="row-select" data-action="${choosing?'pick':'select'}" data-id="${f.id}" aria-pressed="${selected(f,choosing)}" aria-label="${choosing?'Choose':'Select'} ${escapeHtml(f.name)}"><span>${icon('check')}</span></button><button class="row-open" data-action="${choosing?'pick':'detail'}" data-id="${f.id}">${thumb(f)}<div class="row-title"><span class="file-name">${escapeHtml(f.name)}</span><div class="file-info">${kindName(f.kind)}${f.dimensions?' · '+f.dimensions:f.duration?' · '+f.duration:''}</div></div></button><div class="row-size">${sizeText(f.size)}</div><div class="row-usage">${usageBadge(f,true)}${f.kind==='image'&&!f.description?'<br><span style="color:#80551c">Description missing</span>':''}</div></article>`).join('')}</div>`;}

function selectionBar(){if(state.pickerOpen||!state.selected.length)return '';return `<div class="selection-bar"><strong>${state.selected.length} selected</strong><div class="actions"><select id="add-group" aria-label="Add selected files to a collection">${options(folderNames.map(f=>[f,f]),'Studio art')}</select>${btn('Add to…','add-group')}${btn('Select all','select-all','quiet')}${state.folder!=='all'?btn('Remove from collection','remove-membership'):''}${btn('Review removal','review-selection')}${btn('Clear','clear-selection','quiet')}</div></div>`;}

function library(){const files=filtered();const kind=mediaScope();const heading=state.search?'Search results · '+kind+(state.folder!=='all'?' · '+state.folder:''):state.folder!=='all'?state.folder+' · '+kind:kind;return `<h2 id="library-title" class="sr-only library-anchor" tabindex="-1">${escapeHtml(heading)}</h2><div class="library-tools">${filters()}${toolbar(files)}${extraFilters()}</div>${state.view==='grid'?fileGrid(files):fileList(files)}${selectionBar()}`;}

function detail(){const f=fileById(state.detailId);if(!f)return empty('File is no longer in this demo','Return to your library.',btn('Back to library','library'));return `<div class="detail-heading">${btn(icon('arrow')+' Back','detail-back','quiet')}<h2>${escapeHtml(f.name)}</h2></div><div class="detail-layout"><div><div class="detail-preview">${thumb(f)}<dl class="facts"><div><dt>Kind</dt><dd>${kindName(f.kind)}</dd></div><div><dt>Size</dt><dd>${sizeText(f.size)}</dd></div>${f.dimensions?`<div><dt>Dimensions</dt><dd>${f.dimensions} pixels</dd></div>`:''}${f.duration?`<div><dt>Length</dt><dd>${f.duration}</dd></div>`:''}<div><dt>Added</dt><dd>${addedLabel(f.addedDate)}</dd></div></dl></div>${f.kind==='image'?`<details class="copies"><summary>Responsive copies (${f.copies.length})</summary><p>These belong to this image. Visitors get the size that fits their screen.</p>${f.copies.map(([label,dims,size])=>`<div class="copy-row"><span>${label} · ${dims}</span><span>${size}</span></div>`).join('')}</details>`:''}<details class="detail-info detail-usage"><summary>Usage · ${usageText(f)}</summary><p class="scope-note">${f.checked?'Sample check: pages and site settings · today':'Not checked yet. The sample check covers pages and site settings.'}</p><h3>${f.pages.length?usageText(f):'Used on pages'}</h3>${f.pages.length?`<ul class="usage-list">${f.pages.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>`:`<p class="small muted">${f.checked?'No page uses found.':'Not checked yet.'}</p>`}<h3 style="margin-top:16px">Other uses</h3>${f.other.length?`<ul class="usage-list">${f.other.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>`:`<p class="small muted">${f.checked?'No other uses found in the places checked.':'Not checked yet.'}</p>`}${f.checked&&!used(f)?'<div class="warning">No uses found does not mean safe to remove. Some uses may be outside the places checked.</div>':''}</details></div><form id="detail-form"><div class="field"><label for="file-name">File name</label><input id="file-name" name="name" value="${escapeHtml(f.name)}" required></div><details class="membership-panel"><summary>Collections · ${f.memberships.length}</summary><fieldset class="membership-field"><legend class="sr-only">Collections</legend>${folderNames.map(group=>`<label class="check"><input type="checkbox" name="memberships" value="${escapeHtml(group)}" ${f.memberships.includes(group)?'checked':''}>${escapeHtml(group)}</label>`).join('')}</fieldset></details>${f.kind==='image'?`<div class="field"><label for="description">Describe this image</label><textarea id="description" name="description" ${f.decorative?'disabled':''}>${escapeHtml(f.description)}</textarea><div class="hint">Help people who cannot see the image understand what it shows.</div><label class="check"><input type="checkbox" name="decorative" data-action="decorative" ${f.decorative?'checked':''}>This image is only decoration</label></div>`:''}${f.kind==='image'?'<p class="small muted" style="margin:0 0 18px">Set the focus point from the image’s edit bar on each page.</p>':f.kind==='pdf'?'<p class="small muted" style="margin:0 0 18px">PDFs are kept as they are when added.</p>':''}<div class="detail-actions">${btn('Cancel','detail-back','', 'type="button"')}<button class="primary" type="submit">Save details</button></div></form></div>`;}
function steps(){return `<div class="steps" aria-label="Add files progress">${['Choose files','Optimise','Add to library'].map((label,i)=>`${i?'<span class="rule"></span>':''}<span class="step ${Math.min(state.upload.step,2)===i?'active':''}"><i>${state.upload.step>i?'✓':i+1}</i>${label}</span>`).join('')}</div>`;}
function upload(){const u=state.upload;let content='';if(u.step===0){content=`<div class="drop-zone">${icon('upload')}<h3>Add something new</h3><p>Choose images, videos, audio, PDFs or downloads from your device.</p><div class="actions">${btn('Choose files','device-files','primary')}${btn('Load sample files','sample-files')}</div><input id="device-input" class="file-input" type="file" multiple></div><p class="small muted">This is a working demo. Files and savings shown here are examples.</p>`;}else if(u.step===1){const image=u.files.find(f=>f.kind==='image');const total=u.files.reduce((s,f)=>s+f.size,0);const saving=u.version==='smaller'?u.files.reduce((s,f)=>s+(f.kind==='image'?Math.round(f.size*.82):0),0):0;content=`<p class="muted small">Choose your image version. Other files are kept as they are.</p>${image?`<div class="optimise-compare"><button class="version-card ${u.version==='original'?'chosen':''}" data-action="original" aria-pressed="${u.version==='original'}">${thumb(image)}<span class="version-label"><strong>Original</strong><p>${sizeText(image.size)} · Full size</p></span></button><button class="version-card ${u.version==='smaller'?'chosen':''}" data-action="smaller" aria-pressed="${u.version==='smaller'}">${thumb(image)}<span class="version-label"><strong>Smaller copy</strong> <span class="badge">Recommended</span><p>${sizeText(Math.round(image.size*.18))} · Same picture</p></span></button></div><p class="small muted" style="margin:12px 0">${u.version==='smaller'?'Demo uses the smaller copy. Keeping originals is still to decide.':'Demo uses the original. Keeping an original beside a smaller copy is still to decide.'}</p><div class="saving"><strong>${saving?sizeText(saving)+' smaller':'Keep the original size'}</strong><p class="small">${sizeText(total)} before · ${sizeText(total-saving)} after. Demo estimates.</p></div>`:'<div class="notice">These files are kept as they are. No image changes are needed.</div>'}${u.files.map(f=>`<div class="upload-item">${thumb(f)}<div class="upload-text"><span class="file-name">${escapeHtml(f.name)}</span><span class="small muted">${f.kind==='image'?(u.version==='smaller'?'Smaller image + responsive copies':'Original image + responsive copies'):kindName(f.kind)+' · Kept as is'}</span></div><span class="small">${sizeText(f.kind==='image'&&u.version==='smaller'?Math.round(f.size*.18):f.size)}</span></div>`).join('')}<div class="field" style="margin-top:20px"><label for="upload-folder">Add to collection</label><select id="upload-folder" data-field="uploadFolder">${options(folderNames.map(v=>[v,v]),u.folder||'Studio art')}</select></div><div class="upload-footer">${btn('Back','upload-back')}${btn('Add '+u.files.length+' files','start-upload','primary')}</div>`;}else{const complete=u.percent===100&&!u.failed;const canReturn=state.uploadFromPicker&&u.files.some(f=>f.kind===state.target&&fileById(f.id));content=`<h3>${complete?'Your files are ready':u.failed?'One file needs another try':'Adding your files'}</h3><p class="small muted" style="margin-top:6px">${complete?'Find them in your library, with every image’s copies kept together.':'Demo progress. You can return to the library while this finishes.'}</p><div class="progress-track" role="progressbar" aria-label="Files added" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${u.percent}"><span style="width:${u.percent}%"></span></div><p class="small muted">${u.failed?'Finished · 1 file to retry':u.percent+'% complete'}</p>${u.files.map((f,i)=>`<div class="upload-item">${thumb(f)}<div class="upload-text"><span class="file-name">${escapeHtml(f.name)}</span><span class="small muted">${u.failed&&i===u.files.length-1?'Could not add this file. Try again.':u.percent===100?'Added to '+(u.folder||'Studio art'):'Adding… '+u.percent+'%'}</span></div>${u.failed&&i===u.files.length-1?btn('Retry','retry-upload'):u.percent===100?'<span class="badge">'+icon('check')+' Added</span>':''}</div>`).join('')}<div class="upload-footer">${canReturn?btn('Back to choosing','back-to-choosing','primary'):btn('Back to library','library')}${complete?btn('Add more files','add-more','primary'):!u.failed?btn('Cancel adding','cancel-upload'):''}</div>`;}return `<div class="upload-layout"><div class="detail-heading">${btn(icon('arrow')+' Back',state.uploadFromPicker?'upload-return':'library','quiet')}<h2>${u.step===0?'Add files':u.step===1?'Optimise':'Adding files'}</h2></div>${u.files.length>1?'<p class="small muted" style="margin-bottom:16px">One sample shows how a failed upload is retried.</p>':''}${content}</div>`;}
function pickerViewKey(){if(state.screen!=='library')return state.screen;return state.collectionsOpen?'library:collections':state.folder!=='all'?'library:collection:'+state.folder:'library:all-media';}
function pickerDialog(){if(!state.pickerOpen)return '';const content=state.screen==='upload'?upload():state.screen==='detail'?detail():library();return `<dialog id="media-picker" class="media-picker" data-screen="${state.screen}" data-view="${escapeHtml(pickerViewKey())}" aria-labelledby="picker-title"><header class="picker-head"><div><h2 id="picker-title">Choose ${kindName(state.target).toLowerCase()}</h2><p class="small muted">${targetName()}</p></div><div class="actions">${state.screen==='library'?btn(icon('upload')+' Add files','picker-upload'):''}${btn(icon('close')+'<span class="sr-only">Close media picker</span>','close-picker','quiet picker-close')}</div></header>${state.message?`<div class="notice" role="status"><span>${escapeHtml(state.message)}</span>${btn(icon('close')+'<span class="sr-only">Dismiss message</span>','dismiss','quiet')}</div>`:''}${state.upload.failed&&state.screen==='library'?btn('1 file needs retry','retry-pending','retry-notice'):''}${content}${state.screen==='library'?`<footer class="choose-bottom"><span class="small muted">${state.picked?'1 selected':'Choose one '+kindName(state.target).toLowerCase()}</span><div class="actions">${btn('Cancel','close-picker')}${btn('Use '+kindName(state.target).toLowerCase(),'place','primary',state.picked?'':'disabled')}</div></footer>`:''}</dialog>`;}
function targetName(){return state.target==='image'?'Home · Welcome image':state.target==='video'?'Home · Studio showreel':'Contact · Guide download';}
function placed(){const f=fileById(state.placed);return `<div class="screen-title"><div><h2>Chosen for your page</h2><p>${targetName()}</p></div>${btn('Back to library','library')}</div><div class="notice">${icon('check')}<span>${escapeHtml(f.name)} is now in this place in the demo.</span></div><div class="page-preview"><div class="page-copy"><p class="eyebrow">NEON STUDIO</p><h2>${state.target==='image'?'Ideas with a little more colour.':state.target==='video'?'See the studio in motion.':'Start something bright.'}</h2><p>${state.target==='pdf'?'Get our guide to working together.':'Independent design. Unexpected light. Made for people.'}</p></div><div class="focus-preview" style="--focus-x:${state.focusX}%;--focus-y:${state.focusY}%">${thumb(f)}${state.focusOpen&&f.kind==='image'?'<span class="focus-dot"></span>':''}</div><div class="edit-bar"><strong>${kindName(f.kind)} edit bar · this place</strong>${btn('Replace','replace')}${f.kind==='image'?btn('Focus point','focus'):''}</div>${state.focusOpen&&f.kind==='image'?`<div class="focus-controls"><h3>Keep the important part in view</h3><p>This focus point only affects the welcome image on Home.</p><label>Top to bottom <input type="range" min="0" max="100" value="${state.focusY}" data-field="focusY" aria-label="Focus point top to bottom"></label><div class="actions">${btn('Reset','focus-reset')}${btn('Done','focus-done','primary')}</div></div>`:''}</div>`;}
function cleanCandidates(){if(state.cleanGroup==='selection')return state.files.filter(f=>state.selected.includes(f.id));return state.files.filter(f=>state.cleanGroup==='none'?f.checked&&!used(f):state.cleanGroup==='large'?f.size>=1500:f.kind==='image'&&!f.description&&!f.decorative);}
function cleanup(){const none=state.files.filter(f=>f.checked&&!used(f));const large=state.files.filter(f=>f.size>=1500);const missing=state.files.filter(f=>f.kind==='image'&&!f.description&&!f.decorative);let content='';if(state.cleanPhase==='groups'){content=`<div class="cleanup-groups">${[['none','No uses found',none,'Check files with no uses found.'],['large','Large files',large,'See what takes the most space.'],['missing','Missing descriptions',missing,'Help people understand your images.']].map(([id,label,files,copy])=>`<button class="cleanup-group" data-action="clean-group" data-group="${id}">${icon(id==='missing'?'image':id==='large'?'file':'clean')}<h3>${label}</h3><strong>${id==='missing'?files.length+' images':sizeText(files.reduce((s,f)=>s+f.size,0))}</strong><p>${files.length} files · ${copy}</p></button>`).join('')}</div><div class="warning">No uses found means no uses were found in the places checked. Some uses may be missed. Review first; this is not a guarantee that removing a file is safe.</div><p class="small muted">This explores the clean-up screens. Removal and Undo affect this demo only.</p>`;}else if(state.cleanPhase==='review'){const files=cleanCandidates();content=`${btn(icon('arrow')+' All suggestions','clean-home','quiet back')}<h3>${state.cleanGroup==='selection'?'Review selected files':state.cleanGroup==='none'?'Files with no uses found':state.cleanGroup==='large'?'Large files':'Images missing descriptions'}</h3><p class="small muted" style="margin-top:5px">${state.cleanGroup==='missing'?'Open a file to add a description.':'Choose files to review for removal. Files in use are labelled.'}</p>${files.length?`<div class="review-list">${files.map(f=>`<div class="review-file">${state.cleanGroup!=='missing'?`<button class="row-select" data-action="select" data-id="${f.id}" aria-pressed="${state.selected.includes(f.id)}" aria-label="Select ${escapeHtml(f.name)}"><span>${icon('check')}</span></button>`:''}${thumb(f)}<div class="review-text"><span class="file-name">${escapeHtml(f.name)}</span><p class="small muted">${sizeText(f.size)} · ${usageText(f)}</p>${f.other.length?`<p class="small muted">${escapeHtml(f.other.join(', '))}</p>`:''}</div>${btn('Details','detail','',`data-id="${f.id}"`)}</div>`).join('')}</div>`:empty('Nothing in this group','Your demo files are up to date.',btn('All suggestions','clean-home'))}${state.cleanGroup!=='missing'&&files.length?`<div class="warning">Check page and other uses in Details. A file can still have uses that were not found.</div><div class="selection-bar"><strong>${state.selected.length} selected · ${sizeText(state.files.filter(f=>state.selected.includes(f.id)).reduce((s,f)=>s+f.size,0))}</strong>${btn('Review removal','confirm-removal','primary',state.selected.length?'':'disabled')}</div>`:''}`;}else{const files=state.files.filter(f=>state.selected.includes(f.id));const inUse=files.some(used);content=`${btn(icon('arrow')+' Back to review','clean-review','quiet back')}<h3>Remove ${files.length} ${files.length===1?'file':'files'} from this demo?</h3><p class="muted" style="margin-top:8px">Review the names and uses below. You can undo this demo action.</p><div class="review-list">${files.map(f=>`<div class="review-file">${thumb(f)}<div class="review-text"><span class="file-name">${escapeHtml(f.name)}</span><p class="small muted">${usageText(f)}</p>${f.pages.length?`<p class="small">${escapeHtml(f.pages.join(' · '))}</p>`:''}${f.other.length?`<p class="small">Other uses: ${escapeHtml(f.other.join(' · '))}</p>`:''}</div></div>`).join('')}</div><div class="warning">${inUse?'Some selected files have uses. Removing them could leave missing pictures or broken downloads. ':'No uses were found, but some uses may be missed. '}This action changes only the sample library.</div><div class="actions">${btn('Keep files','clean-review')}${btn('Remove in demo','remove-demo','danger',files.length?'':'disabled')}</div>`;}return `<div class="screen-title"><div class="detail-heading">${btn(icon('arrow')+' Back','library','quiet')}<h2>Clean up</h2></div>${state.removed.length?btn('Undo removal','undo'):''}</div><p class="scope-note">Sample check: pages and site settings · today</p>${content}`;}
function inspirations(){const refs=[['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/squarespace-library.webp','Squarespace · Library','Folders and file previews together.','https://mobbin.com/screens/3168d383-2323-47e9-ae48-7cd906d92027'],['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/shopify-detail.webp','Shopify · File details','Description and usage beside a large preview.','https://mobbin.com/screens/36e740f3-33be-483d-a6f4-2793cc531a18'],['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/klaviyo-optimise.webp','Klaviyo · Optimise','Show both versions and the saving.','https://mobbin.com/screens/470df6f6-008e-49ff-a00e-396068c4f35c'],['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/shopify-phone-picker.webp','Shopify · Phone picker','Search, two columns and a clear selection.','https://mobbin.com/screens/150c862e-fb22-463f-a334-9468f88630e3'],['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/air-selection.webp','Air · Selection','A persistent action bar for selected files.','https://mobbin.com/screens/e213ec25-0d67-4977-b0e1-6d49141be0b3'],['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/google-one-cleanup.webp','Google One · Clean up','Review suggestions in small groups.','https://mobbin.com/flows/bbf6760f-a1bc-48f8-9bc6-df429d81421e']];return `<details class="inspiration"><summary>Inspiration · 6 reference screens</summary><p class="small muted">Reference patterns. Saved screenshots below; Mobbin links may need a login.</p><div class="references">${refs.map(([image,title,copy,url])=>`<figure class="reference"><a href="${url}" target="_blank" rel="noopener"><img src="${image}" alt="${title} reference screen" loading="lazy"></a><figcaption><a href="${url}" target="_blank" rel="noopener">${title}</a><p>${copy}</p></figcaption></figure>`).join('')}</div></details>`;}
function renderMedia(){const screen={library,detail,upload,cleanup}[state.screen]();return `<section class="app collections" aria-label="Media manager"><header class="app-head"><h1>Media</h1><div class="head-actions">${btn(icon('upload')+' Add files','upload','primary')}<details class="more-menu"><summary>More</summary><div class="more-options">${btn('Clean up','cleanup')}${btn('New collection','new-folder')}${btn('Reset demo','reset')}</div></details></div></header>${state.message?`<div class="notice" role="status"><span>${escapeHtml(state.message)}</span><div class="actions">${state.removed.length?btn('Undo','undo','quiet'):''}${btn(icon('close')+'<span class="sr-only">Dismiss message</span>','dismiss','quiet')}</div></div>`:''}${screen}</section>`;}

function renderFiles(){const file=siteFiles.find(f=>f.id===state.siteFile);return `<section class="app" aria-label="Website files"><div class="screen-title"><div><h1>Files</h1><p>Pages, styles and scripts for your website.</p></div>${btn('Open Media','editor-media')}</div><p class="small muted">Images, videos, audio, PDFs and downloads are managed in Media.</p><div class="sample-layout"><nav class="sample-nav" aria-label="Sample website files">${siteFiles.map(f=>btn(icon('file')+escapeHtml(f.name),'site-file',state.siteFile===f.id?'active':'',`data-id="${f.id}" ${state.siteFile===f.id?'aria-current="true"':''}`)).join('')}</nav><section class="sample-panel"><div class="sample-panel-head"><h3>${escapeHtml(file.name)}</h3><p>${file.label} · sample preview</p></div><pre class="sample-code">${escapeHtml(file.text)}</pre></section></div><div class="reset-line"><span>Sample website files · read-only preview.</span>${btn('Back to Media','editor-media')}</div></section>`;}
function renderPages(){const page=samplePages.find(p=>p.id===state.selectedPage);const previewImage=page.id==='home'&&state.placements.image?fileById(state.placements.image):page.image?fileById(page.image):null;if(state.placed)return `<section class="app" aria-label="Website page preview"><div class="screen-title"><div><h1>Pages</h1><p>${targetName()}</p></div>${btn('All pages','all-pages')}</div>${placed()}</section>`;return `<section class="app" aria-label="Website pages"><div class="screen-title"><div><h1>Pages</h1><p>Find a page and view its content.</p></div>${btn('Open Media','editor-media')}</div><div class="sample-layout"><nav class="sample-nav" aria-label="Sample pages">${samplePages.map(p=>btn(escapeHtml(p.name),'sample-page',state.selectedPage===p.id?'active':'',`data-id="${p.id}" ${state.selectedPage===p.id?'aria-current="true"':''}`)).join('')}</nav><section class="sample-panel"><div class="sample-panel-head"><h3>${page.name}</h3><p>${page.path} · sample preview</p></div><div class="sample-page"><p class="eyebrow">NEON STUDIO</p><h2>${page.headline}</h2><p>${page.copy}</p>${previewImage?thumb(previewImage):page.image?'<div class="empty"><p>This image was removed in the demo.</p></div>':''}<div class="actions">${page.id==='home'?btn('Choose welcome image','page-choose','primary','data-target="image"')+btn('Choose showreel','page-choose','','data-target="video"'):page.id==='contact'?btn('Choose guide download','page-choose','primary','data-target="pdf"'):btn('Manage media','editor-media','primary')}</div></div></section></div></section>`;}

function refresh(focusId){
  const previousPicker=document.getElementById('media-picker');
  const pickerScroll=previousPicker?.scrollTop||0;
  const samePickerView=previousPicker?.dataset.view===pickerViewKey();
  const active=document.activeElement;
  let focusSelector=null;
  if(previousPicker?.contains(active)){
    if(active.id)focusSelector='#'+CSS.escape(active.id);
    else if(active.dataset.action){
      focusSelector='[data-action="'+CSS.escape(active.dataset.action)+'"]';
      for(const key of ['id','kind','folder'])if(active.dataset[key])focusSelector+='[data-'+key+'="'+CSS.escape(active.dataset[key])+'"]';
      for(const className of ['media-open','select-tile','row-select','row-open','usage-badge'])if(active.classList.contains(className))focusSelector+='.'+className;
    }
  }
  let selection;
  if(focusId){const field=document.getElementById(focusId);selection=field&&'selectionStart'in field?[field.selectionStart,field.selectionEnd]:null;}
  document.getElementById('stage').innerHTML=render();
  const picker=document.getElementById('media-picker');
  if(state.pickerOpen){
    picker.showModal();
    layoutPhotoTiles();
    if(samePickerView){
      picker.scrollTop=pickerScroll;
      if(!state.activeUsage&&focusSelector)picker.querySelector(focusSelector)?.focus({preventScroll:true});
      picker.scrollTop=pickerScroll;
    }else{
      picker.scrollTop=0;
      picker.querySelector('#library-title')?.focus({preventScroll:true});
      picker.scrollTop=0;
    }
  }
  if(!state.pickerOpen)layoutPhotoTiles();
  if(state.activeUsage)document.getElementById('usage-dialog')?.showModal();
  if(focusId){const field=document.getElementById(focusId);field?.focus({preventScroll:true});if(selection)field?.setSelectionRange?.(...selection);}
}

function openPicker(target='image'){state.target=target;state.editorTab='pages';state.selectedPage=target==='pdf'?'contact':'home';state.pickerOpen=true;state.screen='library';state.picked=null;state.selected=[];state.placed=state.placements[target]||null;state.message='';clearFilters();refresh();}
function closePicker(){state.pickerOpen=false;state.activeUsage=null;state.screen='library';state.message='';clearInterval(uploadTimer);refresh();(state.placed?document.querySelector('[data-action="replace"]'):document.querySelector(`[data-action="page-choose"][data-target="${state.target}"]`))?.focus({preventScroll:true});}

function closeUsage(){const id=state.usageReturn;state.activeUsage=null;state.usageReturn=null;refresh();document.querySelector(`[data-action="usage"][data-id="${id}"]`)?.focus({preventScroll:true});}
document.getElementById('stage').addEventListener('cancel',event=>{if(event.target.id==='usage-dialog'){event.preventDefault();closeUsage();}else if(event.target.id==='media-picker'){event.preventDefault();closePicker();}},true);

function clearFilters(){state.libraryAll=true;state.collectionsOpen=false;state.collectionReturn=null;state.search='';state.kind='all';state.folder='all';state.tag='all';state.usage='all';}
function go(screen){if(screen!=='library'){state.collectionsOpen=false;state.collectionReturn=null;}state.screen=screen;state.message='';if(screen==='choose'){state.placed=null;state.picked=null;clearFilters();}refresh();}
function addUploaded(){const u=state.upload;if(u.added)return;u.files.forEach((f,i)=>{if(u.failed&&i===u.files.length-1)return;if(state.files.some(x=>x.id===f.id))return;const image=f.kind==='image';state.files.unshift({...f,size:image&&u.version==='smaller'?Math.round(f.size*.18):f.size,original:image?f.size:undefined,checked:false,memberships:[u.folder||'Studio art'],folder:u.folder||'Studio art',pages:[],other:[],tags:[],copies:image?[['Small','640 × 359','42 KB'],['Medium','1200 × 672','128 KB']]:[]});});if(!u.failed)u.added=true;}
function loadFiles(files){state.upload={step:1,files,version:'smaller',percent:0,failed:false,added:false,folder:state.folder==='all'?'Studio art':state.folder};refresh();}
function beginUpload(){const u=state.upload;u.step=2;u.percent=15;refresh();let steps=0;clearInterval(uploadTimer);uploadTimer=setInterval(()=>{steps++;u.percent=steps===1?45:steps===2?80:100;if(steps===3){u.failed=u.files.length>1;addUploaded();clearInterval(uploadTimer);}refresh();},650);}
document.getElementById('stage').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;const id=el.dataset.id;switch(action){case'editor-media':state.editorTab='media';break;case'editor-files':state.editorTab='files';state.collectionsOpen=false;state.collectionReturn=null;break;case'editor-pages':state.editorTab='pages';state.collectionsOpen=false;state.collectionReturn=null;break;case'site-file':state.siteFile=id;break;case'sample-page':state.selectedPage=id;state.placed=null;break;case'page-choose':openPicker(el.dataset.target||'image');return;case'close-picker':closePicker();return;case'all-pages':state.placed=null;state.editorTab='pages';break;case'usage':state.activeUsage=id;state.usageReturn=id;break;case'close-usage':closeUsage();return;case'usage-details':state.activeUsage=null;state.detailBack=state.screen;state.detailId=id;state.screen='detail';state.message='';break;case'library':if(!state.pickerOpen)state.editorTab='media';go('library');return;case'upload':state.uploadFromPicker=false;go('upload');return;case'choose':openPicker('image');return;case'cleanup':state.cleanPhase='groups';state.cleanGroup=null;state.selected=[];go('cleanup');return;case'kind':if(!state.pickerOpen){state.kind=el.dataset.kind;state.collectionsOpen=false;state.collectionReturn=null;}break;case'toggle-filters':state.filtersOpen=!state.filtersOpen;break;case'grid':state.view='grid';break;case'list':state.view='list';break;case'collections':state.collectionReturn={folder:state.folder,kind:state.kind,search:state.search,usage:state.usage,view:state.view,filtersOpen:state.filtersOpen};state.collectionsOpen=true;state.folder='all';state.search='';state.usage='all';state.screen='library';state.selected=[];break;case'back-to-files':if(state.collectionReturn)Object.assign(state,state.collectionReturn);state.collectionReturn=null;state.collectionsOpen=false;state.screen='library';break;case'folder':state.folder=el.dataset.folder;state.search='';state.collectionsOpen=false;state.collectionReturn=null;state.libraryAll=true;state.screen='library';state.selected=[];break;case'all-media':state.collectionsOpen=false;state.collectionReturn=null;state.kind='all';state.folder='all';state.search='';state.usage='all';state.libraryAll=true;state.screen='library';state.selected=[];break;case'new-folder':{const name=prompt('Name your new collection');if(name&&name.trim()&&!folderNames.includes(name.trim())){folderNames.push(name.trim());state.folder=name.trim();state.search='';state.collectionsOpen=false;state.collectionReturn=null;state.screen='library';state.message='Collection created in the demo.';}break;}case'clear-search':state.search='';break;case'search-all-media':state.kind='all';if(state.search)state.folder='all';state.collectionsOpen=false;state.collectionReturn=null;break;case'clear-filters':clearFilters();break;case'select':state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];break;case'select-all':state.selected=filtered().map(f=>f.id);break;case'clear-selection':state.selected=[];break;case'detail':state.detailBack=state.screen;state.detailId=id;state.screen='detail';state.message='';break;case'detail-back':state.screen=state.detailBack;break;case'decorative':document.getElementById('description').disabled=el.checked;return;case'add-group':{const group=document.getElementById('add-group').value;state.files.forEach(f=>{if(state.selected.includes(f.id)&&!f.memberships.includes(group))f.memberships.push(group);});state.message=`${state.selected.length} files added to ${group}. No copies were made.`;state.selected=[];break;}case'remove-membership':{const group=state.folder;state.files.forEach(f=>{if(state.selected.includes(f.id))f.memberships=f.memberships.filter(g=>g!==group);});state.message=`Files removed from ${group}. The files stay in your media library.`;state.selected=[];break;}case'review-selection':state.cleanGroup='selection';state.cleanPhase='review';state.screen='cleanup';break;case'dismiss':state.message='';break;case'device-files':document.getElementById('device-input').click();return;case'sample-files':loadFiles([{...structuredClone(seed[1]),id:'added-orange',name:'orange-study.jpg',size:2400,pages:[],other:[]},{...structuredClone(seed[6]),id:'added-guide',name:'project-notes.pdf',size:640,pages:[],other:[]}]);return;case'original':state.upload.version='original';break;case'smaller':state.upload.version='smaller';break;case'upload-back':state.upload.step=0;break;case'start-upload':beginUpload();return;case'retry-upload':state.upload.failed=false;addUploaded();break;case'cancel-upload':clearInterval(uploadTimer);state.upload.step=1;state.upload.percent=0;state.message='Adding cancelled in the demo. You can try again.';break;case'add-more':state.upload.step=0;break;case'retry-pending':state.uploadFromPicker=true;state.screen='upload';break;case'picker-upload':state.uploadFromPicker=true;state.upload.step=0;state.screen='upload';state.message='';break;case'upload-return':clearInterval(uploadTimer);state.screen='library';state.uploadFromPicker=false;break;case'back-to-choosing':{const chosen=state.upload.files.find(f=>f.kind===state.target&&fileById(f.id));clearFilters();state.screen='library';state.libraryAll=true;state.picked=chosen?.id||null;state.uploadFromPicker=false;state.message=chosen?'Your new file is selected. Use it for this place.':'Your files are added. Choose a file that fits this place.';break;}case'pick':state.picked=id;break;case'place':if(!state.picked)return;state.placed=state.picked;state.placements[state.target]=state.picked;state.pickerOpen=false;state.editorTab='pages';state.screen='library';state.message='';state.focusOpen=false;state.focusX=50;state.focusY=50;break;case'replace':openPicker(state.target);return;case'focus':state.focusOpen=!state.focusOpen;break;case'focus-reset':state.focusX=50;state.focusY=50;break;case'focus-done':state.focusOpen=false;state.message='Focus point saved for Home · Welcome image in the demo.';break;case'clean-group':state.cleanGroup=el.dataset.group;state.cleanPhase='review';state.selected=[];break;case'clean-home':state.cleanPhase='groups';state.selected=[];break;case'clean-review':state.cleanPhase='review';break;case'confirm-removal':state.cleanPhase='confirm';break;case'remove-demo':state.removed=state.files.filter(f=>state.selected.includes(f.id));state.files=state.files.filter(f=>!state.selected.includes(f.id));state.message=`${state.removed.length} files removed from the demo. Undo is available.`;state.selected=[];state.cleanPhase='groups';break;case'undo':state.files.push(...state.removed);state.removed=[];state.message='Files restored in the demo.';break;case'reset':clearInterval(uploadTimer);folderNames.splice(0,folderNames.length,...initialGroups);state=fresh(state.variant);break;default:return;}refresh();});
document.getElementById('stage').addEventListener('input',e=>{if(e.target.id==='file-name')e.target.setCustomValidity('');const field=e.target.dataset.field;if(field==='search'){state.search=e.target.value;refresh('search');}else if(field==='focusX'||field==='focusY'){state[field]=Number(e.target.value);const preview=document.querySelector('.focus-preview');preview.style.setProperty(field==='focusX'?'--focus-x':'--focus-y',state[field]+'%');}});
document.getElementById('stage').addEventListener('change',e=>{const el=e.target;const field=el.dataset.field;if(field&&field!=='search'&&field!=='focusX'&&field!=='focusY'){if(field==='uploadFolder')state.upload.folder=el.value;else{state[field]=el.value;if(field==='folder'){state.collectionsOpen=false;state.collectionReturn=null;}if(field==='target'){state.picked=null;clearFilters();}}refresh();}if(el.id==='device-input'&&el.files.length){const files=[...el.files].map((f,i)=>{const kind=f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':f.type.startsWith('audio/')?'audio':f.type==='application/pdf'?'pdf':'download';return {id:'device-'+Date.now()+'-'+i,name:f.name,kind,size:Math.max(1,Math.round(f.size/1000)),image:kind==='image'?'orange-orbit.webp':undefined,description:kind==='image'?'Sample preview for your chosen image.':undefined,dimensions:kind==='image'?'2400 × 1345':undefined,pages:[],other:[],tags:[],copies:[]};});loadFiles(files);state.message='Your file names are shown with sample previews and demo savings. Nothing is uploaded.';refresh();}});
document.getElementById('stage').addEventListener('submit',e=>{if(e.target.id!=='detail-form')return;e.preventDefault();const data=new FormData(e.target);const f=fileById(state.detailId);const name=String(data.get('name')).trim();if(!name){document.getElementById('file-name').setCustomValidity('Enter a file name.');document.getElementById('file-name').reportValidity();return;}f.name=name;f.memberships=data.getAll('memberships').map(String);if(f.kind==='image'){f.decorative=data.has('decorative');f.description=f.decorative?'':String(data.get('description')||'').trim();}state.message='Details saved in the demo.';refresh();});
document.addEventListener('click',event=>{document.querySelectorAll('.more-menu[open]').forEach(menu=>{if(!menu.contains(event.target))menu.open=false;});});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){const menu=document.querySelector('.more-menu[open]');if(menu){menu.open=false;menu.querySelector('summary').focus();}}});
state=fresh(2);
refresh();

window.addEventListener('pagehide',()=>{clearInterval(uploadTimer);photoObserver?.disconnect();});
</script>
