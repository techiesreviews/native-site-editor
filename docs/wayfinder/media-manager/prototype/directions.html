/* Picker chrome is copied verbatim from the prototype skill. */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;

function chooser(){if(state.placed)return placed();const files=filtered(true);return `<div class="chooser"><div class="screen-title"><div><h2>Choose for your page</h2><p>Find a file from the same library.</p></div>${btn('Cancel','library','quiet')}</div><div class="target-bar"><div><span class="eyebrow">CHOOSING FOR</span><h3>${targetName()}</h3></div><select data-field="target" aria-label="Choose for a different place">${options([['image','Welcome image'],['video','Showreel'],['pdf','Guide download']],state.target)}</select></div><div class="actions" style="margin-bottom:14px">${btn(icon('upload')+' Add files','picker-upload')}</div>${filters(true)}${toolbar(files,true)}${state.view==='list'?fileList(files,true):fileGrid(files,true)}<div class="choose-bottom"><span class="small muted">${state.picked?'1 selected':'Choose one '+kindName(state.target).toLowerCase()}</span>${btn('Use '+kindName(state.target).toLowerCase(),'place','primary',state.picked?'':'disabled')}</div></div>`;}
function targetName(){return state.target==='image'?'Home · Welcome image':state.target==='video'?'Home · Studio showreel':'Contact · Guide download';}
function placed(){const f=fileById(state.placed);return `<div class="screen-title"><div><h2>Chosen for your page</h2><p>${targetName()}</p></div>${btn('Back to library','library')}</div><div class="notice">${icon('check')}<span>${escapeHtml(f.name)} is now in this place in the demo.</span></div><div class="page-preview"><div class="page-copy"><p class="eyebrow">NEON STUDIO</p><h2>${state.target==='image'?'Ideas with a little more colour.':state.target==='video'?'See the studio in motion.':'Start something bright.'}</h2><p>${state.target==='pdf'?'Get our guide to working together.':'Independent design. Unexpected light. Made for people.'}</p></div><div class="focus-preview" style="--focus-x:${state.focusX}%;--focus-y:${state.focusY}%">${thumb(f)}${state.focusOpen&&f.kind==='image'?'<span class="focus-dot"></span>':''}</div><div class="edit-bar"><strong>${kindName(f.kind)} edit bar · this place</strong>${btn('Replace','replace')}${f.kind==='image'?btn('Focus point','focus'):''}</div>${state.focusOpen&&f.kind==='image'?`<div class="focus-controls"><h3>Keep the important part in view</h3><p>This focus point only affects the welcome image on Home.</p><label>Top to bottom <input type="range" min="0" max="100" value="${state.focusY}" data-field="focusY" aria-label="Focus point top to bottom"></label><div class="actions">${btn('Reset','focus-reset')}${btn('Done','focus-done','primary')}</div></div>`:''}</div>`;}
function cleanCandidates(){if(state.cleanGroup==='selection')return state.files.filter(f=>state.selected.includes(f.id));return state.files.filter(f=>state.cleanGroup==='none'?f.checked&&!used(f):state.cleanGroup==='large'?f.size>=1500:f.kind==='image'&&!f.description&&!f.decorative);}
function cleanup(){const none=state.files.filter(f=>f.checked&&!used(f));const large=state.files.filter(f=>f.size>=1500);const missing=state.files.filter(f=>f.kind==='image'&&!f.description&&!f.decorative);let content='';if(state.cleanPhase==='groups'){content=`<p class="muted">Start with a small group. Look at each file before deciding.</p><div class="cleanup-groups">${[['none','No uses found',none,'Check files with no uses found.'],['large','Large files',large,'See what takes the most space.'],['missing','Missing descriptions',missing,'Help people understand your images.']].map(([id,label,files,copy])=>`<button class="cleanup-group" data-action="clean-group" data-group="${id}">${icon(id==='missing'?'image':id==='large'?'file':'clean')}<h3>${label}</h3><strong>${id==='missing'?files.length+' images':sizeText(files.reduce((s,f)=>s+f.size,0))}</strong><p>${files.length} files · ${copy}</p></button>`).join('')}</div><div class="warning">No uses found means no uses were found in the places checked. Some uses may be missed. Review first; this is not a guarantee that removing a file is safe.</div><p class="small muted">This explores the clean-up screens. Removal and Undo affect this demo only.</p>`;}else if(state.cleanPhase==='review'){const files=cleanCandidates();content=`${btn(icon('arrow')+' All suggestions','clean-home','quiet back')}<h3>${state.cleanGroup==='selection'?'Review selected files':state.cleanGroup==='none'?'Files with no uses found':state.cleanGroup==='large'?'Large files':'Images missing descriptions'}</h3><p class="small muted" style="margin-top:5px">${state.cleanGroup==='missing'?'Open a file to add a description.':'Choose files to review for removal. Files in use are labelled.'}</p>${files.length?`<div class="review-list">${files.map(f=>`<div class="review-file">${state.cleanGroup!=='missing'?`<button class="row-select" data-action="select" data-id="${f.id}" aria-pressed="${state.selected.includes(f.id)}" aria-label="Select ${escapeHtml(f.name)}"><span>${icon('check')}</span></button>`:''}${thumb(f)}<div class="review-text"><span class="file-name">${escapeHtml(f.name)}</span><p class="small muted">${sizeText(f.size)} · ${usageText(f)}</p>${f.other.length?`<p class="small muted">${escapeHtml(f.other.join(', '))}</p>`:''}</div>${btn('Details','detail','',`data-id="${f.id}"`)}</div>`).join('')}</div>`:empty('Nothing in this group','Your demo files are up to date.',btn('All suggestions','clean-home'))}${state.cleanGroup!=='missing'&&files.length?`<div class="warning">Check page and other uses in Details. A file can still have uses that were not found.</div><div class="selection-bar"><strong>${state.selected.length} selected · ${sizeText(state.files.filter(f=>state.selected.includes(f.id)).reduce((s,f)=>s+f.size,0))}</strong>${btn('Review removal','confirm-removal','primary',state.selected.length?'':'disabled')}</div>`:''}`;}else{const files=state.files.filter(f=>state.selected.includes(f.id));const inUse=files.some(used);content=`${btn(icon('arrow')+' Back to review','clean-review','quiet back')}<h3>Remove ${files.length} ${files.length===1?'file':'files'} from this demo?</h3><p class="muted" style="margin-top:8px">Review the names and uses below. You can undo this demo action.</p><div class="review-list">${files.map(f=>`<div class="review-file">${thumb(f)}<div class="review-text"><span class="file-name">${escapeHtml(f.name)}</span><p class="small muted">${usageText(f)}</p>${f.pages.length?`<p class="small">${escapeHtml(f.pages.join(' · '))}</p>`:''}${f.other.length?`<p class="small">Other uses: ${escapeHtml(f.other.join(' · '))}</p>`:''}</div></div>`).join('')}</div><div class="warning">${inUse?'Some selected files have uses. Removing them could leave missing pictures or broken downloads. ':'No uses were found, but some uses may be missed. '}This action changes only the sample library.</div><div class="actions">${btn('Keep files','clean-review')}${btn('Remove in demo','remove-demo','danger',files.length?'':'disabled')}</div>`;}return `<div class="screen-title"><div><h2>Clean up</h2><p>A little less clutter. A clearer library.</p></div>${state.removed.length?btn('Undo removal','undo'):''}</div><p class="scope-note">Sample check: pages and site settings · today</p>${content}`;}
function inspirations(){const refs=[['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/squarespace-library.webp','Squarespace · Library','Folders and file previews together.','https://mobbin.com/screens/3168d383-2323-47e9-ae48-7cd906d92027'],['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/shopify-detail.webp','Shopify · File details','Description and usage beside a large preview.','https://mobbin.com/screens/36e740f3-33be-483d-a6f4-2793cc531a18'],['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/klaviyo-optimise.webp','Klaviyo · Optimise','Show both versions and the saving.','https://mobbin.com/screens/470df6f6-008e-49ff-a00e-396068c4f35c'],['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/shopify-phone-picker.webp','Shopify · Phone picker','Search, two columns and a clear selection.','https://mobbin.com/screens/150c862e-fb22-463f-a334-9468f88630e3'],['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/air-selection.webp','Air · Selection','A persistent action bar for selected files.','https://mobbin.com/screens/e213ec25-0d67-4977-b0e1-6d49141be0b3'],['/home/ubulex/Projects/native-site-editor-dev/docs/wayfinder/media-manager/prototype/references/google-one-cleanup.webp','Google One · Clean up','Review suggestions in small groups.','https://mobbin.com/flows/bbf6760f-a1bc-48f8-9bc6-df429d81421e']];return `<details class="inspiration"><summary>Inspiration · 6 reference screens</summary><p class="small muted">Patterns behind these directions. Saved screenshots below; Mobbin links may need a login.</p><div class="references">${refs.map(([image,title,copy,url])=>`<figure class="reference"><a href="${url}" target="_blank" rel="noopener"><img src="${image}" alt="${title} reference screen" loading="lazy"></a><figcaption><a href="${url}" target="_blank" rel="noopener">${title}</a><p>${copy}</p></figcaption></figure>`).join('')}</div></details>`;}
function taskNav(cls=''){return `<nav class="task-nav ${cls}" aria-label="Media manager screens">${[['library','Library'],['upload','Add files'],['choose','Choose for page'],['cleanup','Clean up']].map(([action,label])=>btn(label,action,state.screen===action?'active':'',state.screen===action?'aria-current="page"':'')).join('')}</nav>`;}
function rail(){return `<aside class="rail"><p class="eyebrow" style="padding:0 10px 10px">MEDIA MANAGER</p>${[['library','Library'],['upload','Add files'],['choose','Choose for page'],['cleanup','Clean up']].map(([action,label])=>btn(label,action,state.screen===action?'active':'',state.screen===action?'aria-current="page"':'')).join('')}${state.variant===2?`<h3>FOLDERS</h3>${btn(icon('folder')+' All files','folder',state.folder==='all'?'active':'','data-folder="all"')}${folderNames.map(f=>btn(f+' <span class="small muted">'+state.files.filter(x=>x.folder===f).length+'</span>','folder',state.folder===f?'active':'',`data-folder="${f}"`)).join('')}`:`<h3>AT A GLANCE</h3><p class="small muted" style="padding:0 10px">${state.files.length} files<br>${sizeText(state.files.reduce((s,f)=>s+f.size,0))} total<br>${state.files.filter(f=>f.checked&&!used(f)).length} with no uses found</p>`}</aside>`;}
function render(){const d=directions[state.variant];const screen={library,detail,upload,choose:chooser,cleanup}[state.screen]();return `<section class="app ${d.name.toLowerCase()}" aria-label="${d.name} media manager direction"><header class="app-head"><div class="brand"><div class="brand-mark">${icon('image')}</div><div><h1>Media manager</h1><p class="small muted">Neon Studio · ${state.files.length} files</p></div></div><div class="head-actions">${btn('Choose for page','choose','library-extra')}${btn(icon('upload')+' Add files','upload','primary')}</div></header><div class="workspace ${state.variant?'with-rail':''}">${state.variant?rail():''}<div style="min-width:0">${taskNav(state.variant?'mobile-only':'')}<p class="direction-note"><strong>${d.name}.</strong> ${d.note}${state.screen!=='library'?' Shared across all three directions.':''}</p>${state.message?`<div class="notice" role="status"><span>${escapeHtml(state.message)}</span><div class="actions">${state.removed.length?btn('Undo','undo','quiet'):''}${btn(icon('close')+'<span class="sr-only">Dismiss message</span>','dismiss','quiet')}</div></div>`:''}${screen}</div></div>${inspirations()}<div class="reset-line"><span>Interactive mockup · sample files only.<br>Switch directions with 1–3 or arrow keys.</span>${btn('Reset demo','reset','quiet')}</div></section>`;}
function refresh(focusId){let selection;if(focusId){const el=document.getElementById(focusId);selection=el&&'selectionStart'in el?[el.selectionStart,el.selectionEnd]:null;}document.getElementById('stage').innerHTML=render();if(focusId){const el=document.getElementById(focusId);el?.focus();if(selection)el.setSelectionRange?.(...selection);}}
function clearFilters(){state.search='';state.kind='all';state.folder='all';state.tag='all';state.usage='all';}
function go(screen){state.screen=screen;state.message='';if(screen==='choose'){state.placed=null;state.picked=null;clearFilters();}refresh();}
function addUploaded(){const u=state.upload;if(u.added)return;u.files.forEach((f,i)=>{if(u.failed&&i===u.files.length-1)return;if(state.files.some(x=>x.id===f.id))return;const image=f.kind==='image';state.files.unshift({...f,size:image&&u.version==='smaller'?Math.round(f.size*.18):f.size,original:image?f.size:undefined,checked:false,folder:u.folder||'Studio art',pages:[],other:[],tags:[],copies:image?[['Small','640 × 359','42 KB'],['Medium','1200 × 672','128 KB']]:[]});});if(!u.failed)u.added=true;}
function loadFiles(files){state.upload={step:1,files,version:'smaller',percent:0,failed:false,added:false,folder:state.folder==='all'?'Studio art':state.folder};refresh();}
function beginUpload(){const u=state.upload;u.step=2;u.percent=15;refresh();let steps=0;clearInterval(uploadTimer);uploadTimer=setInterval(()=>{steps++;u.percent=steps===1?45:steps===2?80:100;if(steps===3){u.failed=u.files.length>1;addUploaded();clearInterval(uploadTimer);}refresh();},650);}
document.getElementById('stage').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;const id=el.dataset.id;switch(action){case'library':go('library');return;case'upload':state.uploadFromPicker=false;go('upload');return;case'choose':go('choose');return;case'cleanup':state.cleanPhase='groups';state.cleanGroup=null;state.selected=[];go('cleanup');return;case'toggle-filters':state.filtersOpen=!state.filtersOpen;break;case'grid':state.view='grid';break;case'list':state.view='list';break;case'folder':state.folder=el.dataset.folder;state.screen='library';state.selected=[];break;case'new-folder':{const name=prompt('Name your new demo folder');if(name&&name.trim()&&!folderNames.includes(name.trim())){folderNames.push(name.trim());state.folder=name.trim();state.message='Folder created in the demo.';}break;}case'clear-filters':clearFilters();break;case'select':state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];break;case'select-all':state.selected=filtered().map(f=>f.id);break;case'clear-selection':state.selected=[];break;case'detail':state.detailBack=state.screen;state.detailId=id;state.screen='detail';state.message='';break;case'detail-back':state.screen=state.detailBack;break;case'decorative':document.getElementById('description').disabled=el.checked;return;case'move':{const folder=document.getElementById('move-folder').value;state.files.forEach(f=>{if(state.selected.includes(f.id))f.folder=folder;});state.message=`${state.selected.length} files moved to ${folder} in the demo.`;state.selected=[];break;}case'review-selection':state.cleanGroup='selection';state.cleanPhase='review';state.screen='cleanup';break;case'dismiss':state.message='';break;case'device-files':document.getElementById('device-input').click();return;case'sample-files':loadFiles([{...structuredClone(seed[1]),id:'added-orange',name:'orange-study.jpg',size:2400,pages:[],other:[]},{...structuredClone(seed[6]),id:'added-guide',name:'project-notes.pdf',size:640,pages:[],other:[]}]);return;case'original':state.upload.version='original';break;case'smaller':state.upload.version='smaller';break;case'upload-back':state.upload.step=0;break;case'start-upload':beginUpload();return;case'retry-upload':state.upload.failed=false;addUploaded();break;case'cancel-upload':clearInterval(uploadTimer);state.upload.step=1;state.upload.percent=0;state.message='Adding cancelled in the demo. You can try again.';break;case'add-more':state.upload.step=0;break;case'picker-upload':state.uploadFromPicker=true;state.upload.step=0;state.screen='upload';state.message='Add your file, then return to Choose for page.';break;case'back-to-choosing':{const chosen=state.upload.files.find(f=>f.kind===state.target);clearFilters();state.screen='choose';state.placed=null;state.picked=chosen?.id||null;state.uploadFromPicker=false;state.message=chosen?'Your new file is selected. Use it for this place.':'Your files are added. Choose a file that fits this place.';break;}case'pick':state.picked=id;break;case'place':if(!state.picked)return;state.placed=state.picked;state.focusOpen=false;state.focusX=50;state.focusY=50;break;case'replace':state.placed=null;break;case'focus':state.focusOpen=!state.focusOpen;break;case'focus-reset':state.focusX=50;state.focusY=50;break;case'focus-done':state.focusOpen=false;state.message='Focus point saved for Home · Welcome image in the demo.';break;case'clean-group':state.cleanGroup=el.dataset.group;state.cleanPhase='review';state.selected=[];break;case'clean-home':state.cleanPhase='groups';state.selected=[];break;case'clean-review':state.cleanPhase='review';break;case'confirm-removal':state.cleanPhase='confirm';break;case'remove-demo':state.removed=state.files.filter(f=>state.selected.includes(f.id));state.files=state.files.filter(f=>!state.selected.includes(f.id));state.message=`${state.removed.length} files removed from the demo. Undo is available.`;state.selected=[];state.cleanPhase='groups';break;case'undo':state.files.push(...state.removed);state.removed=[];state.message='Files restored in the demo.';break;case'reset':clearInterval(uploadTimer);folderNames.splice(3);state=fresh(state.variant);break;default:return;}refresh();});
document.getElementById('stage').addEventListener('input',e=>{if(e.target.id==='file-name')e.target.setCustomValidity('');const field=e.target.dataset.field;if(field==='search'){state.search=e.target.value;refresh('search');}else if(field==='focusX'||field==='focusY'){state[field]=Number(e.target.value);const preview=document.querySelector('.focus-preview');preview.style.setProperty(field==='focusX'?'--focus-x':'--focus-y',state[field]+'%');}});
document.getElementById('stage').addEventListener('change',e=>{const el=e.target;const field=el.dataset.field;if(field&&field!=='search'&&field!=='focusX'&&field!=='focusY'){if(field==='uploadFolder')state.upload.folder=el.value;else{state[field]=el.value;if(field==='target'){state.picked=null;clearFilters();}}refresh();}if(el.id==='device-input'&&el.files.length){const files=[...el.files].map((f,i)=>{const kind=f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':f.type.startsWith('audio/')?'audio':f.type==='application/pdf'?'pdf':'download';return {id:'device-'+Date.now()+'-'+i,name:f.name,kind,size:Math.max(1,Math.round(f.size/1000)),image:kind==='image'?'orange-orbit.webp':undefined,description:kind==='image'?'Sample preview for your chosen image.':undefined,dimensions:kind==='image'?'2400 × 1345':undefined,pages:[],other:[],tags:[],copies:[]};});loadFiles(files);state.message='Your file names are shown with sample previews and demo savings. Nothing is uploaded.';refresh();}});
document.getElementById('stage').addEventListener('submit',e=>{if(e.target.id!=='detail-form')return;e.preventDefault();const data=new FormData(e.target);const f=fileById(state.detailId);const name=String(data.get('name')).trim();if(!name){document.getElementById('file-name').setCustomValidity('Enter a file name.');document.getElementById('file-name').reportValidity();return;}f.name=name;f.folder=String(data.get('folder'));f.tags=String(data.get('tags')).split(',').map(t=>t.trim()).filter(Boolean);if(f.kind==='image'){f.decorative=data.has('decorative');f.description=f.decorative?'':String(data.get('description')||'').trim();}state.message='Details saved in the demo.';refresh();});
const variants=[0,1,2].map(i=>()=>{clearInterval(uploadTimer);folderNames.splice(3);state=fresh(i);return render();});
// Normalise an invalid URL before the unmodified picker wiring runs.
const initialVariant=Number(new URLSearchParams(location.search).get('v'));
if(!Number.isInteger(initialVariant)||initialVariant<1||initialVariant>variants.length){const url=new URL(location);url.searchParams.set('v','1');history.replaceState(null,'',url);}
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
