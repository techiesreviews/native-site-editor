<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE (throwaway) · 08 Site map</title>
<style>
/* Throwaway prototype for site-structure ticket 08: the zoomable site map, in top bar B.
   Tokens and parts copied from site-quality/prototypes/05-page-scores.html (src/theme.css).
   Built on round-1 recommendations Q1–Q7 (Lex has not answered yet). */
:root {
  color-scheme: light dark;
  --primary: light-dark(oklch(50% 0.18 262.9), oklch(72% 0.13 262.9));
  --primary-hover: light-dark(oklch(42.5% 0.18 262.9), oklch(78% 0.12 262.9));
  --on-primary: light-dark(oklch(98.9% 0.003 275.8), oklch(16% 0.04 262.9));
  --background: light-dark(oklch(97% 0.019 275.5), oklch(15% 0.025 265));
  --surface: light-dark(oklch(98.9% 0.003 275.8), oklch(19% 0.03 265));
  --surface-subtle: light-dark(oklch(95.4% 0.019 275.5), oklch(22% 0.032 265));
  --text: light-dark(oklch(15.3% 0.06 262.9), oklch(95% 0.01 265));
  --muted: light-dark(oklch(40.4% 0.045 262.9), oklch(74% 0.03 265));
  --line: light-dark(oklch(88.3% 0.048 274.7), oklch(30% 0.03 265));
  --hover: color-mix(in oklch, var(--text) 9%, transparent);
  --current: color-mix(in oklch, var(--primary) 16%, transparent);
  --control-line: color-mix(in oklch, var(--text) 16%, transparent);
  --question: light-dark(oklch(66% 0.18 48), oklch(74% 0.15 55));
  --poor: light-dark(oklch(55% 0.2 27), oklch(70% 0.17 25));
  --good: light-dark(oklch(52% 0.13 145), oklch(74% 0.14 145));
  --dot: light-dark(oklch(80% 0.03 270), oklch(32% 0.03 265));
  --shadow: 0 12px 32px light-dark(oklch(15.3% 0.06 262.9 / 0.18), oklch(0% 0 0 / 0.5));
  --shadow-small: 0 1px 3px light-dark(oklch(15.3% 0.06 262.9 / 0.12), oklch(0% 0 0 / 0.4));
  --focus-ring: 2px solid var(--primary);
  --type-small: 12px;
  --type-base: 13px;
  --type-title: 15px;
  --radius-small: 4px;
  --radius: 6px;
  --radius-panel: 8px;
  --size-compact: 28px;
  --size-control: 32px;

  font: 14px/1.5 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  color: var(--text);
  background: var(--background);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; padding: 20px 24px 40px; font-size: var(--type-base); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:is(button, input):focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
svg { display: block; flex: none; fill: currentColor; }
[hidden] { display: none !important; }

.page-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 16px;
  max-inline-size: 1240px;
  margin: 0 auto 16px;
}
.page-head h1 { margin: 0; font-size: 18px; font-weight: 600; }
.tool {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  block-size: var(--size-control);
  padding-inline: 12px;
  border: 0;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--control-line);
  white-space: nowrap;
}
@media (hover: hover) and (pointer: fine) { .tool:hover { background: var(--surface-subtle); } }

/* ---------- The mock editor ---------- */
.editor {
  position: relative;
  display: grid;
  grid-template-rows: 44px minmax(0, 1fr);
  max-inline-size: 1240px;
  block-size: 720px;
  margin-inline: auto;
  border-radius: var(--radius-panel);
  overflow: clip;
  background: var(--background);
  box-shadow: 0 0 0 1px var(--line);
}
.bar {
  position: relative;
  z-index: 5;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
  padding-inline: 8px 12px;
  background: var(--surface);
  border-block-end: 1px solid var(--line);
}
.bar__start, .bar__end { display: flex; align-items: center; gap: 4px; min-inline-size: 0; }
.ghost {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  block-size: var(--size-compact);
  padding-inline: 6px 8px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  white-space: nowrap;
  min-inline-size: 0;
}
.icon-button {
  position: relative;
  display: inline-grid;
  place-items: center;
  inline-size: var(--size-compact);
  block-size: var(--size-compact);
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
}
.icon-button:disabled { opacity: 0.4; cursor: default; }
:is(.ghost, .icon-button)[aria-expanded="true"], .icon-button[aria-pressed="true"] { background: var(--current); color: var(--text); }
@media (hover: hover) and (pointer: fine) {
  .ghost:hover, .icon-button:not(:disabled):hover { background: var(--hover); color: var(--text); }
  .save:hover { background: var(--primary-hover); }
  .save[data-state="saved"]:hover { background: var(--hover); }
}
.tile-mark {
  display: grid;
  place-items: center;
  inline-size: 22px;
  block-size: 22px;
  border-radius: var(--radius-small);
  background: var(--primary);
  color: var(--on-primary);
  font-weight: 600;
  font-size: var(--type-small);
}
.project__name { font-weight: 600; }
.slash { color: var(--control-line); font-size: 18px; font-weight: 300; }
.picker { font-weight: 500; }
.caret { color: var(--muted); }
.inbox-button::after {
  content: "";
  position: absolute;
  inset-block-start: 4px;
  inset-inline-end: 4px;
  inline-size: 8px;
  block-size: 8px;
  border-radius: 50%;
  background: var(--question);
  box-shadow: 0 0 0 2px var(--surface);
}
.save {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  block-size: var(--size-compact);
  margin-inline-start: 4px;
  padding-inline: 10px 12px;
  border: 0;
  border-radius: var(--radius);
  background: var(--primary);
  color: var(--on-primary);
  font-weight: 500;
  white-space: nowrap;
}
.save::before { content: ""; inline-size: 7px; block-size: 7px; border-radius: 50%; background: currentColor; opacity: 0.85; }
.save[data-state="saved"] { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--control-line); }
.save[data-state="saved"]::before { background: var(--good); opacity: 1; }

/* ---------- Work area: left panel + page ---------- */
.work { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); min-block-size: 0; }
.panel-left {
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  inline-size: 300px;
  min-block-size: 0;
  background: var(--surface);
  border-inline-end: 1px solid var(--line);
}
.panel-left[hidden] { display: none; }
.panel-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px; }
.segments {
  display: inline-grid;
  grid-auto-flow: column;
  padding: 2px;
  border-radius: var(--radius);
  background: var(--surface-subtle);
  box-shadow: inset 0 0 0 1px var(--line);
}
.segments button {
  block-size: 26px;
  padding-inline: 10px;
  border: 0;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--muted);
  font-weight: 500;
}
.segments button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-small); }
.panel-tools { display: flex; align-items: center; gap: 6px; padding: 0 10px 8px; }
.search {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-inline-size: 0;
  block-size: var(--size-compact);
  padding-inline: 8px;
  border-radius: var(--radius);
  background: var(--surface-subtle);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--muted);
}
.search:focus-within { outline: var(--focus-ring); outline-offset: 1px; }
.search input { flex: 1; min-inline-size: 0; border: 0; background: transparent; outline: 0; color: var(--text); }
.map-open {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  block-size: var(--size-compact);
  padding-inline: 8px 10px;
  border: 0;
  border-radius: var(--radius);
  background: var(--current);
  color: var(--text);
  font-weight: 500;
}
@media (hover: hover) and (pointer: fine) { .map-open:hover { background: color-mix(in oklch, var(--primary) 24%, transparent); } }
.tree { overflow: auto; padding: 0 6px 10px; }
.tree ul { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  padding-inline-start: calc(var(--depth, 0) * 14px);
}
.row > button:first-child {
  display: flex;
  align-items: center;
  gap: 8px;
  min-inline-size: 0;
  block-size: 30px;
  padding-inline: 8px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  text-align: start;
}
.row > button:first-child span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row > button:first-child small { color: var(--muted); font-size: var(--type-small); margin-inline-start: auto; }
.row svg { color: var(--muted); }
.row.is-current > button:first-child { background: var(--current); }
@media (hover: hover) and (pointer: fine) { .row > button:first-child:hover { background: var(--hover); } }

.stage { overflow: auto; padding: 24px; background: var(--background); }
.stage .page-frame {
  max-inline-size: 760px;
  margin-inline: auto;
  border-radius: var(--radius-panel);
  overflow: clip;
  background: white;
  color: #1b1f2e;
  box-shadow: var(--shadow-small), 0 0 0 1px var(--line);
}

/* ---------- Rings (from the page scores prototype) ---------- */
.ring {
  --ring: color-mix(in oklch, var(--muted) 45%, transparent);
  position: relative;
  display: inline-grid;
  place-items: center;
  inline-size: 22px;
  block-size: 22px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
}
.ring svg { inline-size: 14px; block-size: 14px; rotate: -90deg; fill: none; stroke-width: 2.5; }
.ring .track { stroke: color-mix(in oklch, var(--text) 10%, transparent); }
.ring .arc { stroke: var(--ring); stroke-linecap: round; }
.ring[data-band="improve"] { --ring: var(--question); }
.ring[data-band="poor"] { --ring: var(--poor); }
.ring::after {
  content: attr(data-tip);
  position: absolute;
  inset-block-start: calc(100% + 6px);
  inset-inline-end: -8px;
  z-index: 20;
  display: none;
  padding: 6px 8px;
  border-radius: var(--radius);
  background: var(--text);
  color: var(--surface);
  font-size: var(--type-small);
  line-height: 1.5;
  white-space: pre;
  text-align: start;
  pointer-events: none;
}
.ring:is(:hover, :focus-visible)::after { display: block; }

/* ---------- The map ---------- */
.map {
  position: absolute;
  inset: 44px 0 0;
  z-index: 4;
  overflow: hidden;
  background-color: var(--background);
  background-image: radial-gradient(circle, var(--dot) 1.2px, transparent 1.4px);
  background-size: var(--dot-size, 20px) var(--dot-size, 20px);
  background-position: var(--dot-x, 0) var(--dot-y, 0);
  touch-action: none;
  user-select: none;
  cursor: grab;
}
.map[data-panning] { cursor: grabbing; }
.map[hidden] { display: none; }
.world {
  position: absolute;
  inset: 0 auto auto 0;
  transform-origin: 0 0;
}
/* A layer while the camera moves; dropped when it rests, so close-up pages redraw sharp. */
.world[data-moving] { will-change: transform; }
.links { position: absolute; inset: 0 auto auto 0; overflow: visible; pointer-events: none; }
.links path { fill: none; vector-effect: non-scaling-stroke; }
.links .edge { stroke: var(--control-line); stroke-width: 1.5; }
.links .link { stroke: var(--primary); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.85; }

.tile {
  position: absolute;
  inset: 0 auto auto 0;
  inline-size: 240px;
  block-size: 150px;
  cursor: pointer;
  transition: opacity 200ms ease-out;
}
.tile__body {
  position: relative;
  inline-size: 100%;
  block-size: 100%;
  border-radius: 6px;
  overflow: hidden;
  background: white;
  box-shadow: 0 0 0 1px var(--line), var(--shadow-small);
}
.tile[data-selected] .tile__body { box-shadow: 0 0 0 calc(2.5px / var(--k)) var(--primary), var(--shadow-small); }
.tile[data-drop="ok"] .tile__body { box-shadow: 0 0 0 calc(3px / var(--k)) var(--primary); }
.tile[data-drop="ok"] .tile__body::after { content: ""; position: absolute; inset: 0; background: color-mix(in oklch, var(--primary) 18%, transparent); }
.tile[data-drop="no"] .tile__body { box-shadow: 0 0 0 calc(3px / var(--k)) var(--poor); }
.tile[data-dragging] { z-index: 10; opacity: 0.9; cursor: grabbing; }
.tile[data-dragging] .tile__body { box-shadow: 0 0 0 calc(2px / var(--k)) var(--primary), var(--shadow); }
.tile[data-shake] .tile__body { animation: shake 360ms ease-in-out; }
@keyframes shake { 20%, 60% { translate: -6px 0; } 40%, 80% { translate: 6px 0; } }
.tile[data-dim] { opacity: 0.22; }
.tile[data-hit] .tile__body { box-shadow: 0 0 0 calc(3px / var(--k)) var(--question), var(--shadow-small); }
.tile[data-new] .tile__body { animation: pop 300ms ease-out; }
@keyframes pop { from { scale: 0.85; opacity: 0; } }

/* Page pictures and live pages are drawn at 600 × 375 and scaled to the tile. */
.pic, .live {
  position: absolute;
  inset: 0 auto auto 0;
  inline-size: 600px;
  block-size: 375px;
  transform: scale(0.4);
  transform-origin: 0 0;
}
.live { opacity: 0; transition: opacity 250ms ease-out; overflow: hidden; background: white; pointer-events: none; }
.tile[data-live] .live { opacity: 1; pointer-events: auto; }
.map[data-level="name"] .pic { display: none; }
.map[data-level="name"] .tile__body { background: hsl(var(--hue) 55% 62%); box-shadow: none; }
.map:not([data-level="live"]) .live { display: none; }
.tile[data-pending] .pic, .tile[data-pending] .live { display: none; }
.tile[data-pending] .tile__body {
  background: linear-gradient(100deg, var(--surface-subtle) 30%, var(--surface) 50%, var(--surface-subtle) 70%) 0 0 / 300% 100%;
  animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer { to { background-position: -300% 0; } }
.tile[data-fresh] .pic { animation: fade-in 400ms ease-out; }
@keyframes fade-in { from { opacity: 0; } }

/* Mini page drawing (the picture). */
.pic { background: white; }
.pic .p-head { display: flex; align-items: center; gap: 14px; block-size: 46px; padding-inline: 24px; background: hsl(var(--hue) 45% 22%); }
.pic .p-head i { display: block; block-size: 10px; border-radius: 5px; background: hsl(var(--hue) 30% 80% / 0.7); }
.pic .p-head i:first-child { inline-size: 70px; block-size: 16px; background: hsl(var(--hue) 70% 72%); margin-inline-end: auto; }
.pic .p-hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; padding: 28px 24px; background: hsl(var(--hue) 60% 96%); }
.pic .p-hero b { display: block; block-size: 26px; inline-size: 85%; border-radius: 6px; background: hsl(var(--hue) 40% 25%); margin-block-end: 14px; }
.pic .p-hero i { display: block; block-size: 10px; border-radius: 5px; background: hsl(var(--hue) 15% 75%); margin-block-end: 9px; }
.pic .p-hero u { display: block; inline-size: 120px; block-size: 30px; border-radius: 6px; background: hsl(var(--hue) 70% 50%); margin-block-start: 16px; }
.pic .p-img { border-radius: 10px; background: linear-gradient(135deg, hsl(var(--hue) 65% 70%), hsl(calc(var(--hue) + 40) 60% 55%)); }
.pic .p-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 22px 24px; }
.pic .p-cards i { display: block; block-size: 80px; border-radius: 8px; background: hsl(var(--hue) 20% 93%); box-shadow: inset 0 0 0 1px hsl(var(--hue) 20% 86%); }

/* The real page (live). */
.site { font: 15px/1.55 Georgia, "Iowan Old Style", serif; color: #1b1f2e; background: white; }
.site header { display: flex; align-items: center; gap: 18px; padding: 12px 24px; background: hsl(var(--hue) 45% 22%); color: white; font: 600 14px/1.3 ui-sans-serif, system-ui, sans-serif; }
.site header strong { margin-inline-end: auto; font-size: 17px; color: hsl(var(--hue) 70% 78%); }
.site header span { opacity: 0.85; font-weight: 500; }
.site .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; padding: 26px 24px 20px; background: hsl(var(--hue) 60% 96%); }
.site h1 { margin: 0 0 8px; font: 700 28px/1.15 ui-sans-serif, system-ui, sans-serif; color: hsl(var(--hue) 40% 20%); }
.site p { margin: 0 0 10px; }
.site .cta { display: inline-block; margin-block-start: 6px; padding: 7px 14px; border-radius: 6px; background: hsl(var(--hue) 70% 45%); color: white; font: 600 13px/1.2 ui-sans-serif, system-ui, sans-serif; }
.site .img { border-radius: 10px; background: linear-gradient(135deg, hsl(var(--hue) 65% 70%), hsl(calc(var(--hue) + 40) 60% 55%)); min-block-size: 150px; }
.site .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 18px 24px 24px; }
.site .cards div { padding: 10px 12px; border-radius: 8px; background: hsl(var(--hue) 20% 96%); box-shadow: inset 0 0 0 1px hsl(var(--hue) 20% 88%); font-size: 13px; }
.site .cards b { display: block; font: 600 13px/1.3 ui-sans-serif, system-ui, sans-serif; margin-block-end: 4px; }

/* ---------- Map overlay (screen space): labels, add buttons, notes ---------- */
.overlay { position: absolute; inset: 0; pointer-events: none; }
.label {
  position: absolute;
  inset: 0 auto auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: var(--type-small);
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
}
.label__title { overflow: hidden; text-overflow: ellipsis; }
.label .ring { pointer-events: auto; inline-size: 18px; block-size: 18px; }
.label .menu-mark { color: var(--muted); }
.label input {
  inline-size: 120px;
  block-size: 24px;
  padding-inline: 6px;
  border: 0;
  border-radius: var(--radius-small);
  background: var(--surface);
  box-shadow: 0 0 0 1px var(--primary);
  pointer-events: auto;
  font-size: var(--type-small);
}
.label[data-dim] { opacity: 0.25; }
.address { position: absolute; inset: 0 auto auto 0; color: var(--muted); font-size: 11px; white-space: nowrap; text-align: center; }
.add {
  position: absolute;
  inset: 0 auto auto 0;
  display: grid;
  place-items: center;
  inline-size: 22px;
  block-size: 22px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--shadow-small);
  pointer-events: auto;
}
.note {
  position: absolute;
  inset: 0 auto auto 0;
  padding: 3px 8px;
  border-radius: var(--radius-small);
  background: var(--text);
  color: var(--surface);
  font-size: var(--type-small);
  white-space: nowrap;
  translate: -50% 0;
  animation: fade-in 200ms ease-out;
}
.note[data-kind="no"] { background: var(--poor); color: white; }

/* Toolbar and the site's own overview float over the map. */
.map-bar {
  position: absolute;
  inset-block-start: 12px;
  inset-inline-start: 50%;
  translate: -50% 0;
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow), 0 0 0 1px var(--line);
  cursor: default;
}
.map-bar .search { inline-size: 220px; flex: none; }
.map-bar .zoom { min-inline-size: 44px; text-align: center; color: var(--muted); font-size: var(--type-small); font-variant-numeric: tabular-nums; }
.map-bar .sep { inline-size: 1px; block-size: 18px; background: var(--line); margin-inline: 2px; }
.map-bar .tool { block-size: var(--size-compact); box-shadow: none; padding-inline: 8px; }
@media (hover: hover) and (pointer: fine) { .map-bar .tool:hover { background: var(--hover); } }

.overview {
  position: absolute;
  inset-block-start: 12px;
  inset-inline-start: 12px;
  z-index: 6;
  inline-size: 290px;
  padding: 12px 14px;
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow), 0 0 0 1px var(--line);
  cursor: default;
}
.overview h3 { margin: 0; font-size: var(--type-title); font-weight: 600; }
.overview .sub { margin: 0 0 10px; color: var(--muted); font-size: var(--type-small); }
.gauges { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-block-end: 10px; }
.gauge {
  --ring: var(--good);
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 4px 0;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  font-size: 10.5px;
  line-height: 1.2;
  color: var(--muted);
  text-align: center;
}
.gauge[data-band="improve"] { --ring: var(--question); }
.gauge[data-band="poor"] { --ring: var(--poor); }
.gauge[aria-pressed="true"] { background: var(--current); color: var(--text); }
@media (hover: hover) and (pointer: fine) { .gauge:hover { background: var(--hover); } }
.gauge__dial { position: relative; display: grid; place-items: center; inline-size: 38px; block-size: 38px; }
.gauge__dial svg { position: absolute; inset: 0; rotate: -90deg; fill: none; stroke-width: 3.5; }
.gauge__dial .track { stroke: color-mix(in oklch, var(--ring) 16%, transparent); }
.gauge__dial .arc { stroke: var(--ring); stroke-linecap: round; }
.gauge__dial b { font-size: 12.5px; font-weight: 600; color: var(--ring); font-variant-numeric: tabular-nums; }
.recent { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; border-block-start: 1px solid var(--line); padding-block-start: 8px; }
.recent li { display: flex; gap: 8px; font-size: var(--type-small); }
.recent li span { color: var(--muted); margin-inline-start: auto; white-space: nowrap; }
.recent__title { margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }

/* Inbox (minimal here). */
.inbox {
  position: absolute;
  inset-block-start: 48px;
  inset-inline-end: 12px;
  z-index: 8;
  inline-size: 300px;
  padding: 6px;
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow), 0 0 0 1px var(--line);
}
.inbox h3 { margin: 0; padding: 6px 8px; font-size: var(--type-small); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.inbox p { display: flex; gap: 8px; align-items: center; margin: 0; padding: 7px 8px; border-radius: var(--radius); }
.inbox p small { display: block; color: var(--muted); font-size: var(--type-small); }
</style>
</head>

let pages = [

  { what: "About · team picture added", when: "2 h ago" },

const byId = (id) => pages.find((p) => p.id === id);
const childrenOf = (id) => pages.filter((p) => p.parent === id).sort((a, b) => a.title.localeCompare(b.title));
const isInside = (id, ancestor) => { for (let p = byId(id); p; p = byId(p.parent)) if (p.id === ancestor) return true; return false; };
function address(p) {
  const parts = [];
  for (let q = p; q && q.id !== "home"; q = byId(q.parent)) parts.unshift(q.slug);
  return parts.length ? `/${parts.join("/")}/` : "/";
}
const lowest = (p) => Math.min(...p.s);
const band = (n) => (n < 50 ? "poor" : n < 90 ? "improve" : "ok");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const icon = (id, size = 16) => `<svg width="${size}" height="${size}"><use href="#${id}"/></svg>`;
function ring(p) {
  const n = lowest(p), C = 2 * Math.PI * 5.5;
  const tip = CATS.map((c, i) => `${c}  ${p.s[i]}`).join("\n");
  return `<button type="button" class="ring" data-band="${band(n)}" data-tip="${tip}" aria-label="Scores for ${esc(p.title)}: ${CATS.map((c, i) => `${c} ${p.s[i]}`).join(", ")}"><svg viewBox="0 0 14 14"><circle class="track" cx="7" cy="7" r="5.5"/><circle class="arc" cx="7" cy="7" r="5.5" stroke-dasharray="${(n / 100) * C} ${C}"/></svg></button>`;

function renderTree() {
  const q = $("panel-search").value.trim().toLowerCase();
  const rows = [];

/* ---------- Map: layout ---------- */

let hovered = null, hoverTimer = 0;

/* Home on top, its pages in a row, everything deeper stacked in a column under its parent

  const target = new Map();

  const top = childrenOf("home");
  const widths = top.map((p) => W + INDENT * depthBelow(p.id));
  const total = widths.reduce((a, w) => a + w, 0) + GAP_X * (top.length - 1);
  let x = 0;
  top.forEach((p, i) => { stack(p.id, x, H + GAP_Y); x += widths[i] + GAP_X; });
  target.set("home", { x: total / 2 - W / 2, y: 0 });
  const start = performance.now();

    const t = target.get(p.id);
    if (!t) continue;
    if (p.x === undefined) { const par = byId(p.parent); p.x = par?.x ?? t.x; p.y = par?.y ?? t.y; }
    p.from = { x: p.x, y: p.y }; p.to = t;

  if (!animate) { for (const p of pages) { p.x = p.to.x; p.y = p.to.y; } dirty(); return; }
  const step = (now) => {

}

/* ---------- Map: tiles ---------- */
function ensureTiles() {

    el.className = "tile";
    el.dataset.id = p.id;
    el.style.setProperty("--hue", p.hue);
    el.innerHTML = `<div class="tile__body"><div class="pic">${pictureHTML(p)}</div><div class="live"></div></div>`;
    world.append(el);
    tiles.set(p.id, el);
    const label = document.createElement("div");
    label.className = "label";
    const addr = document.createElement("div");
    addr.className = "address";
    overlay.append(label, addr);
    labels.set(p.id, { label, addr });
    if (p.isNew) { el.dataset.new = ""; setTimeout(() => delete el.dataset.new, 400); }
  }
  for (const [id, el] of tiles) if (!byId(id)) { el.remove(); tiles.delete(id); const l = labels.get(id); l.label.remove(); l.addr.remove(); labels.delete(id); }

}

  for (const p of pages) {

        label.innerHTML = `<input value="${esc(p.title)}" aria-label="Page name">`;
        const input = label.querySelector("input");
        input.addEventListener("pointerdown", (e) => e.stopPropagation());
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); if (e.key === "Escape") { input.value = p.title; input.blur(); } e.stopPropagation(); });

/* ---------- Map: rendering ---------- */
let raf = 0, restTimer = 0;

  const level = levelFor(k);

  $("zoom-level").textContent = `${Math.round(k * 100)}%`;

  // Tree lines, then the selected page's links.
  let d = "";
  for (const p of pages) {
    const par = byId(p.parent);
    if (!par) continue;
    const cx = p.x + (p.dx ?? 0), cy = p.y + (p.dy ?? 0);
    if (par.id === "home") { const px = par.x + W / 2, py = par.y + H, mid = py + GAP_Y / 2; d += `M${px},${py}V${mid}H${cx + W / 2}V${cy}`; }

    const t = byId(id);

    const bend = Math.max(60, Math.abs(bx - ax) * 0.25);

  // Tiles and their screen-space labels.

  const q = state.query;
  const visible = [];

    if (!el) continue;
    const tx = p.x + (p.dx ?? 0), ty = p.y + (p.dy ?? 0);
    el.style.transform = `translate(${tx}px, ${ty}px)`;

    const { label, addr } = labels.get(p.id);

}
const addButton = document.createElement("button");
addButton.type = "button"; addButton.className = "add"; addButton.title = "Add a page here"; addButton.hidden = true;
addButton.innerHTML = icon("plus", 12);
addButton.addEventListener("pointerenter", () => clearTimeout(hoverTimer));
addButton.addEventListener("pointerleave", () => leaveTile());

overlay.append(addButton);
function renderAdd() {
  const p = hovered && byId(hovered);

  addButton.hidden = false;
  addButton.dataset.for = p.id;
  addButton.setAttribute("aria-label", `Add a page under ${p.title}`);
  const sx = cam.x + (p.x + W) * cam.k, sy = cam.y + (p.y + H / 2) * cam.k;

}
function renderNotes() {
  const now = performance.now();
  for (const n of notes) if (n.until <= now || !byId(n.id)) n.el?.remove();
  notes = notes.filter((n) => n.until > now && byId(n.id));
  for (const n of notes) {
    const p = byId(n.id);

/* ---------- Map: camera ---------- */
const clampK = (k) => Math.min(4, Math.max(0.05, k));
function zoomAt(sx, sy, factor) {

map.addEventListener("wheel", (e) => {

$("zoom-in").addEventListener("click", () => { const k = clampK(cam.k * 1.6), cx = map.clientWidth / 2, cy = map.clientHeight / 2; animateTo({ k, x: cx - (cx - cam.x) * (k / cam.k), y: cy - (cy - cam.y) * (k / cam.k) }); });

/* ---------- Map: pointer (pan, select, drag to move) ---------- */
let pan = null, drag = null;

}
map.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".map-bar, .overview, .ring, input")) return;
  const tileEl = e.target.closest(".tile");
  if (tileEl) {
    const p = byId(tileEl.dataset.id), w = toWorld(e);
    drag = { p, startX: e.clientX, startY: e.clientY, offX: w.x - p.x, offY: w.y - p.y, moved: false, target: null };

    map.setPointerCapture(e.pointerId);

/* ---------- Search ---------- */
function matches(p, q) {

}
$("map-search").addEventListener("input", (e) => { state.query = e.target.value.trim().toLowerCase(); dirty(); });
$("map-search").addEventListener("keydown", (e) => {
  e.stopPropagation();
  if (e.key === "Escape") { e.target.value = ""; state.query = ""; dirty(); }
  if (e.key !== "Enter" || !state.query) return;

  if (hit) { state.selected = hit.id; animateTo(focusCam(hit)); }

/* ---------- The site's own overview ---------- */

    <h3>techies-site</h3>

      return `<button type="button" class="gauge" data-cat="${i}" data-band="${band(avg[i])}" aria-pressed="${state.focusCat === i}" title="${below ? `Show the pages below 90 for ${c}` : `Every page is 90 or above for ${c}`}">
        <span class="gauge__dial"><svg viewBox="0 0 38 38"><circle class="track" cx="19" cy="19" r="16"/><circle class="arc" cx="19" cy="19" r="16" stroke-dasharray="${(avg[i] / 100) * C} ${C}"/></svg><b>${avg[i]}</b></span>${c}</button>`;
    }).join("")}</div>
    <p class="recent__title">Recent changes</p>
    <ul class="recent">${recent.slice(0, 3).map((r) => `<li>${esc(r.what)}<span>${r.when}</span></li>`).join("")}</ul>`;
}
$("overview").addEventListener("click", (e) => {
  const g = e.target.closest(".gauge");
  if (!g) return;
  const i = Number(g.dataset.cat);
  state.focusCat = state.focusCat === i ? null : i;
  renderOverview(); dirty();
});

/* ---------- First visit: names first, pictures fill in nearest first ---------- */
$("first-visit").addEventListener("click", () => {
  for (const p of pages) { p.pending = true; const el = tiles.get(p.id); el.dataset.pending = ""; el.querySelector(".live").removeAttribute("data-ready"); el.querySelector(".live").innerHTML = ""; }
  const vw = map.clientWidth, vh = map.clientHeight;
  const order = [...pages].sort((a, b) => {
    const d = (p) => Math.hypot(cam.x + (p.x + W / 2) * cam.k - vw / 2, cam.y + (p.y + H / 2) * cam.k - vh / 2);
    return d(a) - d(b);
  });
  order.forEach((p, i) => setTimeout(() => {
    p.pending = false;
    const el = tiles.get(p.id);
    if (!el) return;
    delete el.dataset.pending;
    el.dataset.fresh = "";
    setTimeout(() => delete el.dataset.fresh, 450);
    dirty();
  }, 250 + i * (2800 / order.length)));
  dirty();
});

/* ---------- Open and close ---------- */
function openMap() {
  map.hidden = false;
  ensureTiles();
  layout(false);
  Object.assign(cam, fitCam());
  renderOverview();
  render();
  $("map-search").value = $("panel-search").value;
  state.query = $("map-search").value.trim().toLowerCase();
  dirty();
}
function closeMap() { map.hidden = true; hovered = null; }
function openInEditor(id) { state.page = id; closeMap(); renderTree(); renderStage(); }
$("map-open").addEventListener("click", openMap);
$("map-close").addEventListener("click", closeMap);
document.addEventListener("keydown", (e) => {
  if (map.hidden || e.target.matches("input")) return;
  if (e.key === "Escape") { if (state.selected || state.focusCat !== null) { state.selected = null; state.focusCat = null; renderOverview(); dirty(); } else closeMap(); }
  if (e.key === "+" || e.key === "=") $("zoom-in").click();
  if (e.key === "-") $("zoom-out").click();
  if (e.key === "0") $("zoom-fit").click();
});
addEventListener("resize", () => { if (!map.hidden) dirty(); });

/* ---------- Theme ---------- */
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("theme").textContent = dark ? "Light" : "Dark";
});

renderTree(); renderStage(); renderSave();
if (location.hash === "#map") openMap();
</script>
</body>
</html>
