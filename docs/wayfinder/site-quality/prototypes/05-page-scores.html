<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE (throwaway) · 05 Page scores in top bar B</title>
<style>
/* Throwaway prototype for site-quality ticket 05, round 4: page scores in version B.
   Built on 05-slim-top-bar-v2.html (tokens from src/theme.css, explorer from src/style.css). */
:root {
  color-scheme: light dark;
  --primary: light-dark(oklch(50% 0.18 262.9), oklch(72% 0.13 262.9));
  --primary-hover: light-dark(oklch(42.5% 0.18 262.9), oklch(78% 0.12 262.9));
  --on-primary: light-dark(oklch(98.9% 0.003 275.8), oklch(16% 0.04 262.9));
  --background: light-dark(oklch(97% 0.019 275.5), oklch(15% 0.025 265));
  --surface: light-dark(oklch(98.9% 0.003 275.8), oklch(19% 0.03 265));
  --surface-subtle: light-dark(oklch(95.4% 0.019 275.5), oklch(22% 0.032 265));
  --text: light-dark(oklch(15.3% 0.06 262.9), oklch(95% 0.01 265));
  --muted: light-dark(oklch(40.4% 0.045 262.9), oklch(74% 0.03 265));
  --line: light-dark(oklch(88.3% 0.048 274.7), oklch(30% 0.03 265));
  --hover: color-mix(in oklch, var(--text) 9%, transparent);
  --current: color-mix(in oklch, var(--primary) 16%, transparent);
  --control-line: color-mix(in oklch, var(--text) 16%, transparent);
  --question: light-dark(oklch(66% 0.18 48), oklch(74% 0.15 55));
  --success: light-dark(oklch(52% 0.13 145), oklch(74% 0.14 145));
  --shadow: 0 12px 32px light-dark(oklch(15.3% 0.06 262.9 / 0.18), oklch(0% 0 0 / 0.5));
  --focus-ring: 2px solid var(--primary);
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --type-small: 12px;
  --type-base: 13px;
  --type-title: 15px;
  --radius-small: 4px;
  --radius: 6px;
  --radius-panel: 8px;
  --size-compact: 28px;
  --size-control: 32px;

  font: 14px/1.5 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  color: var(--text);
  background: var(--background);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; padding: 20px 24px 40px; font-size: var(--type-base); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:is(button, input, summary):focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
svg { display: block; flex: none; fill: currentColor; }
[hidden] { display: none !important; }

/* ---------- Page head ---------- */
.page-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 16px;
  max-inline-size: 1240px;
  margin: 0 auto 16px;
}
.page-head h1 { margin: 0; font-size: 18px; font-weight: 600; }
.page-head__tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  block-size: var(--size-control);
  padding-inline: 12px;
  border: 0;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--control-line);
}
.switch {
  display: inline-flex;
  padding: 2px;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--control-line);
}
.switch button {
  block-size: 28px;
  padding-inline: 12px;
  border: 0;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--muted);
  white-space: nowrap;
}
.switch button[aria-pressed="true"] { background: var(--current); color: var(--text); font-weight: 600; }

/* ---------- One mock editor ---------- */
.editor {
  --bar-height: 44px;
  position: relative;
  display: grid;
  grid-template-rows: var(--bar-height) minmax(0, 1fr);
  max-inline-size: 1240px;
  block-size: 680px;
  margin-inline: auto;
  border-radius: var(--radius-panel);
  overflow: clip;
  background: var(--background);
  box-shadow: 0 0 0 1px var(--line);
}

.bar {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 16px;
  padding-inline: 8px 12px;
  background: var(--surface);
  border-block-end: 1px solid var(--line);
}
.editor[data-version="b"] .bar { grid-template-columns: minmax(0, 1fr) auto; }
.bar__start, .bar__end { display: flex; align-items: center; gap: 4px; min-inline-size: 0; }
.bar__end { justify-content: end; }

.ghost {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  block-size: var(--size-compact);
  padding-inline: 6px 8px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  white-space: nowrap;
  min-inline-size: 0;
}
.icon-button {
  position: relative;
  display: inline-grid;
  place-items: center;
  inline-size: var(--size-compact);
  block-size: var(--size-compact);
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
}
:is(.ghost, .icon-button)[aria-expanded="true"] { background: var(--current); color: var(--text); }
@media (hover: hover) and (pointer: fine) {
  .ghost:hover, .icon-button:hover { background: var(--hover); color: var(--text); }
  .save:hover { background: var(--primary-hover); }
  .save[data-state="saved"]:hover { background: var(--hover); }
}
.ghost:active, .icon-button:active { background: var(--hover); }

.tile {
  display: grid;
  place-items: center;
  inline-size: 22px;
  block-size: 22px;
  border-radius: var(--radius-small);
  background: var(--primary);
  color: var(--on-primary);
  font-weight: 600;
  font-size: var(--type-small);
}
.project__name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.caret { color: var(--muted); }
.slash { color: var(--control-line); font-size: 18px; font-weight: 300; }
.picker { font-weight: 500; max-inline-size: 360px; }
.picker__label { overflow: hidden; text-overflow: ellipsis; }
.picker__label .folder-part { color: var(--muted); font-weight: 400; }

.save {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  block-size: var(--size-compact);
  padding-inline: 10px 12px;
  border: 0;
  border-radius: var(--radius);
  background: var(--primary);
  color: var(--on-primary);
  font-weight: 500;
  white-space: nowrap;
}
.save::before {
  content: "";
  inline-size: 7px;
  block-size: 7px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.85;
}
.save[data-state="saved"] {
  background: transparent;
  color: var(--muted);
  box-shadow: inset 0 0 0 1px var(--control-line);
}
.save[data-state="saved"]::before { background: var(--success); opacity: 1; }
.divider { inline-size: 1px; block-size: 18px; background: var(--line); margin-inline: 4px; }

/* The inbox dot: something waits. Never a number. */
.inbox-button::after {
  content: "";
  position: absolute;
  inset-block-start: 4px;
  inset-inline-end: 4px;
  inline-size: 8px;
  block-size: 8px;
  border-radius: 50%;
  background: var(--question);
  box-shadow: 0 0 0 2px var(--surface);
  transition: scale 200ms ease-out;
}
body:not([data-waiting]) .inbox-button::after { scale: 0; }

/* ---------- The workspace under the bar ---------- */
.work {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  min-block-size: 0;
}
.structure {
  display: grid;
  align-content: start;
  gap: 2px;
  padding: 14px 10px;
  background: var(--surface);
  border-inline-end: 1px solid var(--line);
}
.eyebrow {
  margin: 0 6px 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.structure__row {
  display: flex;
  align-items: center;
  gap: 8px;
  block-size: 30px;
  padding-inline: 6px;
  border-radius: var(--radius);
  color: var(--muted);
}
.structure__row::before {
  content: "";
  inline-size: 12px;
  block-size: 9px;
  border-radius: 2px;
  box-shadow: inset 0 0 0 1.5px currentColor;
  opacity: 0.6;
}
.structure__row.is-current { background: var(--current); color: var(--text); font-weight: 500; }
.stage { min-inline-size: 0; padding: 20px 28px; overflow: clip; }

/* A fake site page, drawn in the editor's preview. */
.site {
  display: grid;
  gap: 18px;
  max-inline-size: 860px;
  margin-inline: auto;
  padding: 18px 28px 28px;
  border-radius: var(--radius-panel);
  background: light-dark(#fff, oklch(22% 0.02 265));
  box-shadow: 0 0 0 1px var(--line);
}
.site__nav { display: flex; align-items: center; gap: 18px; font-size: var(--type-small); color: var(--muted); }
.site__nav b { margin-inline-end: auto; color: var(--text); font-size: var(--type-base); }
.site__hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: center; }
.site__hero h2 { margin: 0 0 8px; font-size: 26px; line-height: 1.15; }
.site__hero p { margin: 0 0 6px; color: var(--muted); }
.site__pic {
  aspect-ratio: 4 / 3;
  border-radius: var(--radius);
  background: linear-gradient(135deg, oklch(72% 0.09 200), oklch(55% 0.12 262));
}
.site__cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.site__cards i { display: block; block-size: 64px; border-radius: var(--radius); background: var(--surface-subtle); }

/* A code file shown instead of the page. */
.code {
  margin: 0;
  max-inline-size: 860px;
  margin-inline: auto;
  padding: 16px 20px;
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: 0 0 0 1px var(--line);
  font: 13px/1.7 var(--font-mono);
  color: var(--muted);
  white-space: pre;
  overflow: auto;
}
.code b { color: var(--primary); font-weight: 400; }

/* Where an inbox item goes: a ring on the spot, with its name. */
[data-ring] {
  position: relative;
  border-radius: var(--radius);
  outline: 2px solid var(--question);
  outline-offset: 3px;
  animation: ring 900ms ease-out;
}
[data-ring]::after {
  content: attr(data-ring);
  position: absolute;
  inset-block-end: calc(100% + 6px);
  inset-inline-start: -3px;
  padding: 1px 8px;
  border-radius: var(--radius-small);
  background: var(--question);
  color: oklch(20% 0.04 45);
  font: 600 var(--type-small)/1.5 Inter, ui-sans-serif, sans-serif;
  white-space: nowrap;
  pointer-events: none;
}
@keyframes ring { from { outline-offset: 12px; outline-color: transparent; } }

/* ---------- Panels that open from the bar ---------- */
.panel {
  position: absolute;
  z-index: 4;
  inset-block-start: calc(var(--bar-height) + 6px);
  margin: 0;
  padding: 6px;
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow), 0 0 0 1px var(--line);
}
@media (prefers-reduced-motion: no-preference) {
  .panel:not([hidden]) { animation: panel-in 150ms ease-out; }
}
@keyframes panel-in { from { opacity: 0; translate: 0 -4px; } }

.menu { inset-inline-start: 8px; inline-size: 260px; }
.menu__who { display: flex; align-items: center; gap: 10px; padding: 8px 8px 10px; border-block-end: 1px solid var(--line); margin-block-end: 4px; }
.menu__who .tile { inline-size: 32px; block-size: 32px; border-radius: var(--radius); font-size: var(--type-title); }
.menu__who small { display: block; color: var(--muted); font-size: var(--type-small); }
.menu__item {
  display: flex;
  align-items: center;
  gap: 10px;
  inline-size: 100%;
  block-size: 32px;
  padding-inline: 8px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  text-align: start;
}
.menu__item svg { color: var(--muted); }
.menu__sep { block-size: 1px; margin: 4px 0; background: var(--line); }

.settings { inset-inline-start: 8px; inline-size: 380px; padding: 14px 16px 16px; display: grid; gap: 12px; }
/* C: Site settings opens from the explorer's gear, so it opens centred like the explorer. */
.settings h3 { margin: 0; font-size: var(--type-title); }
.settings label { display: grid; gap: 4px; color: var(--muted); font-size: var(--type-small); }
.settings input[type="text"] {
  block-size: var(--size-control);
  padding-inline: 10px;
  border: 0;
  border-radius: var(--radius);
  background: var(--surface-subtle);
  color: var(--text);
  font-size: var(--type-base);
  box-shadow: inset 0 0 0 1px var(--control-line);
}
.settings .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: var(--type-base); }

.inbox { inset-inline-end: 8px; inline-size: 340px; }
.panel-title {
  margin: 0;
  padding: 6px 8px;
  font-size: var(--type-small);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.inbox ul { list-style: none; margin: 0; padding: 0; display: grid; }
.inbox li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  border-radius: var(--radius);
  transition: opacity 200ms ease-out, translate 200ms ease-out;
}
.inbox li[data-leaving] { opacity: 0; translate: 12px 0; }
.inbox li > svg { margin-inline-start: 8px; color: var(--muted); }
.inbox li[data-kind="agent"] > svg { color: var(--question); }
.item { display: grid; padding: 7px 4px; border: 0; background: transparent; text-align: start; min-inline-size: 0; }
.item b { font-weight: 500; }
.item small { color: var(--muted); font-size: var(--type-small); }
.wave {
  margin-inline-end: 6px;
  block-size: 24px;
  padding-inline: 8px;
  border: 0;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--muted);
  font-size: var(--type-small);
  box-shadow: inset 0 0 0 1px var(--control-line);
}
@media (hover: hover) and (pointer: fine) {
  .inbox li:has(.item:hover), .menu__item:hover { background: var(--hover); }
  .wave:hover { color: var(--text); background: var(--surface-subtle); }
}
.inbox__empty { display: flex; align-items: center; gap: 8px; margin: 0; padding: 10px 8px; color: var(--muted); }
.inbox__empty svg { color: var(--success); }
.inbox:has(li) .inbox__empty { display: none; }

/* ---------- Pages, Media and Files ---------- */
.explorer {
  inset-block-end: 12px;
  display: flex;
  flex-direction: column;
  padding: 10px 12px 12px;
  overflow: clip;
}
/* B: opens from the left edge, under the project / page path. */
.editor[data-version="b"] .explorer { inset-inline-start: 8px; inline-size: min(760px, 100% - 16px); }
/* C: centred under the page picker, Media's width so tabs never resize it (today's box). */

.explorer-head { display: flex; align-items: center; gap: 8px; padding-block-end: 10px; }
.search {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-inline-size: 0;
  block-size: var(--size-control);
  padding-inline: 10px;
  border-radius: var(--radius);
  background: var(--surface-subtle);
  color: var(--muted);
  box-shadow: inset 0 0 0 1px var(--control-line);
}
.search:focus-within { outline: var(--focus-ring); outline-offset: 1px; }
.search input { flex: 1; min-inline-size: 0; border: 0; background: transparent; outline: none; color: var(--text); }
.new {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  block-size: var(--size-compact);
  padding-inline: 8px 10px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  font-size: var(--type-small);
  font-weight: 600;
  box-shadow: inset 0 0 0 1px var(--control-line);
  white-space: nowrap;
}
/* B: one segmented control. */
.segments { display: inline-flex; padding: 2px; border-radius: var(--radius); background: var(--surface-subtle); flex: none; }
.segments button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  block-size: 28px;
  padding-inline: 10px 12px;
  border: 0;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--muted);
}
.segments button[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px light-dark(oklch(15% 0.06 263 / 0.12), oklch(0% 0 0 / 0.5)); }
/* C: today's underlined tabs, with search, New and Site settings on the same row. */
.tabs { display: flex; align-self: stretch; border-block-end: 1px solid var(--control-line); flex: none; }
.tabs button {
  min-block-size: var(--size-control);
  padding-inline: 14px;
  margin-block-end: -1px;
  border: 0;
  border-block-end: 2px solid transparent;
  background: transparent;
  color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--text); border-block-end-color: var(--primary); font-weight: 600; }

.explorer-body { flex: 1; min-block-size: 0; overflow: auto; margin-inline: -4px; padding-inline: 4px; }

.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { padding-inline-start: 20px; }
.row, .tree summary {
  display: flex;
  align-items: center;
  gap: 8px;
  inline-size: 100%;
  min-block-size: var(--size-control);
  padding-inline: 6px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  text-align: start;
  white-space: nowrap;
  cursor: pointer;
  list-style: none;
}
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before {
  content: "";
  inline-size: 0;
  block-size: 0;
  border-block: 4px solid transparent;
  border-inline-start: 5px solid var(--muted);
  transition: rotate 150ms ease-out;
}
.tree details[open] > summary::before { rotate: 90deg; }
.row svg, .tree summary svg { color: var(--muted); }
.row.is-current { background: var(--current); font-weight: 600; }
@media (hover: hover) and (pointer: fine) {
  .row:hover, .tree summary:hover { background: var(--hover); }
  .row.is-current:hover { background: var(--current); }
}
.row__label { min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; }
.row__url { margin-inline-start: auto; padding-inline-start: 12px; color: var(--muted); font: var(--type-small)/1 var(--font-mono); }
/* A page with an open inbox item: a small dot, nothing else. */
.row[data-waiting] .row__label::after {
  content: "";
  display: inline-block;
  inline-size: 7px;
  block-size: 7px;
  margin-inline-start: 8px;
  border-radius: 50%;
  background: var(--question);
  vertical-align: 2px;
}

.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
  padding: 2px;
}
.tile-media {
  display: grid;
  gap: 6px;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: start;
  font-size: var(--type-small);
  color: var(--muted);
}
.tile-media i {
  display: block;
  aspect-ratio: 4 / 3;
  border-radius: var(--radius);
  background: var(--swatch);
}
.tile-media[aria-pressed="true"] i { outline: 2px solid var(--primary); outline-offset: 2px; }
.tile-media[aria-pressed="true"] { color: var(--text); }
.tile-media span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-media[data-waiting] span::after {
  content: "";
  display: inline-block;
  inline-size: 7px;
  block-size: 7px;
  margin-inline-start: 6px;
  border-radius: 50%;
  background: var(--question);
}
.nothing { margin: 8px 6px; color: var(--muted); }

/* ---------- v3: page scores ---------- */
:root {
  --poor: light-dark(oklch(55% 0.2 27), oklch(70% 0.17 25));
  --good: light-dark(oklch(52% 0.13 145), oklch(74% 0.14 145));
}
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.link {
  block-size: 24px;
  padding-inline: 8px;
  border: 0;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--primary);
  font-size: var(--type-small);
  font-weight: 500;
}
@media (hover: hover) and (pointer: fine) { .link:hover { background: var(--hover); } }

/* A page row: the page button, then one small ring. */
.row-line { display: flex; align-items: center; gap: 2px; }
.row-line > .row { flex: 1; min-inline-size: 0; }

/* One mark per row: the ring's fill is the page's lowest score. Calm when all is well. */
.ring {
  --ring: color-mix(in oklch, var(--muted) 40%, transparent);
  position: relative;
  display: inline-grid;
  place-items: center;
  flex: none;
  inline-size: 26px;
  block-size: 26px;
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
}
.ring svg { inline-size: 14px; block-size: 14px; rotate: -90deg; fill: none; stroke-width: 2.5; }
.ring .track { stroke: color-mix(in oklch, var(--text) 10%, transparent); }
.ring .arc { stroke: var(--ring); stroke-linecap: round; }
.ring[data-band="improve"] { --ring: var(--question); }
.ring[data-band="poor"] { --ring: var(--poor); }
body[data-perfect="hidden"] .ring[data-band="good"] svg { visibility: hidden; }
@media (hover: hover) and (pointer: fine) { .ring:hover { background: var(--hover); } }
/* The four numbers, on hover or keyboard focus only. */
.ring::after {
  content: attr(data-tip);
  position: absolute;
  z-index: 2;
  inset-block-start: 50%;
  inset-inline-end: calc(100% + 6px);
  translate: 0 -50%;
  display: none;
  padding: 6px 10px;
  border-radius: var(--radius);
  background: var(--text);
  color: var(--surface);
  font-size: var(--type-small);
  line-height: 1.6;
  text-align: start;
  white-space: pre;
  pointer-events: none;
}
.ring:is(:hover, :focus-visible)::after { display: block; }

/* Page details, inside the same panel. */
.back { padding-inline: 6px 10px; color: var(--muted); }
.details__title { display: grid; min-inline-size: 0; line-height: 1.3; }
.details__title b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.details__title small { color: var(--muted); font: var(--type-small)/1.3 var(--font-mono); }
.details { display: grid; gap: 18px; padding: 8px 6px 4px; }
.gauges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.gauge { --ring: var(--good); display: grid; justify-items: center; gap: 6px; text-align: center; }
.gauge[data-band="improve"] { --ring: var(--question); }
.gauge[data-band="poor"] { --ring: var(--poor); }
.gauge__dial { position: relative; display: grid; place-items: center; inline-size: 64px; block-size: 64px; }
.gauge__dial svg { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; rotate: -90deg; fill: none; stroke-width: 3; }
.gauge__dial .track { stroke: color-mix(in oklch, var(--ring) 16%, transparent); }
.gauge__dial .arc { stroke: var(--ring); stroke-linecap: round; transition: stroke-dasharray 400ms ease-out; }
.gauge__dial b { font-size: 18px; font-weight: 600; color: var(--ring); font-variant-numeric: tabular-nums; }
.gauge span { font-size: var(--type-small); color: var(--muted); }
.measured { margin: -6px 0 0; text-align: center; color: var(--muted); font-size: var(--type-small); }
.improve h4 {
  margin: 0 0 4px;
  padding-inline: 6px;
  font-size: var(--type-small);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.improve ul { list-style: none; margin: 0; padding: 0; display: grid; }
.improve li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; border-radius: var(--radius); }
.improve li > svg { margin-inline-start: 6px; color: var(--muted); }
.improve__cat { margin-inline-end: 8px; color: var(--muted); font-size: var(--type-small); white-space: nowrap; }
@media (hover: hover) and (pointer: fine) { .improve li:has(.item:hover) { background: var(--hover); } }
.all-good { display: flex; align-items: center; gap: 8px; margin: 0; padding: 6px; color: var(--muted); }
.all-good svg { color: var(--good); }

/* Site health: every page and its four scores. */
.health {
  inset-inline: 0;
  margin-inline: auto;
  inline-size: min(760px, 100% - 32px);
  max-block-size: calc(100% - var(--bar-height) - 24px);
  padding: 10px 12px 12px;
  overflow: auto;
}
.health table { inline-size: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.health th, .health td { padding: 0; text-align: end; }
.health :is(th, td):first-child { text-align: start; }
.health thead th { border-block-end: 1px solid var(--line); }
.sort {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  block-size: 32px;
  padding-inline: 8px;
  border: 0;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--muted);
  font-size: var(--type-small);
  font-weight: 600;
  white-space: nowrap;
}
th[aria-sort] .sort { color: var(--text); }
.sort svg { opacity: 0; }
th[aria-sort] .sort svg { opacity: 1; }
th[aria-sort="descending"] .sort svg { rotate: 180deg; }
@media (hover: hover) and (pointer: fine) { .sort:hover { background: var(--hover); color: var(--text); } }
.health td { block-size: 36px; padding-inline: 8px; border-block-end: 1px solid color-mix(in oklch, var(--line) 60%, transparent); }
.health td:first-child { padding-inline: 0; }
.health tbody tr:last-child td { border-block-end: 0; }
.health .site-row td { font-weight: 600; background: var(--surface-subtle); }
.health .site-row td:first-child { padding-inline: 8px; border-start-start-radius: var(--radius); border-end-start-radius: var(--radius); }
.health .site-row td:last-child { border-start-end-radius: var(--radius); border-end-end-radius: var(--radius); }
.health-page {
  display: grid;
  inline-size: 100%;
  padding: 4px 8px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  text-align: start;
  line-height: 1.3;
}
.health-page small { color: var(--muted); font: var(--type-small)/1.3 var(--font-mono); }
@media (hover: hover) and (pointer: fine) { .health tbody tr:has(.health-page:hover) td { background: var(--hover); } }
.num { color: var(--muted); }
.num[data-band="improve"] { color: var(--question); font-weight: 600; }
.num[data-band="poor"] { color: var(--poor); font-weight: 600; }
</style>

  { title: "About", url: "/about", base: { perf: 98, a11y: 100, bp: 100, seo: 100 } },
  { title: "Blog", url: "/blog", base: { perf: 100, a11y: 100, bp: 100, seo: 100 }, children: [
    { title: "New post", url: "/blog/new", untitled: true, base: { perf: 100, a11y: 100, bp: 100, seo: 100 } },
    { title: "Hello world", url: "/blog/hello-world", base: { perf: 99, a11y: 100, bp: 100, seo: 100 } },
  ] },
  { title: "Services", url: "/services", base: { perf: 99, a11y: 100, bp: 100, seo: 100 }, children: [
    { title: "Reviews", url: "/services/reviews", base: { perf: 100, a11y: 100, bp: 100, seo: 100 } },
  ] },
  { title: "Contact", url: "/contact", base: { perf: 97, a11y: 100, bp: 100, seo: 100 } },
];
const ALL_PAGES = PAGES.flatMap((p) => [p, ...(p.children || [])]);
const MEDIA = [
  { name: "hero.jpg", swatch: "linear-gradient(135deg, oklch(72% 0.09 200), oklch(55% 0.12 262))" },
  { name: "team.jpg", swatch: "linear-gradient(135deg, oklch(78% 0.1 70), oklch(60% 0.14 30))", waitingFor: "picture" },
  { name: "services-hero.jpg", swatch: "linear-gradient(160deg, oklch(80% 0.05 140), oklch(52% 0.09 160))" },
  { name: "logo.svg", swatch: "radial-gradient(circle at 50% 50%, oklch(50% 0.18 263) 0 28%, oklch(94% 0.02 263) 29%)" },
  { name: "blog-cover.jpg", swatch: "linear-gradient(200deg, oklch(70% 0.12 320), oklch(48% 0.12 290))" },
  { name: "portrait-anna.jpg", swatch: "linear-gradient(135deg, oklch(84% 0.05 50), oklch(62% 0.08 40))" },
  { name: "map.png", swatch: "repeating-linear-gradient(45deg, oklch(88% 0.03 120) 0 10px, oklch(82% 0.04 120) 10px 20px)" },
  { name: "pattern.svg", swatch: "repeating-radial-gradient(circle at 30% 30%, oklch(62% 0.13 262) 0 4px, oklch(90% 0.03 262) 4px 12px)" },
];
const FILES = [
  { folder: "components", files: ["site-header.html", "site-footer.html", "hero.html", "cards.html"] },
  { folder: "styles", files: ["site.css", "tokens.css"] },
  { folder: "about", files: ["index.html"] },
  { folder: "blog", files: ["index.html", "new.html", "hello-world.html"] },
  { file: "index.html" },
  { file: "robots.txt" },
  { file: "sitemap.xml" },
];
/* Inbox items. Site improvements carry the points they cost a page (hit). */
const ITEMS = [
  { id: "picture", kind: "picture", icon: "image", what: "Picture without a description", where: "About · team.jpg", page: "About", spot: "picture", label: "About · team picture", wave: "Decorative", hit: { a11y: 12 } },
  { id: "map-embed", kind: "page", icon: "file", what: "Embedded map slows the page", where: "Services · map from another site", page: "Services", spot: "cards", label: "Services · map", hit: { perf: 10 } },
  { id: "jump", kind: "page", icon: "file", what: "Layout jumps while loading", where: "Services · banner added by a script", page: "Services", spot: "heading", label: "Services · banner", hit: { perf: 7 } },
  { id: "title", kind: "page", icon: "file", what: "Page without a title", where: "/blog/new", page: "New post", spot: "heading", label: "Page title", hit: { seo: 9 } },
  { id: "link-text", kind: "page", icon: "file", what: "Link says only “click here”", where: "Hello world · second card", page: "Hello world", spot: "cards", label: "Hello world · link", hit: { seo: 8 } },
  { id: "agent", kind: "agent", icon: "sparkle", what: "Agent question", where: "Home · hero heading", page: "Home", spot: "heading", label: "Hero heading · question" },
  { id: "host", kind: "setup", icon: "checks", what: "Setup: connect a host", where: "Site settings", page: null, spot: "host", label: "Host" },
];

const state = { tab: "pages", page: "Home", file: null, media: null, query: "", saved: false, details: null, sort: { key: "lowest", dir: "ascending" } };
let items = [...ITEMS];
const editor = document.getElementById("editor");
const bar = document.getElementById("bar");
const stage = document.getElementById("stage");
const panels = Object.fromEntries(["menu", "settings", "inbox", "explorer", "health"].map((id) => [id, document.getElementById(id)]));
const icon = (id, size = 16) => `<svg width="${size}" height="${size}"><use href="#${id}"/></svg>`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pageByTitle = (t) => ALL_PAGES.find((p) => p.title === t);
const nameOf = (p) => (p.untitled ? "Untitled" : p.title);

/* ---------- Scores ---------- */
function openImprovements(page) { return items.filter((i) => i.page === page.title && i.hit); }
function scores(page) {
  const s = { ...page.base };
  for (const item of openImprovements(page)) for (const [cat, n] of Object.entries(item.hit)) s[cat] -= n;
  return s;
}
const lowest = (s) => Math.min(...CATS.map(([k]) => s[k]));
// Lighthouse's bands: 90-100 good, 50-89 needs work, 0-49 poor.
const bandOf = (n) => (n < 50 ? "poor" : n < 90 ? "improve" : "good");
function rowBand(page) {
  const low = lowest(scores(page));
  if (low < 50) return "poor";
  return low < 90 || openImprovements(page).length ? "improve" : "good";
}
function ringButton(page) {
  const s = scores(page);
  const tip = CATS.map(([k, label]) => `${label}  ${s[k]}`).join("\n");
  const fill = lowest(s);
  return `<button type="button" class="ring" data-scores="${esc(page.title)}" data-band="${rowBand(page)}" data-tip="${tip}" aria-label="Scores for ${esc(nameOf(page))}: ${CATS.map(([k, l]) => `${l} ${s[k]}`).join(", ")}">
    <svg viewBox="0 0 16 16"><circle class="track" cx="8" cy="8" r="6" pathLength="100"/><circle class="arc" cx="8" cy="8" r="6" pathLength="100" stroke-dasharray="${fill} 100"/></svg></button>`;
}
function gauge(label, n) {
  return `<div class="gauge" data-band="${bandOf(n)}"><div class="gauge__dial"><svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="16" pathLength="100"/><circle class="arc" cx="18" cy="18" r="16" pathLength="100" stroke-dasharray="${n} 100"/></svg><b>${n}</b></div><span>${label}</span></div>`;
}

/* ---------- Bar and stage ---------- */
function pickerLabel() {
  if (state.file) {
    const [folder, name] = state.file.includes("/") ? state.file.split("/") : [null, state.file];
    return folder ? `<span class="folder-part">${folder} / </span>${name}` : name;
  }
  return nameOf(pageByTitle(state.page));
}
function renderBar() {
  const caret = icon("caret", 12).replace("<svg", '<svg class="caret"');
  // No divider before Save (Lex, 2026-10-26).
  bar.innerHTML = `
    <div class="bar__start">
      <button type="button" class="ghost" data-open="menu" aria-expanded="false"><span class="tile">T</span><span class="project__name">techies-site</span></button>
      <span class="slash" aria-hidden="true">/</span>
      <button type="button" class="ghost picker" data-open="explorer" aria-expanded="false"><span class="picker__label">${pickerLabel()}</span>${caret}</button>
    </div>
    <div class="bar__end">
      <button type="button" class="icon-button" aria-label="Undo" title="Undo">${icon("undo")}</button>
      <button type="button" class="icon-button" aria-label="History" title="History">${icon("history")}</button>
      <button type="button" class="icon-button inbox-button" data-open="inbox" aria-label="Inbox" title="Inbox" aria-expanded="false">${icon("tray", 17)}</button>
      <button type="button" class="save" data-save data-state="${state.saved ? "saved" : ""}">${state.saved ? "Live" : "Save 3 changes"}</button>
    </div>`;
}
function renderStage() {
  if (state.file) {
    stage.innerHTML = `<pre class="code">${state.file.endsWith(".css")
      ? `<b>.site-header</b> {\n  display: flex;\n  gap: var(--space-4);\n  padding-block: var(--space-3);\n}\n\n<b>.hero</b> {\n  display: grid;\n  grid-template-columns: 1.2fr 1fr;\n}`
      : `&lt;<b>header</b> class="site-header"&gt;\n  &lt;<b>a</b> href="/"&gt;Techies&lt;/a&gt;\n  &lt;<b>nav</b>&gt;…&lt;/nav&gt;\n&lt;/header&gt;`}</pre>`;
    return;
  }
  const heading = state.page === "New post" ? "" : state.page === "Home" ? "Honest reviews by people who fix things" : state.page;
  stage.innerHTML = `
    <div class="site">
      <div class="site__nav"><b>Techies</b><span>About</span><span>Blog</span><span>Services</span><span>Contact</span></div>
      <div class="site__hero">
        <div><h2 data-spot="heading">${heading || "&nbsp;"}</h2><p>We test the tools so you don't have to.</p><p>Plain words, real results.</p></div>
        <div class="site__pic" data-spot="picture"></div>
      </div>
      <div class="site__cards" data-spot="cards"><i></i><i></i><i></i></div>
    </div>`;
}

/* ---------- Pages, Media and Files (with page details) ---------- */
function waitingMedia(m) { return m.waitingFor && items.some((i) => i.id === m.waitingFor); }
function matches(text) { return !state.query || text.toLowerCase().includes(state.query.toLowerCase()); }

function renderExplorerHead() {
  const head = document.getElementById("explorer-head");
  if (state.details) {
    const page = pageByTitle(state.details);
    head.innerHTML = `<button type="button" class="ghost back" data-back>${icon("arrow-left", 14)}Pages</button>
      <div class="details__title"><b>${esc(nameOf(page))}</b><small>${page.url}</small></div>`;
    return;
  }
  const tabs = [["pages", "Pages", "file"], ["media", "Media", "image"], ["files", "Files", "folder"]];
  const placeholder = { pages: "Search pages", media: "Search media", files: "Search files" }[state.tab];
  const newLabel = { pages: "New page", media: "Add", files: "New" }[state.tab];
  head.innerHTML = `<div class="segments" role="tablist" aria-label="Pages, media or files">${tabs.map(([id, label, ic]) =>
      `<button type="button" role="tab" data-tab="${id}" aria-selected="${state.tab === id}">${icon(ic, 14)}${label}</button>`).join("")}</div>
    <label class="search">${icon("search", 14)}<input type="search" id="explorer-search" aria-label="${placeholder}" placeholder="${placeholder}" value="${esc(state.query)}"></label>
    <button type="button" class="new">${icon("plus", 12)}${newLabel}</button>`;
}

function renderDetails(body) {
  const page = pageByTitle(state.details);
  const s = scores(page);
  const open = openImprovements(page);
  const catName = (item) => CATS.find(([k]) => k in item.hit)[1];
  body.innerHTML = `<div class="details">
    <div class="gauges">${CATS.map(([k, label]) => gauge(label, s[k])).join("")}</div>
    <p class="measured">Measured on this computer · just now</p>
    <div class="improve"><h4>What to improve</h4>${open.length
      ? `<ul>${open.map((i) => `<li>${icon(i.icon)}<button type="button" class="item" data-go="${i.id}"><b>${i.what}</b><small>${i.where}</small></button><span class="improve__cat">${catName(i)}</span></li>`).join("")}</ul>`
      : `<p class="all-good">${icon("check")}Nothing to improve</p>`}</div>
  </div>`;
}

function renderExplorerBody() {
  const body = document.getElementById("explorer-body");
  if (state.details) return renderDetails(body);
  if (state.tab === "pages") {
    const row = (p) => `<div class="row-line"><button type="button" class="row${!state.file && state.page === p.title ? " is-current" : ""}" data-page="${p.title}">${icon("file", 15)}<span class="row__label">${esc(nameOf(p))}</span><span class="row__url">${p.url}</span></button>${ringButton(p)}</div>`;
    const keep = (p) => matches(p.title + " " + p.url) || (p.children || []).some(keep);
    const list = (pages) => pages.filter(keep).map((p) => p.children
      ? `<li>${row(p)}<ul>${list(p.children)}</ul></li>`
      : `<li>${row(p)}</li>`).join("");
    const html = list(PAGES);
    body.innerHTML = html ? `<ul class="tree">${html}</ul>` : `<p class="nothing">No page matches</p>`;
  } else if (state.tab === "media") {
    const tiles = MEDIA.filter((m) => matches(m.name)).map((m) =>
      `<button type="button" class="tile-media" data-media="${m.name}" aria-pressed="${state.media === m.name}"${waitingMedia(m) ? " data-waiting" : ""} style="--swatch: ${m.swatch}"><i></i><span>${m.name}</span></button>`).join("");
    body.innerHTML = tiles ? `<div class="media-grid">${tiles}</div>` : `<p class="nothing">No media matches</p>`;
  } else {
    const fileRow = (path, name) => `<button type="button" class="row${state.file === path ? " is-current" : ""}" data-file="${path}">${icon("file-code", 15)}<span class="row__label">${name}</span></button>`;
    const html = FILES.map((f) => {
      if (f.file) return matches(f.file) ? `<li>${fileRow(f.file, f.file)}</li>` : "";
      const kids = f.files.filter((n) => matches(f.folder + "/" + n));
      if (!kids.length) return "";
      const open = state.query || state.file?.startsWith(f.folder + "/") || f.folder === "components";
      return `<li><details${open ? " open" : ""}><summary>${icon("folder", 15)}<span class="row__label">${f.folder}</span></summary><ul>${kids.map((n) => `<li>${fileRow(f.folder + "/" + n, n)}</li>`).join("")}</ul></details></li>`;
    }).join("");
    body.innerHTML = html ? `<ul class="tree">${html}</ul>` : `<p class="nothing">No file matches</p>`;
  }
}

/* ---------- Site health ---------- */
function renderHealth() {
  const rows = ALL_PAGES.map((p) => ({ page: p, s: scores(p) }));
  const avg = Object.fromEntries(CATS.map(([k]) => [k, Math.round(rows.reduce((t, r) => t + r.s[k], 0) / rows.length)]));
  const { key, dir } = state.sort;
  const value = (r) => (key === "lowest" ? lowest(r.s) : key === "page" ? nameOf(r.page) : r.s[key]);
  rows.sort((a, b) => {
    const va = value(a), vb = value(b);
    const order = typeof va === "string" ? va.localeCompare(vb) : va - vb || nameOf(a.page).localeCompare(nameOf(b.page));
    return dir === "ascending" ? order : -order;
  });
  const th = (k, label) => `<th${key === k ? ` aria-sort="${dir}"` : ""}><button type="button" class="sort" data-sort="${k}">${label}${icon("arrow-up", 11)}</button></th>`;
  const num = (n) => `<td class="num" data-band="${bandOf(n)}">${n}</td>`;
  panels.health.innerHTML = `
    <div class="panel-head"><h3 class="panel-title">Site health</h3><button type="button" class="link" data-sort="lowest">Lowest first</button></div>
    <table>
      <thead><tr>${th("page", "Page")}${CATS.map(([k, l]) => th(k, l)).join("")}</tr></thead>
      <tbody>
        <tr class="site-row"><td>Whole site</td>${CATS.map(([k]) => num(avg[k])).join("")}</tr>
        ${rows.map((r) => `<tr><td><button type="button" class="health-page" data-scores="${esc(r.page.title)}"><span>${esc(nameOf(r.page))}</span><small>${r.page.url}</small></button></td>${CATS.map(([k]) => num(r.s[k])).join("")}</tr>`).join("")}
      </tbody>
    </table>`;
}

/* ---------- Menu and inbox ---------- */
function renderMenu() {
  panels.menu.innerHTML = `
    <div class="menu__who"><span class="tile">T</span><div><b>techies-site</b><small>techiesreviews</small></div></div>
    <button type="button" class="menu__item" role="menuitem">${icon("folder")}Switch project</button>
    <button type="button" class="menu__item" role="menuitem" data-open="settings">${icon("gear")}Site settings</button>
    <button type="button" class="menu__item" role="menuitem" data-open="health">${icon("gauge")}Site health</button>
    <button type="button" class="menu__item" role="menuitem">${icon("file")}Download site</button>
    <div class="menu__sep"></div>
    <button type="button" class="menu__item" role="menuitem">Sign out</button>`;
}
function renderInbox() {
  const list = document.getElementById("inbox-list");
  list.replaceChildren(...items.map((item) => {
    const li = document.createElement("li");
    li.dataset.kind = item.kind;
    li.innerHTML = `${icon(item.icon)}<button type="button" class="item" data-go="${item.id}"><b>${item.what}</b><small>${item.where}</small></button>`;
    if (item.wave) {
      const wave = document.createElement("button");
      wave.type = "button";
      wave.className = "wave";
      wave.textContent = item.wave;
      wave.addEventListener("click", (event) => {
        event.stopPropagation();
        li.dataset.leaving = "";
        setTimeout(() => { items = items.filter((x) => x !== item); renderAll(); }, 200);
      });
      li.append(wave);
    }
    return li;
  }));
  document.body.toggleAttribute("data-waiting", items.length > 0);
}

function renderAll() {
  renderBar();
  renderStage();
  renderMenu();
  renderInbox();
  renderExplorerHead();
  renderExplorerBody();
  renderHealth();
  syncExpanded();
}

/* ---------- Opening and closing panels ---------- */
let openName = null;
function open(name, { keepDetails = false } = {}) {
  const again = openName === name && !keepDetails;
  closeAll();
  if (again) return;
  if (name === "explorer") {
    state.query = "";
    if (!keepDetails) state.details = null;
    renderExplorerHead();
    renderExplorerBody();
  }
  if (name === "health") renderHealth();
  panels[name].hidden = false;
  openName = name;
  syncExpanded();
}
function closeAll() {
  for (const p of Object.values(panels)) p.hidden = true;
  openName = null;
  syncExpanded();
}
function syncExpanded() {
  for (const b of bar.querySelectorAll("[data-open]")) b.setAttribute("aria-expanded", String(b.dataset.open === openName));
}
function clearRings() { for (const el of document.querySelectorAll("[data-ring]")) delete el.dataset.ring; }
function ring(el, label) {
  if (!el) return;
  el.dataset.ring = label;
  el.style.animation = "none";
  void el.offsetWidth;
  el.style.animation = "";
}
function showDetails(title) {
  state.details = title;
  state.tab = "pages";
  open("explorer", { keepDetails: true });
}
function go(item) {
  closeAll();
  clearRings();
  if (item.page) {
    state.page = item.page;
    state.file = null;
    renderBar();
    renderStage();
    ring(stage.querySelector(`[data-spot="${item.spot}"]`), item.label);
  } else {
    open("settings");
    ring(panels.settings.querySelector('[data-spot="host"]').closest("label"), item.label);
  }
}

document.addEventListener("click", (event) => {
  const t = event.target;
  const opener = t.closest("[data-open]");
  if (opener) { event.stopPropagation(); open(opener.dataset.open); return; }
  const scoresFor = t.closest("[data-scores]");
  if (scoresFor) { showDetails(scoresFor.dataset.scores); return; }
  if (t.closest("[data-back]")) { state.details = null; renderExplorerHead(); renderExplorerBody(); return; }
  const goTo = t.closest("[data-go]");
  if (goTo) { go(items.find((i) => i.id === goTo.dataset.go)); return; }
  const sort = t.closest("[data-sort]");
  if (sort) {
    const key = sort.dataset.sort;
    state.sort = state.sort.key === key && key !== "lowest"
      ? { key, dir: state.sort.dir === "ascending" ? "descending" : "ascending" }
      : { key, dir: "ascending" };
    renderHealth();
    return;
  }
  const tab = t.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; state.query = ""; renderExplorerHead(); renderExplorerBody(); return; }
  const page = t.closest("[data-page]");
  if (page) { state.page = page.dataset.page; state.file = null; clearRings(); closeAll(); renderBar(); renderStage(); return; }
  const file = t.closest("[data-file]");
  if (file) { state.file = file.dataset.file; clearRings(); closeAll(); renderBar(); renderStage(); return; }
  const media = t.closest("[data-media]");
  if (media) { state.media = state.media === media.dataset.media ? null : media.dataset.media; renderExplorerBody(); return; }
  if (t.closest("[data-save]")) { state.saved = !state.saved; renderBar(); syncExpanded(); return; }
  if (openName && !t.closest(".panel")) closeAll();
});
document.addEventListener("input", (event) => {
  if (event.target.id !== "explorer-search") return;
  state.query = event.target.value;
  renderExplorerBody();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && openName) closeAll();
});

for (const pick of document.querySelectorAll("button[data-perfect]")) {
  pick.addEventListener("click", (event) => {
    event.stopPropagation();
    document.body.dataset.perfect = pick.dataset.perfect;
    for (const p of document.querySelectorAll("button[data-perfect]")) p.setAttribute("aria-pressed", String(p === pick));
  });
}
document.getElementById("reset").addEventListener("click", (event) => {
  event.stopPropagation();
  items = [...ITEMS];
  Object.assign(state, { page: "Home", file: null, media: null, query: "", saved: false, details: null, sort: { key: "lowest", dir: "ascending" } });
  closeAll();
  clearRings();
  renderAll();
});
const theme = document.getElementById("theme");
theme.addEventListener("click", (event) => {
  event.stopPropagation();
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  theme.querySelector("span").textContent = dark ? "Light" : "Dark";
});

renderAll();
</script>
</body>
</html>
