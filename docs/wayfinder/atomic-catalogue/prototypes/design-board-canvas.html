/*
 * Inline fields: an editor text value reads as plain text in its row, with
 * no box around it. Pointing at it shows a faint surface and underline;
 * focus (from the pointer, a script or the keyboard alike) shows the input
 * surface with a thicker primary underline instead of a ring, and errors a
 * red underline. Only text-like fields in the editor's panels take this
 * (never checkboxes, radios, ranges, colours, files, passwords, code
 * editors), and nothing here reaches
 * the site in the preview frame.
 *
 * `:root` raises these rules over each panel's own field rules, which load
 * after this file.
 */

:root :is(.page-structure__field, .page-structure__slot-field, .page-structure__attribute-add, .site-settings__field, .component-field, .component-attribute, .url-change, .edit-bar__field-label, .canvas-width) :is(input:is(:not([type]), [type="text"], [type="url"], [type="email"], [type="tel"], [type="number"]), textarea):not([hidden]),
:root :is(input.pages-edit__title, input.pages-edit__slug, input.pages-rename, input.edit-bar__field-input, input.canvas-width__input):not([hidden]) {
  border-color: transparent;
  background-color: transparent;
  box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--control-line) 45%, transparent);
  caret-color: var(--primary);
  transition: background-color 120ms ease-out, box-shadow 120ms ease-out;
}
.inline-field:hover:not(:disabled, [readonly], :focus),
:root :is(.page-structure__field, .page-structure__slot-field, .page-structure__attribute-add, .site-settings__field, .component-field, .component-attribute, .url-change, .edit-bar__field-label, .canvas-width) :is(input:is(:not([type]), [type="text"], [type="url"], [type="email"], [type="tel"], [type="number"]), textarea):hover:not(:disabled, [readonly], :focus),
:root :is(input.pages-edit__title, input.pages-edit__slug, input.pages-rename, input.edit-bar__field-input, input.canvas-width__input):hover:not(:disabled, [readonly], :focus) {
  background-color: var(--hover);
  box-shadow: inset 0 -1px 0 var(--control-line);
}
.inline-field:focus:not([readonly]),
:root :is(.page-structure__field, .page-structure__slot-field, .page-structure__attribute-add, .site-settings__field, .component-field, .component-attribute, .url-change, .edit-bar__field-label, .canvas-width) :is(input:is(:not([type]), [type="text"], [type="url"], [type="email"], [type="tel"], [type="number"]), textarea):focus:not([readonly]),
:root :is(input.pages-edit__title, input.pages-edit__slug, input.pages-rename, input.edit-bar__field-input, input.canvas-width__input):focus:not([readonly]) {
  outline: none;
  background-color: color-mix(in srgb, var(--primary) 7%, var(--surface-input));

:root :is(.page-structure__field, .page-structure__slot-field, .page-structure__attribute-add, .site-settings__field, .component-field, .component-attribute, .url-change, .edit-bar__field-label, .canvas-width) :is(input:is(:not([type]), [type="text"], [type="url"], [type="email"], [type="tel"], [type="number"]), textarea):focus-visible,
:root :is(input.pages-edit__title, input.pages-edit__slug, input.pages-rename, input.edit-bar__field-input, input.canvas-width__input):focus-visible {
  outline: none;
}
.inline-field[aria-invalid="true"],
:root :is(.page-structure__field, .page-structure__slot-field, .page-structure__attribute-add, .site-settings__field, .component-field, .component-attribute, .url-change, .edit-bar__field-label, .canvas-width) :is(input:is(:not([type]), [type="text"], [type="url"], [type="email"], [type="tel"], [type="number"]), textarea)[aria-invalid="true"],
:root :is(input.pages-edit__title, input.pages-edit__slug, input.pages-rename, input.edit-bar__field-input, input.canvas-width__input)[aria-invalid="true"] {

  box-shadow: inset 0 -2px 0 var(--danger);
}
.inline-field:disabled,
:root :is(.page-structure__field, .page-structure__slot-field, .page-structure__attribute-add, .site-settings__field, .component-field, .component-attribute, .url-change, .edit-bar__field-label, .canvas-width) :is(input:is(:not([type]), [type="text"], [type="url"], [type="email"], [type="tel"], [type="number"]), textarea):disabled,
:root :is(input.pages-edit__title, input.pages-edit__slug, input.pages-rename, input.edit-bar__field-input, input.canvas-width__input):disabled {
  box-shadow: none;
}
@media (forced-colors: active) {

:root :is(.page-structure__field, .page-structure__slot-field, .page-structure__attribute-add, .site-settings__field, .component-field, .component-attribute, .url-change, .edit-bar__field-label, .canvas-width) :is(input:is(:not([type]), [type="text"], [type="url"], [type="email"], [type="tel"], [type="number"]), textarea):focus,

/* Editor chrome only; the preview supplies its own runtime sheet. */
:where(:root, #app *) {
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--muted) 40%, transparent) transparent;
}
:where(:root, #app *)::-webkit-scrollbar { width: 6px; height: 6px; }
:where(:root, #app *)::-webkit-scrollbar-track { background: transparent; }
:where(:root, #app *)::-webkit-scrollbar-thumb {
  border-radius: 999px;
  background: color-mix(in srgb, var(--muted) 40%, transparent);
}
:where(:root, #app *)::-webkit-scrollbar-thumb:hover {
  background: color-mix(in srgb, var(--muted) 65%, transparent);
}
/* Monaco draws its own thumbs. Keep the track and its drag target intact. */
#app .monaco-scrollable-element > .scrollbar > .slider { background: transparent; }
#app .monaco-scrollable-element > .scrollbar > .slider::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: color-mix(in srgb, var(--muted) 40%, transparent);
  pointer-events: none;
}
#app .monaco-scrollable-element > .scrollbar > .slider:hover::before {
  background: color-mix(in srgb, var(--muted) 65%, transparent);
}
#app .monaco-scrollable-element > .scrollbar.vertical > .slider::before { width: 6px; left: auto; }
#app .monaco-scrollable-element > .scrollbar.horizontal > .slider::before { height: 6px; top: auto; }
@media (forced-colors: active) {
  :where(:root, #app *) { scrollbar-color: auto; }
  #app .monaco-scrollable-element > .scrollbar > .slider::before { background: CanvasText; }
}

/* The editor's CSS on the Techies Framework layers (docs/wayfinder/atomic-catalogue/css-layers-plan.md): theme
   tokens, bare elements, then components each in a file of its own. The editor's screen CSS stays unlayered, so it
   wins over all three. */
@layer tokens, elements, components;

:root {
  font-family:
    Inter,
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--text);
  background: var(--background);
  font-synthesis: none;
  font-size: 14px;
  line-height: 1.5;
  color-scheme: light dark;
}
body {
  font-family: inherit;
  font-size: var(--type-base);
}
/* Bare elements, below every component: a Button's own font and colours win over these. */
@layer elements {
  button,
  a,
  select {
    font: inherit;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    cursor: pointer;
  }
}
/* Bare icon and text buttons have no fill and fade; a Button is plain instead (src/ui/parts/button.css).
   Hover rules below sit behind (hover: hover) and (pointer: fine), as a touch
   screen keeps :hover on the last tap; touch gets the :active press instead. */
button:disabled:where(:not(.button)),
select:disabled {
  cursor: default;
  opacity: 0.5;
}
button:focus-visible,
a:focus-visible,
select:focus-visible,
summary:focus-visible,
pre:focus-visible {
  outline: var(--focus-ring);
  outline-offset: 2px;
}
#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}
/* The slim top bar (atomic catalogue ticket 66, version B): one 44 px row. On the left a path, the project
   tile and name, "/" (#repository-menu::after), then the page button; on the right Undo, Redo, History, then
   Publish, with no divider before it (the Inbox's button goes before Publish, site-quality slice 40). On a phone
   (below) the same row holds the site and page, Undo, Publish and the one Menu (top-bar-phone.ts). */
.topbar {
  display: flex;
  align-items: center;
  gap: var(--space-3xs);
  min-height: var(--size-touch);
  padding-inline: var(--space-xs) var(--space-s);
  border-block-end: 1px solid var(--line);
  background: var(--surface);
  /* The explorer opens from this bar's bottom edge. */
  anchor-name: --topbar;
}
#repository-menu::after {
  content: "/";
  color: var(--muted);
}
.topbar .repository-menu__trigger {
  padding-block: 0;
}
.topbar :is(.repository-menu__repository, .repository-menu__caret) {
  display: none;
}
.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  text-decoration: none;
  font-size: var(--type-title);
  white-space: nowrap;
}
.brand strong {
  font-weight: 600;
}
.brand-mark {
  position: relative;
  display: grid;
  place-items: center;
  background: var(--primary);
  color: var(--on-primary);
  border-radius: 10px;
  width: 35px;
  height: 35px;
  font-size: 30px;
  font-family: Georgia, serif;
  line-height: 1;
}
.brand-mark span {
  position: absolute;
  right: 3px;
  top: 4px;
  font-size: 10px;
}
.muted {
  color: var(--muted);
}
.workspace {
  display: grid;
  grid-template-columns: var(--sidebar-width, 280px) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  flex: 1;
  min-height: 0;
}
.sidebar {
  background: var(--surface-subtle);

  padding: 0 20px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.sidebar-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  /* A strip as tall as the canvas bar beside it, in the sidebar's colour. */
  min-height: 36px;
  margin: 0 -20px 8px;
  padding: 4px 12px 4px 20px;
}
/* A section heading: the same in the sidebar, the explorer and the menus. */
.eyebrow,
.files-heading {
  font-size: var(--type-small);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--muted);
}
.workspace--sidebar-collapsed .sidebar {
  padding: 0;
  overflow: visible;
}
.workspace--sidebar-collapsed .sidebar > :not(.sidebar-resize) {
  display: none;
}
.topbar-actions {
  display: flex;
  flex: none;
  align-items: center;
  gap: var(--space-3xs);
  margin-inline-start: auto;
}
.editor-toolbar-host {
  display: flex;
}
.code-split {
  position: relative;
  display: flex;
  min-height: 0;
  min-width: 0;
  flex: 1;
}
.code-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.code-pane[hidden] {
  display: none;
}
.code-pane__title {
  padding: 6px 16px;
  font-size: var(--type-small);
  color: var(--muted);
  background: var(--surface-toolbar);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.code-pane__title {
  display: flex;
  align-items: center;
  gap: 10px;
}
.code-pane__title > span:first-child {
  flex: none;
}
.code-pane__rules {
  display: flex;
  gap: 4px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.code-pane__rule {
  flex: none;
  display: inline-flex;
  gap: 5px;
  padding: 1px 7px;
  border: 0;
  border-radius: 999px;
  background: var(--selected);
  color: var(--link);
  font: inherit;
  font-family: var(--font-mono);
  font-size: var(--type-small);
  line-height: 18px;
}
.code-pane__rule:active {
  background: var(--surface-raised);
}
@media (hover: hover) and (pointer: fine) {
  .code-pane__rule:hover {
    background: var(--surface-raised);
  }
}
.code-pane__rule-file,
.code-pane__rule-origin {
  color: var(--muted);
  font-family: inherit;
}
.code-pane__rule-origin {
  font-family: system-ui, sans-serif;
}
/* Rules the cascade could not settle (a state, an unmet or unverified condition). */
.code-pane__rule--neutral {
  background: var(--surface-raised);
  color: var(--text);
}
/* Rules whose every declaration loses: listed last, crossed out. */
.code-pane__rule--overridden {
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--muted);
}
.code-pane__rule--overridden .code-pane__rule-selector {
  text-decoration: line-through;
}
.code-pane > .workspace-content {
  flex: 1;
}
select {
  width: 100%;
  background: var(--surface);
  border: 0;
  border-radius: var(--radius);
  height: var(--size-control);
  padding: 0 10px;
  font-size: var(--type-base);
  text-overflow: ellipsis;
}
.icon-button {
  display: inline-grid;
  place-items: center;
  height: var(--size-control);
  width: var(--size-control);
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
}
.icon-button:active:not(:disabled) {
  background: var(--hover);
  color: var(--text);
}
@media (hover: hover) and (pointer: fine) {
  .icon-button:hover:not(:disabled),
  .explorer-toggle:hover {
    background: var(--hover);
    color: var(--text);
  }
}
.files-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 30px 0 12px;
}
.files-heading #revision {
  font-family: var(--font-mono);
  font-size: var(--type-small);
  letter-spacing: 0;
  text-transform: none;
  font-weight: 400;
}
.sidebar-hint {
  font-size: var(--type-small);
  line-height: 1.7;
  margin: 16px 0;
}
#files {
  flex: 1;
  overflow: auto;
  max-height: calc(100dvh - 390px);
  min-height: 140px;
  margin: 0 -8px;
}
main {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface);
}
main > .code-split {
  flex: 1;
}
#breadcrumb {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.workspace-content {
  max-height: 100%;
  overflow: auto;
  min-height: 0;
}
.welcome {
  max-width: 800px;
  margin: 0 auto;
  padding: 80px 65px 45px;
}
.intro-label {
  font-size: var(--type-small);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 22px;
}
h1 {
  font-size: clamp(30px, 3.6vw, 49px);
  font-weight: 500;
  letter-spacing: -0.055em;
  line-height: 1.12;
  margin: 0 0 22px;
  white-space: pre-line;
}
.intro {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.8;
  max-width: 470px;
  margin: 0 0 27px;
}
.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;

  padding-top: 30px;
  margin-top: 65px;
}
.step {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.step strong {
  font-size: var(--type-base);
  font-weight: 600;
}
.step > span:last-child {
  font-size: var(--type-small);
  color: var(--muted);
}
.command {
  display: block;
  padding: 10px 13px;
  background: var(--selected);
  border-radius: var(--radius-small);
  font-family: var(--font-mono);
  font-size: var(--type-small);
  margin: 12px 0;
}
.notice {
  background: var(--warning-bg);

  color: var(--warning-fg);
  padding: 11px 26px;
  font-size: var(--type-base);
  display: flex;
  gap: 18px;
  align-items: center;
  justify-content: center;
}
.notice[hidden] {
  display: none;
}
.text-button {
  border: 0;
  background: none;
  padding: 5px 0;
  color: var(--link);
  font-size: var(--type-base);
}
.text-button:active,
.text-link:active {
  text-decoration: underline;
}
@media (hover: hover) and (pointer: fine) {
  .text-button:hover,
  .text-link:hover {
    text-decoration: underline;
  }
}
.text-link {
  font-size: inherit;
  color: var(--link);
  text-decoration: none;
}
.empty-message {
  color: var(--muted);
  padding: 40px;
  font-size: var(--type-base);
}
/* Try again on a failed panel (its own line under the words) or in the notice. */
.empty-message .button, .notice .button {
  min-block-size: max(var(--size-control), var(--size-tap));
}
.empty-message .button {
  display: block;
  margin-block-start: var(--space-s);
}
.directory-summary {
  padding: 64px;
  max-width: 830px;
  margin: 0 auto;
}
.directory-summary h1 {
  font-size: 36px;
  margin-top: 20px;
  overflow-wrap: anywhere;
}
.upload-summary__image {
  display: block;
  max-width: 100%;
  max-height: 50vh;
  margin: 0 0 24px;
  border-radius: var(--radius);
  background: var(--surface);
}
.badge {
  display: inline-flex;
  font-size: var(--type-small);
  border: 0;
  color: var(--link);
  background: var(--surface-subtle);
  padding: 2px 9px;
  border-radius: 999px;
}
.project-meta {
  margin-top: 30px;
  font-size: var(--type-base);
}
.project-meta > div {
  display: grid;
  grid-template-columns: 100px minmax(0, 1fr);
  padding: 12px 0;
}
dt {
  color: var(--muted);
}
dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.next-step {
  padding: 3px 0 3px 16px;
  font-size: var(--type-small);
  line-height: 1.8;
  color: var(--muted);
  margin-top: 35px;
}
@media (min-width: 1500px) {
  .welcome {
    padding-top: 110px;
  }
  .directory-summary {
    padding-top: 90px;
  }
}
@media (max-width: 1050px) {
  .workspace {
    grid-template-columns: var(--sidebar-width, 240px) minmax(0, 1fr);
  }
  .welcome,
  .directory-summary {
    padding: 48px 35px;
  }
  .steps {
    gap: 12px;
  }
}
@media (max-width: 650px) {
  /* Phones (Lex's layout of 2026-11-11): one row, the rest behind the Menu, so the page gets the screen. */
  .topbar {
    gap: var(--space-4xs);
    padding-inline: var(--space-4xs) var(--space-3xs);
  }
  .topbar :is(.repository-menu__trigger, .code-editor__redo, .code-editor__history, .setup-pill),
  #repository-menu::after,
  .workspace :is(.block-rail, .canvas-bar:not(.canvas-bar--component)) {
    display: none;
  }
  .topbar .code-editor__toolbar {
    gap: var(--space-4xs);
  }
  .topbar .icon-button {
    width: var(--size-touch);
    height: var(--size-touch);
  }
  .topbar .explorer-toggle {
    flex: 1;
    max-width: none;
    min-height: var(--size-touch);
  }
  .brand {
    font-size: 13px;
  }
  .workspace {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  /* The shown sidebar leaves room at its bottom for its handle bar
     (sidebar-resize.css); the hidden one keeps a strip for it. */
  .sidebar {
    padding: 0 18px 28px;
  }
  .workspace--sidebar-collapsed .sidebar {
    min-height: 20px;
  }
  .sidebar-heading {
    margin: 0 -18px 8px;
    padding-left: 18px;
  }
  .files-heading {
    margin-top: 20px;
  }
  #files {
    max-height: 240px;
    min-height: 30px;
  }
  .sidebar-hint {
    margin: 5px 0;
  }
  .welcome,
  .directory-summary {
    padding: 35px 24px;
  }
  .workspace-content {
    max-height: none;
    min-height: 350px;
  }
  h1 {
    font-size: 37px;
  }
  .intro {
    font-size: 14px;
  }
  .steps {
    margin-top: 35px;
    gap: 15px;
  }
  .notice {
    padding: 12px 18px;
    justify-content: flex-start;
  }
  .empty-message {
    padding: 24px;
  }
}

/* Authentication is a separate view; the editor shell is mounted only after sign-in. */
#app.login-page {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 32px 20px;
  background: var(--background);
}
.login-card {
  width: min(100%, 360px);
  padding: 24px;
  background: var(--panel-surface);
  border: 0;
  border-radius: var(--radius-dialog);
  box-shadow: var(--shadow);
}
.login-brand {
  margin-bottom: 16px;
  justify-content: center;
}
.login-brand .brand-mark {
  width: var(--size-control);
  height: var(--size-control);
  border-radius: var(--radius);
  font-size: var(--type-title);
}
.login-card h1 {
  font-size: var(--type-title);
  font-weight: 600;
  letter-spacing: normal;
  line-height: 1.3;
  text-align: center;
  margin: 0 0 16px;
}
.login-button {
  width: 100%;
}
.login-state {
  color: var(--muted);
  font-size: var(--type-small);
  text-align: center;
  margin: 8px 0;
}
/* The same card for loading, signing in by itself and the button: the action
   keeps its height, so nothing jumps when the answer arrives. */
.login-action {
  min-height: calc(var(--size-control) + 20px);
}
.login-busy {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 0;
  min-height: var(--size-control);
}
.login-cancel {
  display: block;
  margin: 2px auto 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--link);
  font: inherit;
  font-size: var(--type-small);
  text-decoration: underline;
  cursor: pointer;
}
.login-cancel:focus-visible {
  outline: var(--focus-ring);
  outline-offset: 2px;
}
.login-spinner {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border: 2px solid var(--control-line);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: login-spin 0.9s linear infinite;
}
@keyframes login-spin {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .login-spinner {
    animation: none;
    border-top-color: var(--control-line);
    border-right-color: var(--primary);
  }
}
.login-setup {
  margin-top: 16px;
  font-size: var(--type-small);
  color: var(--muted);
}
.login-setup summary {
  cursor: pointer;
  color: var(--link);
}
.login-notice {
  background: var(--warning-bg);
  color: var(--warning-fg);
  font-size: var(--type-base);
  padding: 12px;
  border-radius: var(--radius);
  margin-top: 12px;
}
.login-notice[hidden] {
  display: none;
}
.login-notice .text-link {
  display: block;
  margin-top: 8px;
}
/* The page button: a quiet button in the bar's path (its hover is the icon buttons'). */
.explorer-toggle {
  display: flex;
  align-items: center;
  gap: var(--space-2xs);
  min-width: 0;
  max-width: min(48vw, 520px);
  min-height: var(--size-control);
  padding: 0 var(--space-xs);
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  font-size: var(--type-base);
  white-space: nowrap;
}
.explorer-toggle:is(:active, [aria-expanded="true"]) {
  background: var(--current);
}
.explorer.dropdown-panel {
  padding: var(--panel-padding-roomy);
  /* One box for Pages, Media and Files (media audit C1): Media's width, from under the top
     bar to 16px above the window's bottom, so switching tabs never resizes it. */
  width: min(1040px, calc(100vw - 32px));
  inset-block-end: 16px;
  block-size: auto;
  max-height: none;
  flex-direction: column;
  overflow: clip;
}
.explorer.dropdown-panel:popover-open {
  display: flex;
}
/* A Files row dragged out of the explorer: the box steps aside (faded, and the pointer passes
   through it) so the code under it takes the drop; it comes back on drop or cancel. */
.explorer.is-stepping-aside {
  pointer-events: none;
  opacity: 0.15;
}
@media (prefers-reduced-motion: no-preference) {
  .explorer.dropdown-panel { transition: opacity 150ms ease-out; }
}
/* The shown tab fills the box; its own list scrolls inside. */
.explorer-panel:not([hidden]) {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.explorer #files {
  flex: 1;
  max-height: none;
  min-height: 80px;
  overflow: auto;
}
@media (max-width: 650px) {
  .login-card {
    padding: 20px;
  }
}

/* Keep announcements available without a visible status footer. */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

#repository-menu {
  display: flex;
  align-items: center;
  gap: var(--space-3xs);
  min-width: 0;
}

#current-page {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}


.explorer-head { display: flex; align-items: stretch; gap: 4px; margin-block-end: 4px; border-block-end: 1px solid var(--control-line); }
.explorer-head:has(> .explorer-tabs[hidden]) { display: none; }
.explorer .explorer-settings { flex: none; inline-size: 44px; block-size: 44px; align-self: center; }

/* App palette. Imported after the shared, frozen prototype stylesheet.
   Change this primary to recolor the editor, including Monaco.
   The connected website keeps its own framework and colors.
   Light and dark: each themed colour is written once as
   light-dark(<light>, <dark>), so it follows the color-scheme of the element
   that uses it. A part set to `color-scheme: dark` inside a light page shows
   the dark palette (docs/editor-colors.md). */
/* ---- generated by scripts/tokens-from-framework.mjs from src/tokens/framework-editor.css (content hash 44bc2e05) in pixels.
   Do not edit by hand: change the settings, run `export` then `build` (docs/editor-colors.md). ---- */
:root {
  --radius-full: 999px;
  --space-4xs: 2px;
  --space-3xs: 4px;
  --space-2xs: 6px;
  --space-xs: 8px;
  --space-s: 12px;
  --space-m: 16px;
  --space-l: 24px;
}
/* ---- end generated ---- */

:root {

     The default base reproduces the supplied light/dark palette. */
  --color-primary-lightest: oklch(from var(--color-primary) 98.9% calc(c * 0.01395349) calc(h + 12.9));
  --color-primary-lighter: oklch(from var(--color-primary) 95.4% calc(c * 0.08837209) calc(h + 12.6));
  --color-primary-light: oklch(from var(--color-primary) 88.3% calc(c * 0.22325581) calc(h + 11.8));
  --color-primary-dark: oklch(from var(--color-primary) 40.4% calc(c * 0.73488372) h);
  --color-primary-darker: oklch(from var(--color-primary) 27.3% calc(c * 0.49767442) h);
  --color-primary-darkest: oklch(from var(--color-primary) 15.3% calc(c * 0.27906977) h);

  --semantic-primary: var(--color-primary);
  /* Bound action lightness/chroma so a bright brand still has legible buttons. */
  --semantic-action: oklch(from var(--semantic-primary) min(l, 0.5) min(c, 0.18) h);
  --semantic-action-hover: oklch(from var(--semantic-action) calc(l * 0.85) c h);
  --semantic-on-action: var(--color-primary-lightest);
  --semantic-surface: light-dark(var(--color-primary-lightest), oklch(from var(--color-primary-darkest) 22% min(c, 0.02) h));
  --semantic-background: light-dark(oklch(from var(--color-primary-lighter) 97% c h), var(--color-primary-darkest));
  --semantic-surface-subtle: light-dark(var(--color-primary-lighter), oklch(from var(--color-primary-darkest) 18% min(c, 0.02) h));
  --semantic-surface-raised: light-dark(var(--color-primary-light), oklch(from var(--color-primary-darker) 32% min(c, 0.035) h));
  --semantic-surface-input: light-dark(var(--color-primary-lightest), oklch(from var(--color-primary-darkest) 20% min(c, 0.02) h));
  --semantic-surface-toolbar: light-dark(oklch(from var(--color-primary-lighter) 92% c h), oklch(from var(--color-primary-darker) l min(c, 0.025) h));
  --semantic-selected: light-dark(var(--color-primary-light), oklch(from var(--color-primary-darker) 35% min(c, 0.05) h));
  --semantic-text: light-dark(var(--color-primary-darkest), var(--color-primary-lighter));
  --semantic-text-muted: light-dark(oklch(from var(--color-primary-dark) l min(c, 0.045) h), oklch(from var(--color-primary-light) 80% min(c, 0.035) h));
  /* Dark: a clear blue, not near-white text, 4.5:1 or more on the panel and its cards. */
  --semantic-link: light-dark(var(--color-primary-dark), oklch(from var(--color-primary) 80% min(c, 0.12) h));
  --semantic-border: light-dark(var(--color-primary-light), oklch(from var(--color-primary-darker) 36% min(c, 0.04) h));
  --semantic-focus: light-dark(var(--semantic-action), var(--color-primary-light));
  --semantic-preview-focus: var(--semantic-action);
  --semantic-shadow: light-dark(oklch(from var(--color-primary-darkest) l c h / 0.18), oklch(from var(--color-primary-darkest) 5% c h / 0.35));

  /* Status hues retain their meaning when the brand changes. */
  --color-warning: oklch(75% 0.14 75);
  --color-success: oklch(60% 0.13 145);
  --semantic-warning-surface: light-dark(oklch(from var(--color-warning) 96% 0.03 h), oklch(from var(--color-warning) 28% 0.03 h));
  --semantic-warning-text: light-dark(oklch(from var(--color-warning) 38% 0.07 h), oklch(from var(--color-warning) 87% 0.08 h));
  --semantic-success-surface: light-dark(oklch(from var(--color-success) 96% 0.03 h), oklch(from var(--color-success) 28% 0.03 h));
  --semantic-success-text: light-dark(oklch(from var(--color-success) 38% 0.07 h), oklch(from var(--color-success) 87% 0.08 h));

  /* Components (instances, chips, structure icons) share one violet accent,
     like Figma's and Framer's, apart from the brand blue of selection. */
  --color-component: oklch(55% 0.2 300);
  --component: light-dark(var(--color-component), oklch(from var(--color-component) 72% 0.16 h));
  --component-surface: light-dark(oklch(from var(--color-component) 96% 0.03 h), oklch(from var(--color-component) 28% 0.05 h));
  --component-text: light-dark(oklch(from var(--color-component) 42% 0.17 h), oklch(from var(--color-component) 85% 0.1 h));

  /* An agent working on a section (ticket 33): its outline, name chip and Page Structure dot,
     in the colour of the connected MCP dot (agent-menu.css). */
  --agent-presence: var(--color-success);
  /* Several agents at once (ticket am-11): each its own colour, the next of these in order of arrival
     (src/agent-presence.ts AGENT_COLOURS); orange stays a question's, blue Lex's own selection. */
  --agent-presence-2: var(--color-component);
  --agent-presence-3: var(--file-video);
  --agent-presence-4: var(--file-data);
  /* A pin an agent works on (ticket am-13): light like every pin, a tint of the agent's colour with a dark
     ink of its hue, 4.5:1 and more for small text in all four. */
  --agent-presence-pin: oklch(from var(--agent-presence) 94% calc(c * 0.3) h);
  --agent-presence-ink: oklch(from var(--agent-presence) 40% calc(c * 0.75) h);
  --agent-presence-2-pin: oklch(from var(--agent-presence-2) 94% calc(c * 0.3) h);
  --agent-presence-2-ink: oklch(from var(--agent-presence-2) 40% calc(c * 0.75) h);
  --agent-presence-3-pin: oklch(from var(--agent-presence-3) 94% calc(c * 0.3) h);
  --agent-presence-3-ink: oklch(from var(--agent-presence-3) 40% calc(c * 0.75) h);
  --agent-presence-4-pin: oklch(from var(--agent-presence-4) 94% calc(c * 0.3) h);
  --agent-presence-4-ink: oklch(from var(--agent-presence-4) 40% calc(c * 0.75) h);
  /* A synced session's guests (slice 30): four hues apart from the agents' and Lex's blue, the first the mock-up's
     guest orange; chips light in both themes with a dark ink of their hue, as the agents' pins (4.5:1 and more). */
  --guest-1: oklch(64% 0.16 60);
  --guest-2: oklch(60% 0.12 200);
  --guest-3: oklch(62% 0.17 355);
  --guest-4: oklch(64% 0.13 115);
  --guest-1-pin: oklch(from var(--guest-1) 94% calc(c * 0.3) h);
  --guest-1-ink: oklch(from var(--guest-1) 40% calc(c * 0.75) h);
  --guest-2-pin: oklch(from var(--guest-2) 94% calc(c * 0.3) h);
  --guest-2-ink: oklch(from var(--guest-2) 40% calc(c * 0.75) h);
  --guest-3-pin: oklch(from var(--guest-3) 94% calc(c * 0.3) h);
  --guest-3-ink: oklch(from var(--guest-3) 40% calc(c * 0.75) h);
  --guest-4-pin: oklch(from var(--guest-4) 94% calc(c * 0.3) h);
  --guest-4-ink: oklch(from var(--guest-4) 40% calc(c * 0.75) h);

  /* Request pins and cards (agent-pins.css, agent-menu.css, repository-menu.css). */
  /* A question for the user: orange, on pins light in both themes. */
  --agent-question-strong: oklch(66% 0.18 48);
  --agent-question-pin: oklch(94.5% 0.05 62);
  --agent-question-ink: oklch(46% 0.14 45);
  /* Finished: a neutral grey with a trace of the editor's hue. */
  --agent-done-pin: oklch(from var(--color-primary) 90.5% 0.006 h);
  --agent-done-line: oklch(from var(--color-primary) 70% 0.012 h);
  --agent-done-ink: oklch(from var(--color-primary) 36% 0.015 h);
  /* A request's first line, on the always-light pin. */
  --agent-pin-text: oklch(from var(--color-primary) 25% 0.01 h);
  /* The card's: theme-aware. */
  --agent-question-surface: light-dark(oklch(96% 0.04 62), oklch(31% 0.06 50));
  --agent-question-text: light-dark(oklch(42% 0.13 45), oklch(88% 0.08 62));
  --agent-done-surface: light-dark(oklch(from var(--color-primary) 92.5% 0.005 h), oklch(from var(--color-primary) 29% 0.006 h));
  --agent-done-bubble: light-dark(oklch(from var(--color-primary) 84% 0.008 h), oklch(from var(--color-primary) 40% 0.01 h));
  --agent-done-bubble-ink: light-dark(oklch(from var(--color-primary) 27% 0.015 h), oklch(from var(--color-primary) 92% 0.008 h));

  /* Fixed colours over pictures and saturated badges, identical in both themes. */
  --on-media: oklch(100% 0 none);
  --on-accent: var(--on-media);
  --preview-paper: var(--on-media);
  --media-paper: oklch(97% 0 none);
  --media-control-ink: oklch(20% 0.03 262);
  /* Exact sRGB(10 18 32) and sRGB(1 9 37); the latter differs from primary-darkest. */
  --media-scrim: oklch(18.23% 0.0315 261.1);
  --image-control-scrim: oklch(15.28% 0.0611 262.26);
  --shadow-ink: oklch(0% 0 none);
  --media-player-surface: var(--shadow-ink);

  /* Slot chip fills, retained across themes over the editing preview. */
  --slot-surface: oklch(from var(--color-component) 47% 0.21 h);
  --items-slot-surface: oklch(50% 0.19 355);
  /* The structure editor's inner highlight and lift. The lift keeps each
     theme's own offsets (light-dark() takes colours only): the light layers
     go transparent in dark and the dark layers in light. */
  --structure-edit-highlight: light-dark(oklch(from var(--shadow-ink) l c h / 0.05), oklch(from var(--on-media) l c h / 0.06));
  --structure-edit-drop:
    0 6px 18px -8px light-dark(oklch(from var(--shadow-ink) l c h / 0.28), transparent),
    0 1px 3px light-dark(oklch(from var(--shadow-ink) l c h / 0.12), transparent),
    0 8px 24px -8px light-dark(transparent, oklch(from var(--shadow-ink) l c h / 0.6)),
    0 2px 6px light-dark(transparent, oklch(from var(--shadow-ink) l c h / 0.35));

  /* File type accents mix with theme-aware text in files-tree.css. */
  --file-page: oklch(66% 0.17 45);
  --file-style: oklch(62% 0.15 255);
  --file-script: oklch(74% 0.15 95);
  --file-data: oklch(64% 0.11 190);
  --file-picture: oklch(64% 0.15 150);
  --file-video: oklch(62% 0.17 340);
  --file-sound: oklch(62% 0.15 300);
  --file-pdf: oklch(60% 0.18 25);
  --file-document: oklch(60% 0.14 255);

  /* Compatibility aliases keep all component styling on one palette. */
  --surface: var(--semantic-surface);
  --background: var(--semantic-background);
  --surface-subtle: var(--semantic-surface-subtle);
  --surface-raised: var(--semantic-surface-raised);
  --surface-input: var(--semantic-surface-input);
  --surface-toolbar: var(--semantic-surface-toolbar);
  --selected: var(--semantic-selected);
  --text: var(--semantic-text);
  --line: var(--semantic-border);
  --muted: var(--semantic-text-muted);
  --primary: var(--semantic-action);
  --primary-hover: var(--semantic-action-hover);
  --on-primary: var(--semantic-on-action);
  --focus: var(--semantic-focus);
  --preview-focus: var(--semantic-preview-focus);
  --warning-bg: var(--semantic-warning-surface);
  --warning-fg: var(--semantic-warning-text);
  --success-bg: var(--semantic-success-surface);
  --success-fg: var(--semantic-success-text);
  --shadow: 0 12px 32px var(--semantic-shadow);
  /* A large sheet that sits flat on dark surfaces (the media library and the Files adding summary). */
  --shadow-light-only: 0 12px 32px light-dark(var(--semantic-shadow), transparent);
  /* A pin, a note or a round button over the preview. */
  --shadow-small: 0 2px 6px var(--semantic-shadow);
  --link: var(--semantic-link);
  --danger-bg: oklch(from var(--success-bg) l c 25);
  --danger-fg: oklch(from var(--success-fg) l c 25);
  --danger: oklch(from var(--color-success) l c 25);

  /* One look for every row, list and button in the chrome: a grey hover;
     what is open, current or chosen in a list in a subtle tint of the
     action colour (and 600 weight); a pressed toggle (Bold, History, an
     open address) solid. --selected stays opaque for Monaco and the code
     highlights. Keyboard focus is the hover with the ring. */
  --hover: color-mix(in oklch, var(--text) 9%, transparent);
  --current: color-mix(in oklch, var(--primary) 16%, transparent);
  /* The action colour is too dark for a pressed toggle on dark panels. */
  --pressed: light-dark(var(--primary), var(--color-primary-light));
  --on-pressed: light-dark(var(--on-primary), var(--color-primary-darkest));
  /* An input's or a bordered button's edge, visible on every surface. */
  --control-line: color-mix(in oklch, var(--text) 16%, transparent);
  --focus-ring: 2px solid var(--focus);

  /* Type. WCAG sets no minimum size (it asks for 4.5:1 contrast and text
     that zooms to 200%); words stay at 12px or more for legibility, and
     11px is only for a letter or a number in a badge. */
  --type-badge: 11px;
  /* Hints, meta, URLs, section headings. */
  --type-small: 12px;
  /* Rows, menu items, buttons, inputs. */
  --type-base: 13px;
  /* Panel and dialog titles. */
  --type-title: 15px;
  /* A page's own heading: the wizard's last page, Get started. */
  --type-heading: 20px;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* Corners: a badge, a control or row, a floating panel, a dialog. */
  --radius-small: 4px;
  --radius: 6px;
  --radius-panel: 8px;
  --radius-dialog: 12px;

  /* Heights: an icon button (WCAG 2.2's 24px target), an input or button
     inside a row, a row or a field or button in a panel. */
  --size-icon: 24px;
  --size-compact: 28px;
  --size-control: 32px;
  /* Real tap targets on touch devices and narrow editor layouts. */
  --size-touch: 44px;
  --size-tap: 0px;

  /* Floating panels: menus, flyouts, the edit bar and its popovers, the
     insert picker and a request's card. Menus keep 6px round their rows,
     panels with a title or text 12px. */
  --panel-surface: var(--surface-raised);
  /* A card, tray or bar on a panel: one step lighter than the panel in both themes. */
  --surface-card: light-dark(var(--surface), color-mix(in oklch, var(--panel-surface), white 6%));
  /* Behind a see-through picture, in both themes (dark surfaces would hide dark lettering):
     8 px squares, as Squarespace and Figma show transparent assets (slice 106). */
  --checkerboard: repeating-conic-gradient(oklch(97% 0 none) 0 25%, oklch(90% 0 none) 0 50%) 0 0 / 16px 16px;
  --panel-padding: 6px;
  --panel-padding-roomy: 12px;

  /* Motion. Durations from the board's Shared values proposals: a hover
     tint, a press, a tooltip, a menu or popover, a sheet, a flying element.
     Components pair them with an easing and drop the motion under
     prefers-reduced-motion. */
  --dur-hover: 120ms;
  --dur-press: 150ms;
  --dur-tooltip: 180ms;
  --dur-menu: 200ms;
  --dur-sheet: 300ms;
  --dur-fly: 600ms;
  /* --ease-out is the curve the plain ease-out keyword gives, which every
     transition uses today. */
  --ease-out: cubic-bezier(0, 0, 0.58, 1);

  /* Layers: named z-index steps, lowest to highest (a test keeps them in
     this order). Raised is local to one part; the rest order whole parts
     over the page and the preview. docs/editor-colors.md says which raw
     value moves to which step. */
  --layer-raised: 1;
  --layer-canvas: 20;
  --layer-pins: 25;
  --layer-bar: 30;
  --layer-popover: 40;
  --layer-dialog: 90;
  --layer-tooltip: 95;
  --layer-wizard: 1000;
  --layer-drag: 1050;
  --layer-celebration: 1100;
  --layer-note: 10000;

  /* Elevation: four steps of shadow, theme-aware through --semantic-shadow.
     One is the existing --shadow-small (a pin or a round button), two a
     small card, three the existing --shadow (a floating panel), four a dialog. */
  --elevation-2: 0 4px 16px var(--semantic-shadow);
  --elevation-4: 0 24px 64px var(--semantic-shadow), 0 2px 8px var(--semantic-shadow);
}

@media (hover: none), (pointer: coarse), (width <= 768px) {
  :root { --size-tap: var(--size-touch); }
}

<script type="text/plain" id="t-button">/* The Button component: its whole look in one file on the components layer, after the Techies Framework's .btn
   (docs/wayfinder/atomic-catalogue/css-layers-plan.md). The --btn-* properties are its defaults; a tone changes only
   them. A screen that needs a Button to differ sets a --btn-* property, or a rule, in its own unlayered CSS, which
   wins over this layer. Classes: `button` (the primary tone), `button primary`, `button secondary`. */
@layer tokens, elements, components;

@layer components {
  .button {
    --btn-min-block-size: var(--size-control);
    --btn-radius: var(--radius);
    --btn-padding-block: var(--space-2xs);
    --btn-padding-inline: calc(var(--space-s) + var(--space-4xs));
    --btn-background: var(--primary);
    --btn-hover-background: var(--primary-hover);
    --btn-text-color: var(--on-primary);
    --btn-font-size: var(--type-base);
    --btn-font-weight: 600;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-block-size: var(--btn-min-block-size);
    padding: var(--btn-padding-block) var(--btn-padding-inline);
    border: 0;
    border-radius: var(--btn-radius);
    background: var(--btn-background);
    color: var(--btn-text-color);
    font-size: var(--btn-font-size);
    font-weight: var(--btn-font-weight);
    text-decoration: none;

    /* Touch gets the press; hover waits for a mouse, as a touch screen keeps :hover on the last tap. */
    &:active:not(:disabled) {
      background: var(--btn-hover-background);
    }
    @media (hover: hover) and (pointer: fine) {
      &:hover:not(:disabled) {
        background: var(--btn-hover-background);
      }
    }
    /* Disabled is plain (the neutral surface, muted words), not a pale version of its tone. It has hooks of its own,
       so a screen that sets --btn-background never takes the plain look away (defaults given in place, as the
       Framework's .btn does). */
    &:disabled {
      background: var(--btn-disabled-background, var(--surface-subtle));
      color: var(--btn-disabled-text-color, var(--muted));
      cursor: default;
    }
  }

  /* The quiet tone: the surface colour, the words around it, and the hover laid over its own surface. */
  .secondary {
    --btn-background: var(--surface);
    --btn-hover-background: linear-gradient(var(--hover) 0 0), var(--surface);
    --btn-text-color: currentcolor;
  }
}

<script type="text/plain" id="t-rest">/* The Badge part (atomic catalogue ticket 13): one class, the kind and the tone as data attributes. Only shared tokens. */
.ui-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3xs);
  box-sizing: border-box;
  min-inline-size: 0;
  max-inline-size: 100%;
  block-size: 1.25rem;
  padding-inline: var(--space-xs);
  border-radius: var(--radius-full);
  font-size: var(--type-small);
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  background: var(--surface-subtle);
  color: var(--link);
}
/* Long words are cut with an ellipsis inside the badge's width, never pushed past the row it sits in. Only the
   inline axis clips: the words keep their own line height, so descenders and accents are never cut. */
.ui-badge > span {
  min-inline-size: 0;
  overflow: clip visible;
  line-height: normal;
  text-overflow: ellipsis;
}
.ui-badge[data-tone="action"] { background: var(--primary); color: var(--on-primary); }
.ui-badge[data-tone="warning"] { background: var(--warning-bg); color: var(--warning-fg); }
.ui-badge[data-tone="question"] { background: var(--agent-question-surface); color: var(--agent-question-text); }
.ui-badge[data-tone="success"] { background: var(--success-bg); color: var(--success-fg); }
.ui-badge[data-tone="danger"] { background: var(--danger-bg); color: var(--danger-fg); }

/* A number: a round chip that grows to fit two digits and 99+. */
.ui-badge[data-kind="count"] {
  min-inline-size: 1.125rem;
  block-size: 1.125rem;
  padding-inline: var(--space-3xs);
  font-size: var(--type-badge);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* A status: the tone's dot, then the words. */
.ui-badge[data-kind="status"]::before {
  content: "";
  flex: none;
  inline-size: 0.4375rem;
  block-size: 0.4375rem;
  border-radius: var(--radius-full);
  background: currentcolor;
}

/* A dot: the tone's strong colour, no words. */
.ui-badge[data-kind="dot"] {
  inline-size: 0.5rem;
  block-size: 0.5rem;
  padding: 0;
  background: var(--muted);
}
.ui-badge[data-kind="dot"][data-tone="action"] { background: var(--primary); }
.ui-badge[data-kind="dot"][data-tone="warning"] { background: var(--warning-fg); }
.ui-badge[data-kind="dot"][data-tone="question"] { background: var(--agent-question-strong); }
.ui-badge[data-kind="dot"][data-tone="success"] { background: var(--success-fg); }
.ui-badge[data-kind="dot"][data-tone="danger"] { background: var(--danger); }

/* A mark: a round tone holding an icon in the tone's text colour. */
.ui-badge[data-kind="mark"] {
  inline-size: 1.25rem;
  padding: 0;
}

/* Forced colours drop the fills: an outline keeps each badge's edge, and a dot keeps its colour. */
@media (forced-colors: active) {
  .ui-badge { border: 1px solid; }
  .ui-badge[data-kind="dot"] { forced-color-adjust: none; border: 0; }
}

/* The Keyboard key part (atomic catalogue ticket 13): a cap with no colour of its own. It borrows the text colour of
   where it stands, so it reads in a menu row (whose shortcut slot sets it to muted) and on a tooltip alike. Only shared
   tokens. */
.ui-key {
  font: inherit;
}
.ui-key:not([data-combo]),
.ui-key > kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  min-inline-size: 1.25rem;
  block-size: 1.25rem;
  padding-inline: var(--space-3xs);
  border: 1px solid color-mix(in oklch, currentcolor 28%, transparent);
  border-radius: var(--radius-small);
  background: color-mix(in oklch, currentcolor 7%, transparent);
  font: inherit;
  font-size: var(--type-small);
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}
.ui-key[data-combo] {
  display: inline-flex;
  align-items: center;
  gap: var(--space-4xs);
}
@media (forced-colors: active) {
  .ui-key:not([data-combo]),
  .ui-key > kbd { border-color: ButtonText; }
}

/* The tile and, while sharing to edit, who joined beside it. */
.repository-menu {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.repository-menu__trigger {
  anchor-name: --repository-menu;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  max-width: min(38vw, 360px);
  padding: 7px 10px 7px 8px;
  border: 0;
  border-radius: var(--radius-panel);
  background: transparent;
  font-size: var(--type-title);
  font-weight: 600;
}

.repository-menu__name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.repository-menu__identity {
  display: flex;
  flex-direction: column;
  min-width: 0;
  text-align: left;
}

.repository-menu__repository {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--type-small);
  font-weight: 400;
  color: var(--muted);
}

.repository-menu__caret {
  color: var(--muted);
}

.repository-menu__trigger:hover,
.repository-menu__trigger[aria-expanded="true"] {
  background: var(--hover);
}

/* A letter tile per repository, with a hue from its name. */
.repository-menu__initial {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: var(--radius);
  background: oklch(from var(--primary) 0.58 0.12 var(--initial-hue, h));
  color: var(--on-accent);
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
}

.repository-menu__badge {
  display: contents;
}

/* Agents' questions waiting for the user: an orange count on the tile's corner. */
.repository-menu__trigger {
  position: relative;
}
.repository-menu__questions,
.repository-menu__finished {
  position: absolute;
  inset-block-start: 3px;
  inset-inline-start: 30px;
  min-width: 18px;
  height: 18px;
  border: 2px solid var(--surface);
  border-radius: 999px;
  padding: 0 3px;
  box-sizing: border-box;
  background: var(--agent-question-strong);
  color: var(--on-accent);
  font-size: var(--type-badge);
  font-weight: 700;
  line-height: 14px;
  text-align: center;
}
.repository-menu__questions[hidden],
.repository-menu__finished[hidden] {
  display: none;
}

/* Work finished on another project or branch (src/finished-elsewhere.ts): the same count, in
   the action colour, on the menu's tile while no question waits, on a project's tile and on
   its branch's row. */
.repository-menu__finished {
  background: var(--primary);
}
/* Over the remove ×'s corner: a tap there still reaches the ×. */
.repository-menu__item .repository-menu__finished {
  z-index: 2;
  pointer-events: none;
  inset-block-start: 4px;
  inset-inline-start: 26px;
}
.repository-menu__branch-item .repository-menu__finished {
  position: static;
  flex: none;
  border-color: transparent;
}

.repository-menu__trigger .repository-menu__initial {
  width: 32px;
  height: 32px;
  font-size: 15px;
}

.repository-menu__popover {
  width: min(340px, calc(100vw - 32px));
}

.repository-menu__popover [hidden] {
  display: none;
}

.repository-menu__section {
  padding: 6px 0;
}

.repository-menu__section + .repository-menu__section,
.repository-menu__agent + .repository-menu__section {
  margin-top: 6px;
}

/* Preview link and Edit together: their own group, set apart by space and a title, not a line. */
.repository-menu__shares {
  display: grid;
  gap: 2px;
  margin-block-start: 12px;
}
.repository-menu__shares[hidden] {
  display: none;
}

.repository-menu__heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px;
  font-size: var(--type-small);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

.repository-menu__search {
  display: block;
  width: 100%;
  height: var(--size-control);
  margin: 2px 0 6px;
  padding: 0 8px;
  border: 1px solid var(--control-line);
  border-radius: var(--radius);
  background: var(--surface-input);
  color: var(--text);
  font: inherit;
  font-size: var(--type-base);
}

.repository-menu__search:focus-visible {
  outline: var(--focus-ring);
  outline-offset: -1px;
}

.repository-menu__search[hidden],
.repository-menu__empty[hidden] {
  display: none;
}

.repository-menu__repos {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: min(320px, 45dvh);
  overflow: auto;
  margin: 0;
  padding: 0;
  list-style: none;
}

.repository-menu__item {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  border-radius: var(--radius);
}

.repository-menu__item:hover,
.repository-menu__item:focus-within {
  background: var(--hover);
}

/* As in Pages and Files, the ring goes round the whole row. */
.repository-menu__item:has(> .repository-menu__repo:focus-visible) {
  outline: var(--focus-ring);
  outline-offset: -2px;
}

.repository-menu__repo:focus-visible {
  outline: none;
}

.repository-menu__remove:focus-visible,
.repository-menu__action:focus-visible,
.repository-menu__account:focus-visible,
.repository-menu__heading-button:focus-visible {
  outline: var(--focus-ring);
  outline-offset: -2px;
}

.repository-menu__item:has([aria-current="true"]) {
  background: var(--current);
}

.repository-menu__repo {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 6px 8px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.repository-menu__repo-text {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
}

.repository-menu__repo-name,
.repository-menu__repo-owner,
.repository-menu__account-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Fixed line heights keep the row 46px tall, so the remove × (below) sits
   exactly on the 28px tile. */
.repository-menu__repo-name {
  font-size: var(--type-base);
  font-weight: 600;
  line-height: 18px;
}

.repository-menu__repo-owner {
  font-size: var(--type-small);
  line-height: 16px;
  color: var(--muted);
}

.repository-menu__repo[aria-current="true"] .repository-menu__repo-name {
  color: var(--text);
}


/* Remove: a × in the tile's own colour, over the tile's letter. */
.repository-menu__remove {
  position: absolute;
  z-index: 1;
  top: 9px;
  left: 8px;
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: var(--radius);
  background: oklch(from var(--primary) 0.58 0.12 var(--initial-hue, h));
  color: var(--on-accent);
  opacity: 0;
  cursor: pointer;
}

.repository-menu__item:hover .repository-menu__remove,
.repository-menu__remove:focus-visible,
.repository-menu__remove[aria-expanded="true"] {
  opacity: 1;
}

.repository-menu__remove:hover {
  background: oklch(from var(--primary) 0.48 0.12 var(--initial-hue, h));
}

@media (hover: none) {

  }
}

.repository-menu__confirm {

  margin: 0 8px 8px;
  padding: 10px;

  background: var(--surface);
}

.repository-menu__confirm p {

  font-size: var(--type-small);
  line-height: 1.5;
  color: var(--muted);
}

.repository-menu__confirm .button {
  display: inline-flex;
  margin-right: 8px;
  text-decoration: none;
}

.repository-menu__empty {
  margin: 0;
  padding: 6px 8px;
  font-size: var(--type-small);
  line-height: 1.5;
  color: var(--muted);
}

/* The open repository's row opens its branches (flyout.ts). */
.repository-menu__more {
  flex: none;
  padding-right: 2px;
  color: var(--muted);
}

.repository-menu__repo[aria-expanded="true"] .repository-menu__more {
  color: var(--text);
}

.repository-menu__branch-name {
  flex: 1;
  min-width: 0;

  text-overflow: ellipsis;

}

.repository-menu__branch-item[aria-checked="true"] {
  background: var(--current);

}

.repository-menu__action {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: var(--size-control);
  padding: 4px 8px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: inherit;
  font-size: var(--type-base);
  text-align: left;
  text-decoration: none;
}

.repository-menu__action:hover,
.repository-menu__action:focus-visible {

}


.repository-menu__heading-button {
  display: inline-grid;
  place-items: center;
  width: var(--size-icon);
  height: var(--size-icon);
  margin: -4px -4px -4px 0;
  border: 0;
  border-radius: var(--radius);
  background: transparent;

.repository-menu__heading-button:hover,
.repository-menu__heading-button:focus-visible {

.repository-menu__add,
.repository-menu__quiet {

.repository-menu__account {

.publish-menu__separator { border: 0; border-top: 1px solid color-mix(in oklch, var(--text) 18%, transparent); margin-block: 10px; }
/* Discard changes: a destructive action, below the changes; disabled it keeps its colours, faded. */
.publish-menu__panel > .publish-menu__discard, .publish-menu__panel > .publish-menu__discard:disabled { width: 100%; justify-content: start; color: var(--danger-fg); background: var(--danger-bg); }
.publish-menu__panel > .publish-menu__discard:hover:enabled { background: var(--danger-bg); outline: 1px solid var(--danger); }
.publish-menu__panel { width: min(380px, calc(100vw - 32px)); padding: var(--panel-padding-roomy); }
.publish-menu__files { display: flex; flex-direction: column; gap: 10px; margin-block: 10px 0; max-height: 40dvh; overflow: auto; }
.publish-menu__file { display: flex; gap: 10px; align-items: start; font-size: var(--type-base); overflow-wrap: anywhere; }
.publish-menu__file input { accent-color: var(--primary); }
.publish-menu__changes { margin: -6px 0 2px 24px; }
.publish-menu__show-changes { min-height: var(--size-icon); padding: 0 6px; margin-left: -6px; border: 0; border-radius: var(--radius); background: none; color: var(--link); font: inherit; font-size: var(--type-small); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.publish-menu__show-changes:hover { background: var(--hover); }
.publish-menu__show-changes:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
.publish-menu__message { margin-bottom: 0; font-size: var(--type-small); line-height: 1.6; }
.publish-menu__message:empty { display: none; }
@supports (position-area: bottom) { .publish-menu__panel { position-area: bottom span-left; justify-self: end; } }
.code-editor__conflict { padding: 10px 20px; background: var(--warning-bg); color: var(--warning-fg); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: var(--type-base); }
.code-editor__conflict[hidden] { display: none; }

/* Comparison dialog. Removed lines take the danger tokens (the success
   ones turned to red), so they follow the scheme like the added ones. */
.publish-diff {
  --diff-add-bg: var(--success-bg);
  --diff-add-fg: var(--success-fg);
  --diff-del-bg: var(--danger-bg);
  --diff-del-fg: var(--danger-fg);
  width: min(1200px, calc(100vw - 32px));
  max-height: calc(100dvh - 32px);
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-dialog);
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
}
.publish-diff[open] { display: flex; flex-direction: column; }
.publish-diff::backdrop { background: oklch(from var(--semantic-shadow) l c h / 0.45); }
.publish-diff__header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-toolbar); }
.publish-diff__title { margin: 0; font-size: var(--type-title); font-weight: 600; overflow-wrap: anywhere; }
.publish-diff__body { overflow: auto; min-height: 0; flex: 1; font-family: var(--font-mono); font-size: var(--type-small); line-height: 1.5; }
.publish-diff__split { width: 100%; border-collapse: collapse; table-layout: fixed; }
.publish-diff__split th { position: sticky; top: 0; z-index: 1; padding: 6px 10px; text-align: left; font: 600 var(--type-small)/1.4 system-ui, sans-serif; background: var(--surface-subtle); border-bottom: 1px solid var(--line); }
.publish-diff__split th + th { border-left: 1px solid var(--line); }
.publish-diff__col-num { width: 6ch; }
.publish-diff__num { padding: 0 8px; text-align: right; vertical-align: top; color: var(--muted); user-select: none; }
.publish-diff__code { padding: 0 10px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; vertical-align: top; }
.publish-diff__code + .publish-diff__num { border-left: 1px solid var(--line); }
.publish-diff__code.is-del { background: var(--diff-del-bg); color: var(--diff-del-fg); }
.publish-diff__code.is-add { background: var(--diff-add-bg); color: var(--diff-add-fg); }
.publish-diff__code.is-empty { background: var(--surface-subtle); }
.publish-diff__sign { display: inline-block; width: 1.5ch; user-select: none; }
.publish-diff__gap { padding: 4px 10px; text-align: center; color: var(--muted); background: var(--surface-subtle); font-family: system-ui, sans-serif; }
.publish-diff__unified { display: none; margin: 0; padding: 6px 0; white-space: pre; width: max-content; min-width: 100%; box-sizing: border-box; }
.publish-menu__diff-line { display: block; padding-inline: 8px; }
.publish-menu__diff-line.is-add { background: var(--diff-add-bg); color: var(--diff-add-fg); }
.publish-menu__diff-line.is-del { background: var(--diff-del-bg); color: var(--diff-del-fg); }
.publish-menu__diff-number { display: inline-block; width: 4ch; text-align: right; color: var(--muted); margin-right: 6px; }
.publish-menu__diff-sign { display: inline-block; width: 1.5ch; }
.publish-menu__diff-gap { display: block; padding-inline: 8px; color: var(--muted); }
/* Too narrow for two columns: the changed lines in one column. */
@media (max-width: 699px) {
  .publish-diff__split { display: none; }
  .publish-diff__unified { display: block; }
}
/* A change's kind, as in git: A added, M modified, R renamed, D deleted. */
.publish-menu__status { flex-shrink: 0; min-width: 16px; padding: 0 4px; border-radius: var(--radius-small); font: 600 var(--type-badge)/16px var(--font-mono); text-align: center; }
.publish-menu__status.is-A, .publish-menu__status.is-R { background: var(--success-bg); color: var(--success-fg); }
.publish-menu__status.is-M { background: var(--current); color: var(--link); }
.publish-menu__status.is-D { background: var(--warning-bg); color: var(--warning-fg); }
.publish-menu__changes { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.publish-menu__note { font-size: var(--type-small); color: var(--muted); }
.publish-menu:has(.publish-menu__trigger[data-state="live"]) > .button { background: var(--color-success); opacity: 1; }
.publish-menu:has(.publish-menu__trigger[data-state="failed"]) > .button { background: var(--danger); opacity: 1; }
/* The grand total, unfolding to the changes, each with its counts. */
.publish-menu__total { font-size: var(--type-base); }
.publish-menu__total-summary { font-weight: 600; cursor: pointer; }
.publish-menu__total-summary:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }

.workspace--code #main {
  min-width: 0;
}
.workspace--code .workspace-content {
  max-height: none;
  min-height: 0;
  overflow: hidden;
}
.code-editor {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface);
}
.code-editor__toolbar {
  background: var(--surface-toolbar);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  padding: 9px 20px;
}
.code-editor__history[aria-pressed="true"] {
  background: var(--pressed);
  color: var(--on-pressed);
}
.code-editor__notice {
  padding: 10px 20px;
  font-size: var(--type-small);
  color: var(--muted);
}
.code-editor__notice[hidden] { display: none; }
.code-editor__body {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}
.code-editor__canvas {
  flex: 1;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.code-editor__match {
  background: var(--selected);
}
.code-editor__match--overridden {
  background: color-mix(in oklch, var(--selected) 45%, transparent);
}
.code-editor__overridden {
  text-decoration: line-through;
  text-decoration-color: var(--muted);
  opacity: 0.6;
}
.code-editor__element {
  background: var(--selected);
  outline: 1px solid var(--focus);
}
.code-editor__element-line {
  border-left: 3px solid var(--focus);
  margin-left: 3px;
}
.code-editor__diff-labels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 8px 20px;
  font-size: var(--type-small);
}
@media (max-width: 650px) {
  .code-editor__toolbar {
    gap: 8px;
    padding: 8px 12px;
  }
}
/* In the top bar (after the phone rule, so it holds there too). */
.code-editor__toolbar--hosted {
  background: transparent;
  padding: 0;
  gap: 10px;
}

/* The slim top bar's phone half (top-bar-phone.ts, loaded with it on the first phone-wide window). Spacing,
   corners, shadows and timings are tokens; the sheet's curve is the iOS sheet curve phone-sheet.css uses. */

/* The page button names the project over the page; a window widened past a phone shows the page alone again. */
.explorer-toggle__words {
  display: grid;
  min-width: 0;
  line-height: 1.2;
  text-align: start;
}
.explorer-toggle__site {
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--muted);
  font-size: var(--type-badge);
}
.explorer-toggle__words > #current-page {
  font-weight: 600;
}
@media (min-width: 651px) {
  #topbar-menu,
  .explorer-toggle__tile,
  .explorer-toggle__site {
    display: none;
  }
  .explorer-toggle__words {
    display: contents;
  }
}

/* The project menu and History, opened from the Menu while their buttons are off the bar: bottom sheets.
   History's script places its panel under its button (history-controller.ts), hence the overrides. */
@media (max-width: 650px) {
  #repository-actions,
  #changes,
  #setup-checklist-panel {
    position-area: none;
    inset: auto 0 0 !important;
    justify-self: stretch;
    width: auto;
    max-height: 82dvh !important;
    margin: 0;
    border-end-start-radius: 0;
    border-end-end-radius: 0;
  }
}

/* The Menu: a bottom sheet over a dimmed page, rows a finger can hit, the grabber on top closes it. */
.top-bar-menu {
  position: fixed;
  inset: auto 0 0;
  inline-size: auto;
  max-inline-size: none;
  max-block-size: 82dvh;
  margin: 0;
  padding: 0 var(--space-xs) calc(var(--space-m) + env(safe-area-inset-bottom));
  border: 0;
  border-start-start-radius: var(--radius-dialog);
  border-start-end-radius: var(--radius-dialog);
  background: var(--panel-surface);
  color: var(--text);
  box-shadow: var(--elevation-4);
  overflow: auto;
  overscroll-behavior: contain;
  font-size: var(--type-base);
}
.top-bar-menu[open] {
  display: grid;
  align-content: start;
}
.top-bar-menu::backdrop {
  background: oklch(from var(--semantic-shadow) l c h / 0.45);
}
@media (prefers-reduced-motion: no-preference) {
  .top-bar-menu::backdrop {
    transition: opacity var(--dur-sheet) var(--ease-out), display var(--dur-sheet) allow-discrete, overlay var(--dur-sheet) allow-discrete;
  }
  @starting-style {
    .top-bar-menu[open]::backdrop {
      opacity: 0;
    }
  }
}
@media (prefers-reduced-motion: no-preference) {
  .top-bar-menu {
    transition: translate var(--dur-sheet) cubic-bezier(0.32, 0.72, 0, 1), display var(--dur-sheet) allow-discrete, overlay var(--dur-sheet) allow-discrete;
  }
  .top-bar-menu:not([open]) {
    translate: 0 100%;
  }
  @starting-style {
    .top-bar-menu[open] {
      translate: 0 100%;
    }
  }
}

.top-bar-menu__grab {
  display: grid;
  place-items: center;
  block-size: var(--size-touch);
  border: 0;
  background: transparent;
  cursor: pointer;
}
.top-bar-menu__grabber {
  inline-size: 36px;
  block-size: 4px;
  border-radius: var(--radius-full);
  background: var(--control-line);
}
.top-bar-menu__title {
  display: flex;
  align-items: center;
  gap: var(--space-3xs);
  min-block-size: var(--size-control);
  padding-inline: var(--space-xs);
  font-size: var(--type-title);
  font-weight: 600;
}
.top-bar-menu__title:has(.top-bar-menu__back) {
  padding-inline-start: 0;
}
.top-bar-menu__back {
  inline-size: var(--size-touch);
  block-size: var(--size-touch);
}
.top-bar-menu__page {
  min-inline-size: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: var(--type-base);
  font-weight: 400;
}

.top-bar-menu__rows {
  display: grid;
  gap: var(--space-4xs);
}
.top-bar-menu__row {
  display: flex;
  align-items: center;
  gap: var(--space-s);
  inline-size: 100%;
  min-block-size: var(--size-touch);
  padding: var(--space-3xs) var(--space-xs) var(--space-3xs) var(--space-s);
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: start;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.top-bar-menu__row > svg {
  color: var(--muted);
}
.top-bar-menu__row--static {
  cursor: default;
}
button.top-bar-menu__row:active {
  background: var(--hover);
}
@media (hover: hover) and (pointer: fine) {
  button.top-bar-menu__row:hover {
    background: var(--hover);
  }
}
.top-bar-menu__label {
  flex: 1;
  min-inline-size: 0;
}
.top-bar-menu__end {
  display: flex;
  align-items: center;
  gap: var(--space-3xs);
  min-inline-size: 0;
  max-inline-size: 45%;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.top-bar-menu__separator {
  margin: var(--space-3xs) var(--space-s);
  border: 0;
  border-block-start: 1px solid var(--line);
}

/* Screen size: the canvas's three breakpoints as one segmented control. */
.top-bar-menu__segments {
  display: inline-flex;
  padding: var(--space-4xs);
  border-radius: var(--radius);
  background: var(--surface-subtle);
}
.top-bar-menu__segment {
  display: grid;
  place-items: center;
  inline-size: var(--size-touch);
  block-size: var(--size-touch);
  padding: 0;
  border: 0;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.top-bar-menu__segment:active {
  background: var(--hover);
}
.top-bar-menu__segment[aria-pressed="true"] {
  background: var(--current);
  color: var(--text);
}

/* Add a block: the block rail's blocks as tiles. */
.top-bar-menu__blocks {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-xs);
  padding-block: var(--space-3xs) var(--space-xs);
}
.top-bar-menu__block {
  display: grid;
  justify-items: center;
  gap: var(--space-2xs);
  padding: var(--space-s) var(--space-xs);
  border: 0;
  border-radius: var(--radius-panel);
  background: var(--surface-subtle);
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
.top-bar-menu__block:active {
  background: var(--hover);
}
.top-bar-menu :is(button):focus-visible {
  outline: var(--focus-ring);
  outline-offset: -2px;
}

/* The canvas bar over the preview and the stage the frame stands on
   (canvas-bar.ts). One look with the code panes' title bars. */
.canvas-bar {
  display: flex;
  flex: none;
  align-items: center;
  gap: 12px;
  min-height: 36px;
  padding: 4px 8px 4px 10px;
  border-bottom: 1px solid var(--control-line);
  background: var(--surface-toolbar);
  color: var(--text);
  font-size: var(--type-small);
}
.canvas-bar[hidden] {
  display: none;
}

/* While a component's template is open: the bar wears the component accent,
   the crumbs up to the instance, then the component, Used on and Done (a
   check) in one run; the device tools keep the far end. */
.canvas-bar--component {
  border-bottom-color: color-mix(in oklch, var(--component) 35%, transparent);
  background: var(--component-surface);
}
.canvas-bar--component .canvas-devices {
  background: color-mix(in oklch, var(--component) 12%, transparent);
}
.canvas-bar--component :is(.canvas-device, .canvas-crumb):hover {
  background: color-mix(in oklch, var(--component) 14%, transparent);
}
.canvas-component,
.canvas-component-end {
  display: flex;
  flex: none;
  align-items: center;
  gap: 8px;
  min-width: 0;
  color: var(--component-text);
}
.canvas-component[hidden],
.canvas-component-end[hidden] {
  display: none;
}
.canvas-bar--component .canvas-crumbs {
  flex: 0 1 auto;
}
.canvas-bar--component .canvas-tools {
  margin-left: auto;
}
.canvas-component {
  flex-shrink: 1;
}
/* The edited instance's crumb: the component mark, "Editing" and its tag. */
.canvas-crumb--editing {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--component-text);
  font-family: inherit;
  font-weight: 500;
}
.canvas-crumb--editing > .icon {
  flex: none;
  margin: 0 1px 0 0;
}
.canvas-crumb__tag {
  font: 600 var(--type-small) / 1 var(--font-mono);
}
.canvas-component__used {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: 4px;
  height: var(--size-icon);
  padding: 0 6px 0 8px;
  border: 1px solid color-mix(in oklch, var(--component) 40%, transparent);
  border-radius: 999px;
  background: transparent;
  color: var(--component-text);
  font: inherit;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color 120ms ease-out;
}
.canvas-component__used:hover,
.canvas-component__used[aria-expanded="true"] {
  background: color-mix(in oklch, var(--component) 14%, transparent);
}
.canvas-component__used:focus-visible {
  outline: var(--focus-ring);
  outline-offset: 1px;
}
.canvas-component__used:disabled {
  opacity: 0.6;
  cursor: default;
}
.canvas-component__used .icon {
  margin: 0;
  transition: transform 120ms ease-out;
}
.canvas-component__used[aria-expanded="true"] .icon {
  transform: rotate(180deg);
}
.canvas-component__done {
  display: inline-flex;
  align-items: center;
  height: var(--size-icon);
  padding: 0 6px;
  border: 0;
  border-radius: var(--radius);
  background: var(--component);
  color: var(--surface);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 120ms ease-out;
}
.canvas-component__done .icon {
  flex: none;
  margin: 0;
}
.canvas-component__done-label {
  max-width: 0;
  overflow: hidden;
  opacity: 0;
  white-space: nowrap;
  transition: max-width 160ms ease-out, margin 160ms ease-out, opacity 120ms ease-out;
}
.canvas-component__done:is(:hover, :focus-visible) {
  background: color-mix(in oklch, var(--component) 86%, var(--text));
}
.canvas-component__done:is(:hover, :focus-visible) .canvas-component__done-label {
  max-width: 48px;
  margin: 0 2px 0 5px;
  opacity: 1;
}
.canvas-component__done:focus-visible {
  outline: var(--focus-ring);
  outline-offset: 2px;
}

/* Breadcrumb: body › main › section.hero › h1, the selection last. */
.canvas-crumbs {
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.canvas-crumbs::-webkit-scrollbar {
  display: none;
}
.canvas-crumbs.is-clipped {
  mask-image: linear-gradient(to right, transparent 0, #000 32px);
}
.canvas-crumbs__list {
  display: flex;
  align-items: center;
  margin: 0;
  padding: 0;
  list-style: none;
  white-space: nowrap;
}
.canvas-crumbs__item {
  display: flex;
  flex: none;
  align-items: center;
}
.canvas-crumbs__separator {
  padding: 0 2px;
  color: var(--muted);
  opacity: 0.7;
}
.canvas-crumb {
  height: var(--size-icon);
  padding: 0 6px;
  border: 0;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--muted);
  font: var(--type-small) / 1 var(--font-mono);
  cursor: pointer;
}
.canvas-crumb:hover {
  background: var(--hover);
  color: var(--text);
}
.canvas-crumb:focus-visible {
  outline: var(--focus-ring);
  outline-offset: -2px;
}
.canvas-crumb[aria-current="true"] {
  background: var(--current);
  color: var(--text);
  font-weight: 600;
}
.canvas-crumb--component,
.canvas-crumb--template {
  color: var(--component-text);
}
.canvas-crumb--component {
  font-weight: 600;
}
:is(.canvas-crumb--component, .canvas-crumb--template)[aria-current="true"] {
  background: color-mix(in oklch, var(--component) 18%, transparent);
  color: var(--component-text);
}

/* Breakpoints and width. */
.canvas-tools {
  display: flex;
  flex: none;
  align-items: center;
  gap: 6px;
}
.canvas-devices {
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: var(--radius);
  background: var(--hover);
}
.canvas-device {
  display: grid;
  place-items: center;
  width: 28px;
  height: var(--size-icon);
  min-inline-size: var(--size-tap);
  min-block-size: var(--size-tap);
  padding: 0;
  border: 0;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background-color 120ms ease-out, color 120ms ease-out;
}
.canvas-device:active {
  background: var(--hover);
  color: var(--text);
}
@media (hover: hover) and (pointer: fine) {
  .canvas-device:hover {
    background: var(--hover);
    color: var(--text);
  }
}
.canvas-device:focus-visible {
  outline: var(--focus-ring);
  outline-offset: 0;
}
.canvas-devices .canvas-device[aria-pressed="true"] {
  background: var(--panel-surface);
  box-shadow: var(--shadow-small);
  color: var(--text);
}
.canvas-width {
  position: relative;
  display: flex;
  align-items: center;
}
.canvas-width__input {
  width: 64px;
  height: var(--size-icon);
  padding: 0 24px 0 6px;
  border: 1px solid var(--control-line);
  border-radius: var(--radius);
  background: var(--surface-input);
  color: var(--text);
  font: var(--type-small) / 1 var(--font-mono);

  text-align: right;
}
.canvas-width__input:focus {

  outline: 1px solid var(--focus);
}
.canvas-width__unit {
  position: absolute;
  right: 6px;
  color: var(--muted);
  font: var(--type-small) / 1 var(--font-mono);
  pointer-events: none;
}

/* The canvas: Desktop fills it; a framed width stands centred on a dotted
   ground, a handle on each side. */
.canvas-host {
  --canvas-gutter: 28px;
  position: relative;
  justify-content: center;

.canvas-host.is-framed .native-preview-frame {

.canvas-handle {

  bottom: 0;

  width: 18px;
  cursor: ew-resize;
  touch-action: none;
}

  display: block;
}
.canvas-handle--left {
  left: -20px;
}
.canvas-handle--right {
  right: -20px;
}
.canvas-handle:focus-visible {
  outline: none;
}
.canvas-handle__grip {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 4px;
  height: 40px;
  border-radius: 999px;
  background: var(--muted);

  height: 56px;
  background: var(--primary);
  opacity: 1;
}
.canvas-handle:focus-visible .canvas-handle__grip {

  outline-offset: 2px;
}
.canvas-size {
  position: absolute;
  top: 8px;
  left: 50%;
  z-index: 1;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--pressed);
  color: var(--on-pressed);
  font: 600 var(--type-small) / 16px var(--font-mono);

}

/* The page structure tree in the sidebar: one row per page element,
   indented by depth, the preview's selection marked. A folded drop container
   turns its caret during the hold before opening, unless motion is reduced. */
.page-structure {
  /* One level per step, wide enough for a drag's depth to follow the pointer's x. */
  --structure-indent: 14px;
  flex: 1;
  min-height: 0;
  margin: 0 -10px;
  overflow: auto;
}
/* The Page block above the tree: the route's title and description. */
.page-structure__meta {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 10px 14px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.page-structure__meta[hidden] {
  display: none;
}
.page-structure__meta-heading {
  font-size: var(--type-small);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.page-structure__field[hidden] { display: none; }

.page-structure__field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: var(--type-small);
  color: var(--muted);
}
.page-structure__field input {
  width: 100%;
  box-sizing: border-box;
  height: var(--size-control);
  padding: 0 8px;
  border: 1px solid var(--control-line);
  border-radius: var(--radius);
  background: var(--surface-input);
  color: var(--text);
  font: inherit;
  font-size: var(--type-base);
}
.page-structure__field input:disabled {

}
