  border-style: dashed;
}
.page-structure__meta-notice {
  margin: 0;
  font-size: var(--type-small);
  line-height: 1.4;
  color: var(--muted);
}
.page-structure__meta-notice[hidden] {
  display: none;
}
.page-structure__field input:focus-visible {
  outline: var(--focus-ring);
  outline-offset: -1px;
}
.page-structure__tree {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 0 4px 16px;
}
/* A block being dragged: its row faded, the line where it will land (indented
   to its depth, a dot at its start) and a faint tint on the row that takes it. */
.page-structure__tree.is-dragging {
  cursor: grabbing;
}
.page-structure__row.is-drag-source {
  opacity: 0.55;
}
.page-structure__row.is-drop-target,
.page-structure__row.is-spring {
  background: color-mix(in oklab, var(--primary) 9%, transparent);
}
.page-structure__row.is-drop-refused {
  background: color-mix(in oklab, var(--danger) 10%, transparent);
}
.page-structure__drop {
  position: absolute;
  z-index: 1;
  left: calc(10px + var(--depth, 0) * var(--structure-indent, 4px));
  right: 12px;
  height: 2px;
  margin-top: -1px;
  border-radius: 1px;
  background: var(--primary);
  pointer-events: none;
}
.page-structure__drop::before {
  content: "";
  position: absolute;
  left: -5px;
  top: -3px;
  width: 4px;
  height: 4px;
  border: 2px solid var(--primary);
  border-radius: 50%;
  background: var(--surface);
}
.page-structure__drop.is-refused {
  background: var(--danger);
}
.page-structure__drop.is-refused::before {
  border-color: var(--danger);
}
.page-structure__drop[hidden] {
  display: none;
}
.page-structure__tree[hidden] {
  display: none;
}
.page-structure__group[hidden] {
  display: none;
}
.page-structure__row {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: var(--size-control);
  padding: 0 8px 0 calc(6px + var(--depth, 0) * var(--structure-indent, 4px));
  border-radius: var(--radius);
  font-size: var(--type-base);
  line-height: 1.3;
  cursor: default;
  user-select: none;
  touch-action: none;
}
.page-structure__row:hover {
  background: var(--hover);
}
.page-structure__row[aria-selected="true"] {
  background: var(--current);
  color: var(--text);
  font-weight: 600;
}
.page-structure__row:focus-visible {
  background: var(--hover);
  outline: var(--focus-ring);
  outline-offset: -2px;
}
.page-structure__row[aria-selected="true"]:focus-visible {
  background: var(--current);
}
.page-structure__toggle {
  flex: none;
  width: 14px;
  height: 14px;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.page-structure__row[aria-expanded] .page-structure__toggle::before {
  content: "";
  width: 12px;
  height: 12px;
  background: currentColor;
  mask: var(--icon-caret-down) center / contain no-repeat;
}
.page-structure__row[aria-expanded="false"] .page-structure__toggle::before {
  mask-image: var(--icon-caret-right);
}
/* The caret counts the hold before opening; the tint remains without motion. */
.page-structure__row.is-spring .page-structure__toggle {
  color: var(--primary);
}
.page-structure__row.is-spring[aria-expanded="false"] .page-structure__toggle::before {
  animation: structure-spring 400ms linear;
  animation-fill-mode: forwards;
}

  to { transform: rotate(90deg); }
}
@media (prefers-reduced-motion: reduce) {
  .page-structure__row.is-spring .page-structure__toggle::before { animation: none; }
}
.page-structure__row[aria-expanded] .page-structure__toggle:hover {
  color: var(--text);
}
.page-structure__label {
  display: flex;
  align-items: center;
  line-height: 1.2;
  gap: 6px;
  min-width: 0;
}
/* Agents working on this element (tickets 33, am-11): their dots (agent-dots.css) end the label. */
.page-structure__kind {
  flex: none;
  font-size: var(--type-small);
  font-weight: 600;
  color: var(--muted);
}
.page-structure__row[aria-selected="true"] .page-structure__kind {
  color: var(--text);
}
.page-structure__kind--icon {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.page-structure__kind--icon > .icon {
  margin: 0;
}
.page-structure__text {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
@media (max-width: 650px) {
  .page-structure {
    max-height: 240px;
    margin: 0;
  }
}

/* ---- Component instances: compact row actions, slot badges and the one
   inline editor a pencil, F2 or a badge opens. ---- */
/* The surface Structure actually sits on: the sidebar (style.css .sidebar).
   Row fades end on it, with hover/current tints painted over it. A host on
   another surface sets --structure-surface. */
/* Row actions are the shared faded bar (row-actions.ts, row-action-overlay.css)
   at the row's end; on a slot row it fades in over the badge, which stays put.
   The fade follows the row's own paint in the order the row rules use:
   resting surface, then hover/focus, then current. Hover and current are
   translucent tints, so the opaque base under them is the Structure surface. */
.page-structure__row.row-action-host { --row-action-background: var(--structure-surface, var(--surface-subtle)); --row-action-base: var(--structure-surface, var(--surface-subtle)); }
.page-structure__row.row-action-host:is(:hover, :focus-visible) { --row-action-background: var(--hover); }
.page-structure__row.row-action-host[aria-selected="true"] { --row-action-background: var(--current); }
/* Resting actions sit translated past the row's end; keep them from widening the tree. */
.page-structure__row.row-action-host { overflow: clip; }
@media (hover: none), (pointer: coarse) {
  /* Touch: the bar takes its own room after the badge. A narrow row wraps
     the bar onto its own line, and its buttons onto further lines, rather
     than losing any. */
  .page-structure__row.row-action-host { overflow: visible; flex-wrap: wrap; }
  .page-structure__row.row-action-host > .row-action-overlay { flex-shrink: 1; flex-wrap: wrap; justify-content: flex-end; min-width: 0; max-width: 100%; margin-left: auto; }
}
.page-structure__action {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-small, 4px);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.page-structure__action:hover { color: var(--text); background: var(--hover); }
.page-structure__action:focus-visible { outline: var(--focus-ring); outline-offset: -1px; color: var(--text); }

/* The slot a row fills: an actual badge button replaces the drawn name. */
.page-structure__row--slot[data-slot]::after { content: none; }
.page-structure__slot-badge {
  flex: none;
  margin-left: auto;
  padding: 0 5px;
  border: 0;
  border-radius: var(--radius-small, 4px);
  background: var(--component-surface);
  color: var(--component-text);
  font: inherit;
  font-size: var(--type-badge);
  font-weight: 600;
  line-height: 16px;
  white-space: nowrap;
}
button.page-structure__slot-badge { cursor: pointer; }
button.page-structure__slot-badge:focus-visible { outline: var(--focus-ring); outline-offset: 1px; }
/* Visibility is an eye toggle (aria-pressed), drawn like the other row actions
   and in the same faded bar, a hidden slot's closed eye too; touch gets 44px. */
.page-structure__slot-toggle { flex: none; }
.page-structure__slot-toggle[aria-pressed="false"] { color: var(--muted); }
@media (hover: none), (pointer: coarse) {
  .page-structure__slot-toggle { min-width: 44px; min-height: 44px; }
}
.page-structure__label { flex: 1 1 auto; }
.page-structure__row--empty-slot { color: var(--muted); }
.page-structure__row--empty-slot .page-structure__kind,
.page-structure__row--empty-slot .page-structure__text { opacity: 0.6; font-style: italic; }
.page-structure__row--empty-slot .page-structure__slot-badge { opacity: 0.7; }

/* Native shared roots reuse the compact component affordance without slot rails. */

.page-structure__action--open {
  width: auto;
  padding: 0 4px;
  font: inherit;
  white-space: nowrap;
}
.page-structure__component-outline {
  border: 2px solid var(--component);
  border-radius: 8px;
  padding: 2px 0;
}
.page-structure__row > .slot-chip {
  margin-left: auto;
  margin-right: 6px;
}
.page-structure__row--outer > .page-structure__label { opacity: 0.6; }

/* Keep the badge clear while its name is being typed. */
.page-structure__row:has(> .slot-chip--renaming) > .row-action-overlay { display: none; }

/* Phones upright (the column layout, at least 500 px tall; a phone on its side keeps
   the plain column): while a page is on the canvas, Page structure and
   the code fold into a sheet under it, so the page gets most of the screen.
   The handle pulls it up and down (phone-sheet.ts, loaded on phones only); it
   stays folded until then. --sheet-size is the sheet's height under its handle,
   shared 55/45 by the structure and the code; the page row gets the rest.
   Nothing moves in the DOM: <main> spans the page, handle, structure and code
   rows as a subgrid, and the sidebar lies in the structure row. */
@property --sheet-size {
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
.sheet-handle {
  display: none;
}
@media (max-width: 650px) and (min-height: 500px) {
  @supports (grid-template-rows: subgrid) {
    .workspace:has(> main.has-preview) {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto calc(var(--sheet-size) * 0.55) calc(var(--sheet-size) * 0.45);
      /* A folded pane keeps its padding; it must not stretch the window into a scroll. */
      overflow: clip;

    .workspace--sidebar-collapsed:has(> main.has-preview) {
      grid-template-rows: auto minmax(0, 1fr) auto min(20px, var(--sheet-size)) max(0px, calc(var(--sheet-size) - 20px));
    }
    .workspace:has(> main.has-preview.code-collapsed) {
      grid-template-rows: auto minmax(0, 1fr) auto var(--sheet-size) 0px;
    }
    .workspace--sidebar-collapsed:has(> main.has-preview.code-collapsed) {
      grid-template-rows: auto minmax(0, 1fr) auto min(20px, var(--sheet-size)) 0px;
    }
    /* Every item names its column: the handle and sidebar lie over <main>'s rows, which
       automatic placement would avoid by making a second column. */
    .workspace:has(> main.has-preview) > * {
      grid-column: 1;
    }
    .workspace:has(> main.has-preview) > main {
      grid-row: 2 / -1;
      display: grid;
      grid-template-rows: subgrid;
      height: auto;
    }
    .workspace:has(> main.has-preview) > main > .preview-pane {
      grid-row: 1;
    }
    .workspace:has(> main.has-preview) > main > .code-split {
      grid-row: 4;
    }
    .workspace:has(> main.has-preview) > .sidebar {
      grid-row: 4;
      z-index: 1;
      min-height: 0;
      overflow: clip;
    }
    .workspace:has(> main.has-preview) .page-structure {
      max-height: none;
    }
    /* Folded: out of sight and out of reach (no Tab stop, no screen reader), once the sheet has closed. */
    .workspace:not(.sheet-open):has(> main.has-preview) > .sidebar,
    .workspace:not(.sheet-open) > main.has-preview > .code-split {
      visibility: hidden;
    }

    .workspace:has(> main.has-preview) > .sheet-handle {
      grid-row: 3;
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      min-block-size: 36px;
      padding: 6px 16px 4px;
      border: 0;
      border-block-start: 1px solid var(--control-line);
      border-start-start-radius: var(--radius-dialog);
      border-start-end-radius: var(--radius-dialog);
      background: var(--surface-subtle);
      box-shadow: 0 -2px 6px var(--semantic-shadow);
      color: var(--muted);
      font: inherit;
      font-size: var(--type-badge);
      line-height: 1.2;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;

      }
      .workspace:not(.sheet-open):has(> main.has-preview) > .sidebar,
      .workspace:not(.sheet-open) > main.has-preview > .code-split {
        transition: visibility 0s linear 400ms;
      }
      .workspace.sheet-dragging:has(> main.has-preview) {
        transition: none;
      }
    }
  }

/* Preview on top, code pane below; code-resize.ts sets --code-height. */
main.has-preview {
  display: grid;
  grid-template-rows: minmax(0, 1fr) var(--code-height, 40%);
  height: 100%;
}
main.has-preview.code-collapsed {
  grid-template-rows: minmax(0, 1fr) 0;
}
main.has-preview > .preview-pane {
  grid-row: 1;
}
main.has-preview > .code-split {
  grid-row: 2;
}
main.has-preview .workspace-content {
  position: relative;
  max-height: none;
  min-height: 0;
  overflow: hidden;
}
main.has-preview .code-editor {
  height: 100%;
  min-height: 0;
}

.preview-pane {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--surface-subtle);
}
.native-preview-pane {
  overflow: hidden;
}
.preview-frame-host {
  flex: 1;
  min-height: 0;
  display: flex;
}
.preview-frame-host[hidden] {
  display: none;
}
.preview-frame {
  flex: 1;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  border: 0;
}
.native-preview-frame {
  border: 0;
  background: var(--surface);
}
.native-preview-error {
  margin: 0;
  padding: 12px 16px;
  background: var(--danger-bg);
  color: var(--danger-fg);
  font-size: var(--type-base);
  line-height: 1.45;
}
.native-preview-error[hidden] {
  display: none;
}
.native-preview-warning {
  padding: 8px 16px;
  background: var(--warning-bg);
  color: var(--warning-fg);
  font-size: var(--type-base);
  line-height: 1.45;
}
.native-preview-warning p {
  margin: 0;
}
.native-preview-warning[hidden] {
  display: none;
}
.native-preview-warning__fix {

  margin-left: 4px;

/* History shows an earlier version: a bar over the page names it and offers
   Back to latest and Restore; the page's editing overlays stay away, as
   nothing on it can be edited. They set their own display when shown, so
   this has to win. */
.version-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px 8px 16px;
  border-bottom: 1px solid var(--control-line);
  background: var(--panel-surface);
  color: var(--text);
  font-size: var(--type-base);
}
/* Its buttons follow the words, clear of History's popover on the right. */

  min-width: 0;
  margin: 0;

.native-preview-pane.is-viewing :is(.edit-bar, .edit-bar__popover, .edit-bar__note, .insert-layer, .agent-pins, .agent-pins__tray, .agent-pin-card) {
  display: none !important;
}

/* Short screens keep the minimized source and canvas usable together. */
@media (max-width: 600px) and (max-height: 700px) {
  main.has-preview .canvas-bar {
    padding-block: 3px;
  }
  main.has-preview .canvas-host.is-framed {
    padding-block: 4px;
  }
}

main.has-preview.code-collapsed > .code-split > :not(.code-resize) { display: none; }
/* The small collapsed restore target must remain above canvas overlay controls. */
main.has-preview.code-collapsed > .code-split { z-index: 30; }

/* Attached early so the runtime loads during boot, but out of sight and
   reach until the first native page. Never display:none: the frame must load. */
.native-preview-pane.is-parked {
  position: fixed;
  inset: 0;
  visibility: hidden;
  pointer-events: none;
  z-index: -1;
}

<script type="text/plain" id="t-board">/* The catalogue board (board.ts) and its frame pages (frame.ts), on the preview editor only. Shared tokens only
   (src/theme.css): the canvas's large distances are steps of the spacing scale, so the one-offs count stays flat.
   Light and dark sit side by side: each half sets its own color-scheme, and theme.css's light-dark() follows it. */

[data-theme="light"] { color-scheme: light; }
[data-theme="dark"] { color-scheme: dark; }

body:has(> .cat-board) {
  margin: 0;
  overflow: clip;
}

/* ---------- Shell: top bar, outline, canvas, options ---------- */
.cat-board {
  container: board / inline-size;
  position: relative;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  block-size: 100dvh;
  overflow: clip;
  background: var(--surface);
  color: var(--text);
}
.cat-topbar {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  min-block-size: calc(var(--size-control) + var(--space-m));
  padding-inline: var(--space-s) var(--space-xs);
  border-block-end: 1px solid var(--line);
  background: var(--surface);
}
.cat-topbar__actions {
  display: flex;
  align-items: center;
  gap: var(--space-3xs);
}
.cat-brand {
  min-inline-size: 0;
  margin: 0;
  margin-inline-end: auto;
  font-size: var(--type-title);
  font-weight: 600;
}
.cat-shell {
  position: relative;
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr) 296px;
  min-block-size: 0;
}
.cat-panel {
  overflow: auto;
  overscroll-behavior: contain;
  background: var(--surface);
}
.cat-outline {
  padding: var(--space-xs);
  border-inline-end: 1px solid var(--line);
}
.cat-inspector {
  display: flex;
  flex-direction: column;
  border-inline-start: 1px solid var(--line);
}
.cat-topbar .cat-sheet-toggle {
  display: none;
}

/* Medium widths (a tablet, a narrow window): the canvas takes the width; outline and options float over it, one at a
   time, from the two top-bar buttons. */
@container board (width < 1040px) {
  .cat-shell {
    grid-template-columns: minmax(0, 1fr);
  }
  .cat-topbar .cat-sheet-toggle {
    display: inline-grid;
  }
  .cat-outline,
  .cat-inspector {
    position: absolute;
    z-index: var(--layer-popover);
    inset-block: var(--space-xs);
    border: 0;
    border-radius: var(--radius-dialog);
    box-shadow: var(--shadow);
    visibility: hidden;
    opacity: 0;
  }
  .cat-outline {
    inset-inline-start: var(--space-xs);
    inline-size: 240px;
    translate: calc(var(--space-xs) * -1) 0;
  }
  .cat-inspector {
    inset-inline-end: var(--space-xs);
    inline-size: 280px;
    translate: var(--space-xs) 0;
  }
  .cat-board[data-sheet="outline"] .cat-outline,
  .cat-board[data-sheet="options"] .cat-inspector {
    visibility: visible;
    opacity: 1;
    translate: none;
  }
  /* Visibility stays visible for the whole transition either way, so a closing panel fades before it hides. */
  @media (prefers-reduced-motion: no-preference) {
    .cat-outline,
    .cat-inspector {
      transition: opacity var(--dur-tooltip) var(--ease-out), translate var(--dur-menu) var(--ease-out), visibility var(--dur-menu);
    }
  }
}
/* Phone: both panels are bottom sheets. */
@container board (width < 600px) {
  .cat-segmented__text {
    display: none;
  }
  .cat-outline,
  .cat-inspector {
    inset-block: auto 0;
    inset-inline: 0;
    inline-size: auto;
    max-block-size: 62%;
    border-end-start-radius: 0;
    border-end-end-radius: 0;
    opacity: 1;
    translate: 0 100%;
  }
  .cat-outline {
    padding-block-start: 0;
  }
  .cat-panel::before {
    content: "";
    display: block;
    flex: none;
    inline-size: 36px;
    block-size: 4px;
    margin-block: var(--space-xs) var(--space-3xs);
    margin-inline: auto;
    border-radius: var(--radius-full);
    background: var(--control-line);
  }
  @media (prefers-reduced-motion: no-preference) {
    .cat-outline,
    .cat-inspector {
      transition: translate var(--dur-sheet) var(--ease-out), visibility var(--dur-sheet);
    }
  }
}

/* ---------- Canvas ---------- */
.cat-viewport {
  position: relative;
  min-inline-size: 0;
  overflow: clip;
  outline-offset: -2px;
  background: color-mix(in oklch, var(--text) 4%, var(--background));
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.cat-viewport:focus-visible {
  outline: var(--focus-ring);
}
.cat-board.is-space .cat-viewport {
  cursor: grab;
}
.cat-board.is-panning .cat-viewport {
  cursor: grabbing;
}
.cat-dots {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, color-mix(in oklch, var(--text) 24%, transparent) 1px, transparent 1.5px);
}
.cat-world {
  position: absolute;
  inset-block-start: 0;
  inset-inline-start: 0;
  display: flex;
  align-items: flex-start;
  gap: calc(var(--space-l) * 8);
  inline-size: max-content;
  padding: calc(var(--space-l) * 10);
  transform-origin: 0 0;
}
.cat-area {
  position: relative;
  padding-block: calc(var(--space-l) * 6) calc(var(--space-l) * 4);
  padding-inline: calc(var(--space-l) * 4);
  border-radius: var(--radius-dialog);
  background: color-mix(in oklch, var(--text) 3.5%, transparent);
}
.cat-area__label {
  position: absolute;
  inset-block-end: calc(100% + var(--space-l));
  inset-inline-start: var(--space-l);
  margin: 0;
  font-size: calc(var(--type-heading) * 2);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1;
  white-space: nowrap;
  color: var(--muted);
  transform-origin: left bottom;
  cursor: pointer;
}
.cat-area__cards {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: calc(var(--space-l) * 6) calc(var(--space-l) * 5);
  max-inline-size: 2800px;
}
.cat-card {
  position: relative;
  flex: none;
  outline: 1px solid color-mix(in oklch, var(--text) 10%, transparent);
  box-shadow: var(--shadow-small);
  background: var(--panel-surface);
}
.cat-card.is-culled {
  visibility: hidden;
}
.cat-card--empty {
  padding: calc(var(--space-l) * 2);
  outline-style: dashed;
  box-shadow: none;
  background: transparent;
  color: var(--muted);
}
.cat-card__title {
  position: absolute;
  inset-block-end: 100%;
  inset-inline-start: 0;
  display: flex;
  align-items: center;
  gap: var(--space-2xs);
  margin: 0;
  padding-block-end: var(--space-xs);
  font-size: var(--type-base);
  font-weight: 500;
  line-height: 1.2;
  white-space: nowrap;
  color: var(--muted);
  transform-origin: left bottom;
}
.cat-card.is-selected .cat-card__title {
  color: var(--primary);
}
@media (hover: hover) and (pointer: fine) {
  .cat-board:not(.is-panning) .cat-card:not(.is-selected):hover .cat-card__title {
    color: var(--text);
  }
}
.cat-card__body {
  display: grid;
}
.cat-halves {
  display: flex;
}
.cat-half,
.cat-live {
  padding-block: var(--space-m) var(--space-l);
  padding-inline: var(--space-l);
  background: var(--panel-surface);
  color: var(--text);
}
.cat-half {
  flex: 1 0 auto;
}
.cat-half[data-stage="page"] {
  background: var(--background);
}
.cat-label {
  display: block;
  margin-block-end: var(--space-s);
  font-size: var(--type-small);
  font-weight: 600;
  color: var(--muted);
}
.cat-live {
  display: grid;
  border-block-end: 1px solid var(--line);
}
.cat-live__stage {
  display: flex;
  align-items: center;
  justify-content: center;
  min-block-size: 96px;
  padding: var(--space-s);
}
.cat-live__stage:not(:has(iframe)) {
  zoom: 1.6;
}
/* A live cell drawn in a shadow root (component-css.ts): the part lays out as the stage's own child. */
.cat-live__host {
  display: contents;
}
.cat-grid {
  display: grid;
  align-items: center;
  gap: var(--space-s) var(--space-l);
}
.cat-grid__head,
.cat-grid__row {
  font-size: var(--type-small);
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
}
.cat-cell {
  display: flex;
  align-items: center;
  min-block-size: 36px;
}
.cat-iframe {
  display: block;
  border: 0;
}
/* A state cell's frame is a picture: the pointer goes to the board. A live cell works, except while the board pans. */
.cat-iframe:not(.cat-iframe--live),
/* `.cat-live__stage > *` is the part, or the shadow root's host (display: contents) around it: pointer-events
   inherit into the shadow tree, and its events reach the board on the host. */
.cat-board:is(.is-space, .is-panning) :is(.cat-iframe--live, .cat-live__stage > *) {
  pointer-events: none;
}
/* A finger on a live frame never reaches the board, so on a touch screen a frame works once its card is selected. */
@media (pointer: coarse) {
  .cat-card:not(.is-selected) .cat-iframe--live {
    pointer-events: none;
  }
}
.cat-card__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2xs) var(--space-s);
  padding-block: var(--space-s);
  padding-inline: var(--space-l);
  border-block-start: 1px solid var(--line);
  max-inline-size: max-content;
}
.cat-card__foot .cat-label {
  margin: 0;
}
.cat-made {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2xs) var(--space-s);
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: var(--type-small);
}
.cat-inspector .cat-made {
  flex-direction: column;
  align-items: flex-start;
}
.cat-made__link {
  padding: 0;
  border: 0;
  background: none;
  color: var(--link);
  font: inherit;
  text-decoration: underline;
  text-underline-offset: 0.2em;
}
.cat-inspector .cat-made__link {
  min-block-size: var(--size-tap);
}
.cat-made__untraced {
  display: inline-flex;
  align-items: baseline;
  gap: var(--space-2xs);
  color: var(--muted);
}
.cat-made__tag {
  flex: none;
  padding-inline: var(--space-3xs);
  border-radius: var(--radius-small);
  background: var(--warning-bg);
  color: var(--warning-fg);
  font-weight: 600;
}

/* The selection, drawn over the canvas in screen space so it stays thin at every zoom. */
.cat-sel {
  position: absolute;
  z-index: var(--layer-raised);
  inset-block-start: 0;
  inset-inline-start: 0;
  box-sizing: border-box;
  border: 1.5px solid var(--primary);
  pointer-events: none;
}

.cat-zoombar {
  position: absolute;
  z-index: var(--layer-bar);
  inset-block-end: var(--space-s);
  inset-inline: 0;
  display: flex;
  align-items: center;
  gap: var(--space-4xs);
  inline-size: max-content;
  margin-inline: auto;
  padding: var(--space-3xs);
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow-small);
}
.cat-zoombar__pct {
  min-inline-size: 46px;
  font-size: var(--type-small);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.cat-zoombar__sep {
  inline-size: 1px;
  block-size: 18px;
  margin-inline: var(--space-3xs);
  background: var(--control-line);
}

.cat-search {
  position: absolute;
  z-index: var(--layer-popover);
  inset-block-start: var(--space-s);
  inset-inline: 0;
  inline-size: min(360px, calc(100% - 2 * var(--space-s)));
  margin-inline: auto;
  padding: var(--panel-padding);
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.cat-search__box {
  display: block;
}
.cat-search__list {
  display: grid;
  gap: var(--space-4xs);
  max-block-size: 280px;
  margin: 0;
  margin-block-start: var(--space-3xs);
  padding: 0;
  overflow: auto;
  list-style: none;
}
.cat-search__list:empty {
  display: none;
}
.cat-search__item {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  min-block-size: max(var(--size-control), var(--size-tap));
  padding-inline: var(--space-xs);
  border-radius: var(--radius);
  cursor: pointer;
}
.cat-search__item[aria-selected="true"] {
  background: var(--current);
}
.cat-search__area {
  margin-inline-start: auto;
  font-size: var(--type-small);
  color: var(--muted);
}

/* ---------- Chrome controls ---------- */
.cat-icon-button {
  display: inline-grid;
  place-items: center;
  flex: none;
  inline-size: max(var(--size-control), var(--size-tap));
  block-size: max(var(--size-control), var(--size-tap));
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
}
.cat-icon-button[aria-pressed="true"] {
  background: var(--current);
  color: var(--text);
}
.cat-icon-button:active,
.cat-text-button:active {
  background: var(--hover);
  color: var(--text);
  scale: 0.96;
}
.cat-text-button {
  min-inline-size: var(--size-tap);
  min-block-size: max(var(--size-compact), var(--size-tap));
  padding-inline: var(--space-xs);
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text);
  font-size: var(--type-small);
  font-weight: 600;
}
@media (prefers-reduced-motion: no-preference) {
  .cat-icon-button,
  .cat-text-button,
  .cat-outline__item,
  .cat-outline__area {
    transition: background-color var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out), scale var(--dur-press) var(--ease-out);
  }
}
.cat-segmented {
  display: inline-flex;
  gap: var(--space-4xs);
  padding: var(--space-4xs);
  border-radius: var(--radius);
  background: var(--hover);
}
.cat-segmented button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2xs);
  min-inline-size: var(--size-tap);
  min-block-size: max(var(--size-compact), var(--size-tap));
  padding-inline: var(--space-s);
  border: 0;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--muted);
  font-weight: 500;
  white-space: nowrap;
}
.cat-segmented button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-small);
}
.cat-segmented--fill {
  display: flex;
}
.cat-segmented--fill button {
  flex: 1;
}
@media (hover: hover) and (pointer: fine) {
  .cat-icon-button:hover,
  .cat-text-button:hover,
  .cat-outline__area:hover,
  .cat-outline__item:hover,
  .cat-search__item:hover {
    background: var(--hover);
    color: var(--text);
  }
  .cat-segmented button:hover {
    color: var(--text);
  }
  .cat-outline__item[aria-current="true"]:hover {
    background: linear-gradient(var(--hover) 0 0), var(--current);
  }
}

/* ---------- Outline ---------- */
.cat-outline__area {
  display: flex;
  align-items: center;
  inline-size: 100%;
  min-block-size: max(var(--size-compact), var(--size-tap));
  margin-block-start: var(--space-s);
  padding-inline: var(--space-xs);
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  font-size: var(--type-small);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-align: start;
  text-transform: uppercase;
}
.cat-outline__area:first-of-type {
  margin-block-start: 0;
}
.cat-outline__list {
  display: grid;
  gap: var(--space-4xs);
  margin: 0;
  padding: 0;
  list-style: none;
}
.cat-outline__item {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  inline-size: 100%;
  min-block-size: max(var(--size-control), var(--size-tap));
  padding-inline: var(--space-xs);
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text);
  text-align: start;
}
.cat-outline__item[aria-current="true"] {
  background: var(--current);
  font-weight: 600;
}
.cat-outline__area:focus-visible,
.cat-outline__item:focus-visible,
.cat-search__item:focus-visible {
  outline-offset: -2px;
}
.cat-outline__name {
  flex: 1;
  min-inline-size: 0;
  overflow: clip;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cat-mark {
  display: inline-grid;
  place-items: center;
  flex: none;
  inline-size: 16px;
  block-size: 16px;
  color: var(--color-success);
}
.cat-card__title .cat-mark:not([data-approved]) {
  display: none;
}

/* ---------- Options panel ---------- */
.cat-inspector__head {
  display: flex;
  align-items: flex-start;
  gap: var(--space-xs);
  padding-block: var(--space-s) var(--space-2xs);
  padding-inline: var(--space-m) var(--space-xs);
}
.cat-inspector__heads {
  flex: 1;
  min-inline-size: 0;
  padding-block-start: var(--space-3xs);
}
.cat-inspector__title {
  margin: 0;
  font-size: var(--type-title);
  font-weight: 600;
  line-height: 1.3;
}
.cat-inspector__area {
  font-size: var(--type-small);
  color: var(--muted);
}
.cat-inspector__files {
  margin: 0;
  padding-block-end: var(--space-s);
  padding-inline: var(--space-m);
  border-block-end: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: var(--type-small);
  color: var(--muted);
  overflow-wrap: anywhere;
}
.cat-inspector__section {
  display: grid;
  gap: var(--space-s);
  padding: var(--space-m);
  border-block-end: 1px solid var(--line);
}
.cat-inspector__section:last-child {
  border-block-end: 0;
}
.cat-inspector__heading {
  margin: 0;
  font-size: var(--type-small);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.cat-inspector__empty {
  display: grid;
  place-items: center;
  flex: 1;
  min-block-size: 120px;
  padding: var(--space-l);
  color: var(--muted);
}
.cat-control {
  display: grid;
  gap: var(--space-2xs);
}
.cat-control--row {
  grid-template-columns: 1fr auto;
  align-items: center;
}
.cat-control__label {
  font-size: var(--type-small);
  font-weight: 500;
  color: var(--muted);
}
.cat-input {
  box-sizing: border-box;
  inline-size: 100%;
  min-block-size: max(var(--size-control), var(--size-tap));
  padding-inline: var(--space-s);
  border: 1px solid var(--control-line);
  border-radius: var(--radius);
  background: var(--surface-input);
  color: var(--text);
  font: inherit;
}
.cat-input:focus-visible {
  outline: var(--focus-ring);
  outline-offset: -1px;
}
/* A phone zooms the page into any field under 16 px: these fields are 16 px there. */
@media (pointer: coarse) {
  .cat-input {
    font-size: calc(var(--type-heading) * 0.8);
  }
}
.cat-check {
  flex: none;
  inline-size: 18px;
  block-size: 18px;
  margin: 0;
  accent-color: var(--primary);
}
label.cat-control--row {
  min-block-size: var(--size-tap);
  cursor: pointer;
}
.cat-approve,
.cat-tweak__actions .button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  inline-size: 100%;
  min-block-size: max(var(--size-control), var(--size-tap));
}
.cat-approve[aria-disabled="true"] {
  background: var(--success-bg);
  color: var(--success-fg);
  cursor: default;
}
.cat-approve[aria-busy="true"] {
  cursor: progress;
}
.cat-approve__note {
  margin: 0;
  font-size: var(--type-small);
  color: var(--muted);
}
.cat-approve__note--problem {
  color: var(--danger-fg);
}

/* Tweak: the selected part's CSS values, edited on its live cell (tweak.ts, tweak-panel.ts). */
.cat-tweak__note {
  margin: 0;
  font-size: var(--type-small);
  color: var(--muted);
}
.cat-tweak__group {
  margin: var(--space-2xs) 0 0;
  font-size: var(--type-small);
  font-weight: 600;
  color: var(--text);
}
.cat-tweak__field {
  display: grid;
  gap: var(--space-4xs);
  min-inline-size: 0;
}
.cat-tweak__name,
.cat-tweak__use {
  overflow: hidden;
  font-family: var(--font-mono);
  font-size: var(--type-small);
  white-space: nowrap;
  text-overflow: ellipsis;
}
.cat-tweak__name {
  color: var(--text);
}
.cat-tweak__use {
  color: var(--muted);
}
/* An edited value or file: a dot before its name, and its field drawn in the action colour. */
.cat-tweak__field[data-changed] .cat-tweak__name::before,
.cat-css[data-changed] .cat-css__file::before {
  content: "";
  display: inline-block;
  inline-size: var(--space-2xs);
  block-size: var(--space-2xs);
  margin-inline-end: var(--space-3xs);
  border-radius: var(--radius-full);
  background: var(--primary);
  vertical-align: middle;
}
.cat-tweak__field[data-changed] .cat-tweak__text,
.cat-css[data-changed] .cat-css__text {
  border-color: var(--primary);
}
.cat-tweak__text[aria-invalid="true"],
.cat-css__text[aria-invalid="true"] {
  border-color: var(--danger-fg);
}
.cat-tweak__inputs {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
}
.cat-tweak__text {
  flex: 1;
  min-inline-size: 0;
  font-family: var(--font-mono);
  font-size: var(--type-small);
}
.cat-tweak__slider + .cat-tweak__text {
  flex: 0 0 calc(var(--space-l) * 3.5);
}
.cat-tweak__slider {
  flex: 1;
  min-inline-size: 0;
  min-block-size: max(var(--size-control), var(--size-tap));
  margin: 0;
  accent-color: var(--primary);
}
.cat-tweak__swatch {
  flex: none;
  box-sizing: border-box;
  inline-size: max(var(--size-control), var(--size-tap));
  block-size: max(var(--size-control), var(--size-tap));
  padding: var(--space-3xs);
  border: 1px solid var(--control-line);
  border-radius: var(--radius);
  background: var(--surface-input);
  cursor: pointer;
}
.cat-tweak__swatch::-webkit-color-swatch-wrapper {
  padding: 0;
}
.cat-tweak__swatch::-webkit-color-swatch {
  border: 0;
  border-radius: var(--radius-small);
}
.cat-tweak__swatch::-moz-color-swatch {
  border: 0;
  border-radius: var(--radius-small);
}
.cat-tweak__swatch:focus-visible {
  outline: var(--focus-ring);
  outline-offset: 1px;
}
.cat-tweak__actions {
  display: flex;
  gap: var(--space-xs);
  margin-block-start: var(--space-2xs);
}
.cat-tweak__actions .button {
  inline-size: auto;
  border: 1px solid var(--control-line);
}
.cat-tweak__send {
  flex: 1;
}
.cat-tweak__actions .button[aria-disabled="true"] {
  background: var(--surface-subtle);
  color: var(--muted);
  cursor: default;
}
.cat-tweak__send[data-problem] {
  color: var(--danger-fg);
}

/* CSS: a part's own component CSS file, edited on its live cell (css-file.ts, css-panel.ts). One row per line, so
   the file reads whole and the panel scrolls; long lines scroll sideways inside the field. */
.cat-css__file {
  font-family: var(--font-mono);
  font-size: var(--type-small);
  color: var(--text);
  overflow-wrap: anywhere;
}
.cat-css__text {
  padding-block: var(--space-xs);
  font-family: var(--font-mono);
  font-size: var(--type-small);
  line-height: 1.5;
  tab-size: 2;
  white-space: pre;
  overflow: auto;
  resize: vertical;
}
/* As .cat-input: 16 px on a phone, which zooms the page into any smaller field. */
@media (pointer: coarse) {
  .cat-css__text {
    font-size: calc(var(--type-heading) * 0.8);
  }
}
.cat-css__problem {
  margin: 0;
  font-size: var(--type-small);
  color: var(--danger-fg);
}

/* ---------- Shared values ---------- */
.cat-values {
  display: grid;
  gap: var(--space-s);
}
.cat-values__row {
  display: grid;
  grid-template-columns: 180px auto;
  align-items: center;
  gap: var(--space-m);
}
.cat-values__label {
  display: grid;
}
.cat-values__token {
  font-family: var(--font-mono);
  font-size: var(--type-small);
  color: var(--muted);
}
.cat-ruler {
  display: block;
  block-size: var(--space-m);
  background: var(--primary);
}
.cat-type {
  white-space: nowrap;
}
.cat-corner {
  display: block;
  inline-size: 72px;
  block-size: 44px;
  border: 1.5px solid var(--primary);
  background: var(--surface-subtle);
}
.cat-swatches {
  display: grid;
  grid-template-columns: repeat(4, 140px);
  gap: var(--space-m) var(--space-l);
}
.cat-swatch {
  display: grid;
  gap: var(--space-4xs);
}
.cat-swatch__chip {
  block-size: 44px;
  border-radius: var(--radius);
  outline: 1px solid color-mix(in oklch, var(--text) 12%, transparent);
  outline-offset: -1px;
}
.cat-swatch__name {
  font-weight: 600;
}
.cat-shadows {
  display: flex;
  gap: var(--space-l);
  padding: var(--space-m);
}
.cat-shadow {
  display: grid;
  gap: var(--space-4xs);
  inline-size: 132px;
  padding: var(--space-m);
  border-radius: var(--radius-panel);
  background: var(--surface);
}
.cat-motion {
  display: grid;
  gap: var(--space-s);
  inline-size: 600px;
}
.cat-motion__all {
  display: inline-flex;
  align-items: center;
  justify-self: start;
}
.cat-motion__row {
  display: grid;
  grid-template-columns: 260px 1fr auto;
  align-items: center;
  gap: var(--space-m);
}
.cat-motion__track {
  position: relative;
  block-size: 28px;
  border-radius: var(--radius-full);
  background: var(--surface-subtle);
}
.cat-motion__ball {
  position: absolute;
  inset-block-start: 4px;
  inset-inline-start: 4px;
  inline-size: 20px;
  block-size: 20px;
  border-radius: var(--radius-full);
  background: var(--primary);
}

/* ---------- Parts' stages ---------- */
.cat-field {
  inline-size: 180px;
}
.cat-progress-stage {
  inline-size: 180px;
}
/* A stand-in for what an overlay spinner covers: its own corners, so the veil follows them. */
.cat-overlay-host {
  position: relative;
  min-inline-size: 140px;
  min-block-size: 72px;
  padding: var(--space-s);
  border: 1px solid var(--control-line);
  border-radius: var(--radius-panel);
  color: var(--text);
  font-size: var(--type-small);
}
.cat-overlay-host > p {
  margin: 0;
}
/* The Section heading's stage: a panel's width, so the end slot has its far end and long words wrap. */
.cat-heading-stage {
  inline-size: 220px;
}
/* A part with nothing to show says so. */
.cat-hint {
  color: var(--muted);
  font-size: var(--type-small);
}
.cat-menu-surface {
  inline-size: 280px;
  padding: var(--panel-padding);
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow-small);
}

/* ---------- A frame's own page ---------- */
.cat-frame-page {
  margin: 0;
  min-block-size: 100dvh;
  overflow: clip;
  background: var(--panel-surface);
  color: var(--text);
}
.cat-frame-page--screen {
  background: var(--background);
}
.cat-frame-stage {
  display: grid;
  padding: var(--space-m);
}
.cat-frame-page--screen .cat-frame-stage {
  padding: 0;
}
.cat-menu-host {
  display: flex;
  justify-content: flex-start;
}
.cat-dialog-host {
  display: flex;
  min-inline-size: 0;
}
.cat-dialog-host > .button {
  max-inline-size: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- Mock-ups ---------- */
.cat-mock {
  display: grid;
  place-items: start center;
  padding-block: var(--space-l);
}
.cat-mock__panel {
  display: grid;
  gap: var(--space-xs);
  inline-size: min(320px, calc(100% - 2 * var(--space-m)));
  padding: var(--panel-padding-roomy);
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.cat-mock__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cat-mock__title {
  margin: 0;
  font-size: var(--type-title);
  font-weight: 600;
}
.cat-mock__done {
  justify-self: end;
}
</script>

    style.textContent = document.getElementById(id).textContent;
    document.head.append(style);

    user-select: none;
    -webkit-user-select: none;
  }

  .dc-viewport.is-pan iframe { pointer-events: none; }
  .dc-viewport.is-panning { cursor: grabbing; }

  .dc-world { position: absolute; inset: 0 auto auto 0; transform-origin: 0 0; }
  .dc-frame { position: absolute; }
  .dc-frame iframe {
    display: block;
    inline-size: 100%;
    block-size: 100%;
    border: 0;
    background: var(--background);
    border-radius: calc(var(--radius-small) * var(--inv));
    box-shadow: 0 0 0 calc(1px * var(--inv)) var(--control-line), 0 calc(4px * var(--inv)) calc(16px * var(--inv)) var(--semantic-shadow);
  }
  .dc-frame[data-selected] iframe { box-shadow: 0 0 0 calc(2px * var(--inv)) var(--focus), 0 calc(4px * var(--inv)) calc(16px * var(--inv)) var(--semantic-shadow); }
  .dc-label {
    position: absolute;
    inset: auto auto 100% 0;
    box-sizing: border-box;
    display: flex;
    gap: var(--space-xs);
    max-inline-size: calc(100% * var(--z));
    padding-block-end: 6px;
    transform: scale(var(--inv));
    transform-origin: left bottom;

    font-size: var(--type-small);
    white-space: nowrap;
    cursor: grab;
  }
  .dc-label b { overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .dc-label span { color: var(--muted); font-variant-numeric: tabular-nums; opacity: 0.8; }
  .dc-label:hover { color: var(--text); }
  .dc-frame[data-selected] .dc-label { color: var(--link); }
  .dc-frame[data-selected] .dc-label b { font-weight: 600; }
  .dc-viewport.is-panning .dc-label,
  .dc-viewport.is-pan .dc-label { cursor: inherit; }
  .dc-handle {
    position: absolute;
    inset: auto 0 0 auto;
    display: none;
    inline-size: 10px;
    block-size: 10px;
    box-sizing: border-box;
    border: 2px solid var(--focus);
    background: var(--surface);
    border-radius: 2px;
    transform: translate(50%, 50%) scale(var(--inv));
    cursor: nwse-resize;
  }
  .dc-frame[data-selected] .dc-handle { display: block; }
  .dc-guide { position: absolute; background: var(--agent-question-strong); pointer-events: none; }
  .dc-dragging .dc-frame:not(.is-moving) { opacity: 1; }
  .dc-zoom { min-inline-size: 52px; font-variant-numeric: tabular-nums; }
  .dc-sep { inline-size: 1px; block-size: 20px; margin-inline: var(--space-3xs); background: var(--line); }
  .dc-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-s); }
  .cat-outline__item { cursor: default; }
  .cat-outline__item .cat-mark { visibility: hidden; }
  .cat-outline__item[data-approved] .cat-mark { visibility: visible; }
  .cat-sheet-toggle { display: none; }
  .dc-viewport:focus-visible { outline: none; }
  @media (prefers-reduced-motion: no-preference) {
    .dc-frame iframe { transition: box-shadow var(--dur-hover) var(--ease-out); }
  }
</style>

const ic = (name, size = 16, cls = "") => ICONS[name].replace("<svg ", `<svg class="icon ${cls}" width="${size}" height="${size}" aria-hidden="true" focusable="false" `);
const TEXT = { base: document.getElementById("t-base").textContent, button: document.getElementById("t-button").textContent,
  rest: document.getElementById("t-rest").textContent, board: document.getElementById("t-board").textContent };
const $ = (id) => document.getElementById(id);
const el = (tag, cls = "", text = "") => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

/* ---------- Real markup, as the editor draws it (src/workspace-mount.ts, repository-menu.ts, top-bar-phone.ts) ---------- */
function tile(name) {
  let hash = 0;
  for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return `<span class="repository-menu__initial" style="--initial-hue:${hash % 360}" aria-hidden="true">${(name.match(/[a-z0-9]/i) || ["·"])[0].toUpperCase()}</span>`;
}
const PROJECT = "techies-site";
function topBar({ phone = false, page = "Home" } = {}) {
  const tool = (name, label, part) => `<button type="button" class="icon-button code-editor__${part}" aria-label="${label}" title="${label}">${ic(name)}</button>`;
  const pageButton = phone
    ? `<button type="button" id="explorer-toggle" class="explorer-toggle" title="Pages &amp; files"><span class="explorer-toggle__tile">${tile(PROJECT)}</span><span class="explorer-toggle__words"><span class="explorer-toggle__site" aria-hidden="true">${PROJECT}</span><span id="current-page">${page}</span></span> ${ic("caret-down", 12, "icon--after")}</button>`
    : `<button type="button" id="explorer-toggle" class="explorer-toggle" title="Pages &amp; files"><span id="current-page">${page}</span> ${ic("caret-down", 12, "icon--after")}</button>`;
  const menuButton = `<button type="button" id="topbar-menu" class="icon-button" aria-label="Menu" title="Menu" aria-haspopup="dialog" aria-expanded="false" aria-controls="top-bar-menu">${ic("list", 22)}</button>`;
  return `<header class="topbar">
    <div id="repository-menu"><div class="repository-menu"><button type="button" class="repository-menu__trigger" aria-expanded="false"><span class="repository-menu__badge" aria-hidden="true">${tile(PROJECT)}</span><span class="repository-menu__identity"><span class="repository-menu__repository">techiesreviews</span><span class="repository-menu__name">${PROJECT}</span></span><span class="repository-menu__caret" aria-hidden="true">${ic("caret-down", 12)}</span></button></div></div>
    ${pageButton}
    <div class="topbar-actions"><div class="editor-toolbar-host"><div class="code-editor__toolbar code-editor__toolbar--hosted">
      ${tool("arrow-u-up-left", "Undo", "undo")}${tool("arrow-u-up-right", "Redo", "redo")}${tool("clock-counter-clockwise", "History", "history")}
      <div class="publish-menu"><button type="button" class="button primary publish-menu__trigger">Publish</button><button type="button" class="button primary publish-menu__more" aria-label="More save options">${ic("caret-down", 12)}</button></div>
    </div></div>${menuButton}</div>
    ${menuSheet(page)}
  </header>`;
}
function menuRow(icon, label, end = "") {
  return `<button type="button" class="top-bar-menu__row">${ic(icon, 20)}<span class="top-bar-menu__label">${label}</span><span class="top-bar-menu__end" aria-hidden="true">${end}${ic("caret-right", 16)}</span></button>`;
}

/* ---------- Inside each frame: forced states (port of the board's force-states.ts), real behaviour, hand-over to the canvas ---------- */
function frameBoot(frame) {
  const doc = document;
  // Hover, pressed and focus drawn without a pointer: every rule naming them gets a copy keyed on data-force.
  const PATTERN = /:(focus-visible|focus-within|hover|active|focus)(?![\w-])/g;
  const POINTER_ONLY = /^\s*\(\s*hover\s*:\s*hover\s*\)(\s*and\s*\(\s*pointer\s*:\s*fine\s*\))?\s*$/;
  const self = (s) => `[data-force~="${s}"]`;
  const selfOrAncestor = (s) => `:is(${self(s)}, :has(${self(s)}))`;
  const REPLACE = { hover: selfOrAncestor("hover"), active: selfOrAncestor("pressed"), focus: self("focus"), "focus-visible": self("focus"), "focus-within": selfOrAncestor("focus") };
  const insideHas = (sel, i) => { const open = []; for (let k = 0; k < i; k++) { if (sel[k] === "(") open.push(sel.slice(Math.max(0, k - 4), k) === ":has"); else if (sel[k] === ")") open.pop(); } return open.includes(true); };
  const forced = (sel) => (/\.cat-/.test(sel) || !sel.match(PATTERN)) ? null :
    sel.replace(PATTERN, (_, p, o) => insideHas(sel, o) ? self(p === "active" ? "pressed" : p === "hover" ? "hover" : "focus") : REPLACE[p]);
  const prelude = (css, cond) => (cond !== undefined && POINTER_ONLY.test(cond)) ? "" : css.slice(0, css.indexOf("{")).trim();
  function copies(rules, wrap, out) {
    for (const rule of Array.from(rules)) {
      if (rule instanceof CSSStyleRule) {
        const s = forced(rule.selectorText);
        if (s) out.push(wrap(`${s} { ${rule.style.cssText} }`));
        if (rule.cssRules && rule.cssRules.length) copies(rule.cssRules, (inner) => wrap(`${rule.selectorText} { ${inner} }`), out);
      } else if (rule instanceof CSSGroupingRule) {
        const p = prelude(rule.cssText, rule instanceof CSSMediaRule ? rule.media.mediaText : undefined);
        copies(rule.cssRules, p ? (inner) => wrap(`${p} { ${inner} }`) : wrap, out);
      }
    }
  }
  const sheet = new CSSStyleSheet();
  doc.adoptedStyleSheets = [...doc.adoptedStyleSheets, sheet];
  window.__rescan = () => {
    const out = [];
    for (const each of Array.from(doc.styleSheets)) { let rules; try { rules = each.cssRules; } catch { continue; } copies(rules, (x) => x, out); }
    sheet.replaceSync("");
    for (const text of out) { try { sheet.insertRule(text, sheet.cssRules.length); } catch { /* a selector this browser does not read */ } }
  };
  window.__rescan();

  // Hand-over to the canvas: selecting, zoom and pan from inside a frame, the space key.
  // The mock-ups page runs this file sandboxed, where a frame may not read its parent or be read by it, so the frame and the
  // canvas talk with messages: the frame sends selecting, wheel and keys up; the canvas sends the theme and the button CSS down.
  const id = frame.id;
  const dc = {
    select: () => parent.postMessage({ dc: "select", id }, "*"),
    wheel: (e) => parent.postMessage({ dc: "wheel", id, clientX: e.clientX, clientY: e.clientY, deltaX: e.deltaX, deltaY: e.deltaY, deltaMode: e.deltaMode, ctrlKey: e.ctrlKey, metaKey: e.metaKey, shiftKey: e.shiftKey }, "*"),
    key: (e, down) => {
      if (down && (e.code === "Space" || ((e.key === "=" || e.key === "+" || e.key === "-") && !e.altKey) || (e.shiftKey && (e.code === "Digit1" || e.code === "Digit0")) || ((e.ctrlKey || e.metaKey) && e.key === "0"))) e.preventDefault();

  doc.addEventListener("click", (e) => {
    const row = e.target.closest(".page-structure__row");

    if (seg) seg.parentElement.querySelectorAll(".top-bar-menu__segment").forEach((d) => d.setAttribute("aria-pressed", String(d === seg)));

  });

    trigger.addEventListener("click", () => { menu.showModal(); trigger.setAttribute("aria-expanded", "true"); });
    menu.addEventListener("close", () => trigger.setAttribute("aria-expanded", "false"));
    menu.querySelector(".top-bar-menu__grab").addEventListener("click", () => menu.close());
    menu.addEventListener("click", (e) => { if (e.target === menu && e.clientY < menu.getBoundingClientRect().top) menu.close(); const row = e.target.closest("button.top-bar-menu__row"); if (row) menu.close(); });
    if (frame.open) requestAnimationFrame(() => trigger.click());
  }
}

/* ---------- Canvas: view, frames, selection ---------- */
const vp = $("viewport"), world = $("world");
const view = { x: 0, y: 0, z: 1 };
const MIN_Z = 0.1, MAX_Z = 4;
let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
let selected, spaceDown = false;
const approved = new Map();
const themeOf = (f) => f.theme === "follow" ? theme : f.theme;

function applyView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  vp.style.setProperty("--z", view.z);
  vp.style.setProperty("--inv", 1 / view.z);
  const dot = 16 * view.z;
  vp.style.backgroundSize = `${dot}px ${dot}px`;
  vp.style.backgroundPosition = `${view.x}px ${view.y}px`;
  $("zoom-pct").textContent = `${Math.round(view.z * 100)}%`;
}
function zoomAt(cx, cy, z) {
  z = Math.min(MAX_Z, Math.max(MIN_Z, z));
  view.x = cx - (cx - view.x) * (z / view.z);
  view.y = cy - (cy - view.y) * (z / view.z);
  view.z = z;
  applyView();
}
function vpPoint(clientX, clientY) { const r = vp.getBoundingClientRect(); return [clientX - r.left, clientY - r.top]; }
function fitRect(rect, pad, maxZ) {
  const r = vp.getBoundingClientRect();
  const z = Math.min(maxZ, Math.max(MIN_Z, Math.min((r.width - 2 * pad) / rect.w, (r.height - 2 * pad) / rect.h)));
  view.z = z;
  view.x = (r.width - rect.w * z) / 2 - rect.x * z;
  view.y = (r.height - rect.h * z) / 2 - rect.y * z;
  applyView();
}
function fitAll() {
  const xs = FRAMES.map((f) => f.x), ys = FRAMES.map((f) => f.y);
  const x2 = Math.max(...FRAMES.map((f) => f.x + f.w)), y2 = Math.max(...FRAMES.map((f) => f.y + f.h));
  fitRect({ x: Math.min(...xs), y: Math.min(...ys) - 24, w: x2 - Math.min(...xs), h: y2 - Math.min(...ys) + 24 }, 40, 2);
}
function flyTo(f) { const z = Math.min(1, view.z); fitRect({ x: f.x, y: f.y - 24, w: f.w, h: f.h + 24 }, 72, Math.max(0.5, Math.min(1, z * 2))); }

function wheel(clientX, clientY, dx, dy, mode, zoom, shift) {
  const k = mode === 1 ? 16 : 1;
  if (zoom) {
    const [cx, cy] = vpPoint(clientX, clientY);
    zoomAt(cx, cy, view.z * Math.exp(Math.max(-0.25, Math.min(0.25, -dy * k * 0.01))));
  } else {
    view.x -= shift && !dx ? dy * k : dx * k;
    view.y -= shift && !dx ? 0 : dy * k;
    applyView();
  }
}
vp.addEventListener("wheel", (e) => { e.preventDefault(); wheel(e.clientX, e.clientY, e.deltaX, e.deltaY, e.deltaMode, e.ctrlKey || e.metaKey, e.shiftKey); }, { passive: false });

function frameRect(f) {
  const node = f.node, r = node.querySelector("iframe").getBoundingClientRect();
  return { r, k: r.width / node.offsetWidth };
}
// What a frame sends up (see frameBoot); only the frame's own window is believed.
window.addEventListener("message", (e) => {
  const m = e.data, f = m && m.dc && byId.get(m.id);
  if (!f || e.source !== f.iframe.contentWindow) return;
  if (m.dc === "select") select(f.id);
  else if (m.dc === "wheel") {
    const { r, k } = frameRect(f);
    wheel(r.left + m.clientX * k, r.top + m.clientY * k, m.deltaX, m.deltaY, m.deltaMode, m.ctrlKey || m.metaKey, m.shiftKey);
  } else if (m.dc === "key") keyEvent({ code: m.code, key: m.key, altKey: m.altKey, ctrlKey: m.ctrlKey, metaKey: m.metaKey, shiftKey: m.shiftKey, preventDefault() {} }, m.down);
});

function buildFrames() {
  for (const f of FRAMES) {
    const node = el("div", "dc-frame");
    node.dataset.id = f.id;
    const label = el("div", "dc-label");
    label.append(el("b", "", f.name), el("span", "", ""));
    const iframe = document.createElement("iframe");
    iframe.title = f.name;
    iframe.dataset.id = f.id;
    if (f.open) iframe.dataset.open = "1";
    iframe.srcdoc = frameDoc(f);
    const handle = el("div", "dc-handle");
    handle.setAttribute("aria-label", "Resize");
    node.append(label, iframe, handle);
    world.append(node);
    f.node = node; f.label = label; f.iframe = iframe; f.handle = handle;
    place(f);
  }
}
function place(f) {
  f.node.style.left = `${f.x}px`; f.node.style.top = `${f.y}px`;
  f.node.style.width = `${f.w}px`; f.node.style.height = `${f.h}px`;
  f.label.lastChild.textContent = `${Math.round(f.w)} × ${Math.round(f.h)}`;
}
function setTheme(next) {
  theme = next;
  document.documentElement.dataset.theme = next;
  for (const b of $("theme").children) b.setAttribute("aria-pressed", String(b.dataset.themeSet === next));
  for (const f of FRAMES) frameTheme(f);
}
function frameTheme(f) { f.iframe.contentWindow?.postMessage({ dc: "theme", value: themeOf(f) }, "*"); }
function applyCss() {
  const text = buttonText();
  for (const f of FRAMES) f.iframe.contentWindow?.postMessage({ dc: "css", text }, "*");
}

/* ---------- Pointer: pan, move, resize, snap ---------- */
let drag;
const guides = [];
function clearGuides() { for (const g of guides.splice(0)) g.remove(); }
function guide(x1, y1, x2, y2) {
  const g = el("div", "dc-guide");
  g.style.left = `${x1}px`; g.style.top = `${y1}px`;
  g.style.width = x1 === x2 ? "calc(1px * var(--inv))" : `${x2 - x1}px`;
  g.style.height = y1 === y2 ? "calc(1px * var(--inv))" : `${y2 - y1}px`;
  world.append(g); guides.push(g);
}
function snap(f, nx, ny) {
  clearGuides();
  const t = 6 / view.z;
  let bx = { d: t + 1 }, by = { d: t + 1 };
  const mine = (x, w) => [[x, 0], [x + w / 2, 1], [x + w, 2]];
  for (const o of FRAMES) {
    if (o === f) continue;
    for (const [mx, mi] of mine(nx, f.w)) for (const [ox] of [[o.x], [o.x + o.w / 2], [o.x + o.w]]) { const d = Math.abs(mx - ox); if (d < bx.d) bx = { d, shift: ox - mx, at: ox, o }; }
    for (const [my] of mine(ny, f.h)) for (const [oy] of [[o.y], [o.y + o.h / 2], [o.y + o.h]]) { const d = Math.abs(my - oy); if (d < by.d) by = { d, shift: oy - my, at: oy, o }; }
  }
  if (bx.d <= t) nx += bx.shift;
  if (by.d <= t) ny += by.shift;
  if (bx.d <= t) guide(bx.at, Math.min(ny, bx.o.y), bx.at, Math.max(ny + f.h, bx.o.y + bx.o.h));
  if (by.d <= t) guide(Math.min(nx, by.o.x), by.at, Math.max(nx + f.w, by.o.x + by.o.w), by.at);
  return [nx, ny];
}
vp.addEventListener("pointerdown", (e) => {
  if (e.button === 2) return;
  const labelEl = e.target.closest(".dc-label"), handleEl = e.target.closest(".dc-handle");
  const frameEl = e.target.closest(".dc-frame");
  const f = frameEl && byId.get(frameEl.dataset.id);
  if (handleEl && f) { drag = { mode: "resize", f, sx: e.clientX, sy: e.clientY, w: f.w, h: f.h }; }
  else if (labelEl && f && !spaceDown && e.button === 0) { select(f.id); drag = { mode: "move", f, sx: e.clientX, sy: e.clientY, x: f.x, y: f.y, moved: false }; }
  else if (spaceDown || e.button === 1 || (!f && e.button === 0)) { drag = { mode: "pan", sx: e.clientX, sy: e.clientY, x: view.x, y: view.y, moved: false }; vp.classList.add("is-panning"); }
  else return;
  e.preventDefault();
  vp.setPointerCapture(e.pointerId);
  vp.classList.add("is-busy");
});
vp.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (drag.mode === "pan") { drag.moved ||= Math.hypot(dx, dy) > 3; view.x = drag.x + dx; view.y = drag.y + dy; applyView(); }
  else if (drag.mode === "move") {
    drag.moved ||= Math.hypot(dx, dy) > 3;
    const [nx, ny] = snap(drag.f, drag.x + dx / view.z, drag.y + dy / view.z);
    drag.f.x = Math.round(nx); drag.f.y = Math.round(ny); place(drag.f); syncInspector();
  } else if (drag.mode === "resize") {
    drag.f.w = Math.max(160, Math.round(drag.w + dx / view.z)); drag.f.h = Math.max(44, Math.round(drag.h + dy / view.z)); place(drag.f); syncInspector();
  }
});
function endDrag(e) {
  if (!drag) return;
  if (drag.mode === "pan" && !drag.moved && !spaceDown) select(undefined);
  drag = undefined; clearGuides();
  vp.classList.remove("is-busy", "is-panning");
  if (vp.hasPointerCapture(e.pointerId)) vp.releasePointerCapture(e.pointerId);
}
vp.addEventListener("pointerup", endDrag);
vp.addEventListener("pointercancel", endDrag);

/* ---------- Keyboard ---------- */
function keyEvent(e, down) {
  if (e.code === "Space") {
    if (down) { if (!spaceDown) { spaceDown = true; vp.classList.add("is-pan"); } e.preventDefault(); }
    else { spaceDown = false; vp.classList.remove("is-pan"); }
    return;
  }
  if (!down) return;
  const mod = e.ctrlKey || e.metaKey;
  const r = vp.getBoundingClientRect();
  if ((e.key === "=" || e.key === "+") && !e.altKey) { e.preventDefault(); zoomAt(r.width / 2, r.height / 2, view.z * 1.25); }
  else if (e.key === "-" && !e.altKey) { e.preventDefault(); zoomAt(r.width / 2, r.height / 2, view.z / 1.25); }
  else if (e.shiftKey && (e.code === "Digit1")) { e.preventDefault(); fitAll(); }
  else if (e.shiftKey && e.code === "Digit0" || mod && e.key === "0") { e.preventDefault(); zoomAt(r.width / 2, r.height / 2, 1); }
  else if (e.key === "Escape") select(undefined);
  else if (selected && e.key.startsWith("Arrow") && !mod) {
    e.preventDefault();
    const f = byId.get(selected), s = e.shiftKey ? 10 : 1;
    f.x += e.key === "ArrowRight" ? s : e.key === "ArrowLeft" ? -s : 0; f.y += e.key === "ArrowDown" ? s : e.key === "ArrowUp" ? -s : 0;
    place(f); syncInspector();
  }
}
document.addEventListener("keydown", (e) => { if (e.target.closest && e.target.closest("input, textarea, select, [contenteditable]")) return; if (e.code === "Space" && e.target.closest && e.target.closest("button")) return; keyEvent(e, true); });
document.addEventListener("keyup", (e) => keyEvent(e, false));
window.addEventListener("blur", () => { spaceDown = false; vp.classList.remove("is-pan"); });

/* ---------- Layers (the board's outline) ---------- */
function drawOutline() {
  const out = $("outline");
  out.replaceChildren();
  for (const [aid, aname] of AREAS) {
    const head = el("div", "cat-outline__area", aname);
    const list = el("ul", "cat-outline__list");
    for (const f of FRAMES.filter((x) => x.area === aid)) {
      const li = el("li"), b = el("button", "cat-outline__item");
      b.type = "button"; b.dataset.id = f.id;
      b.append(el("span", "cat-outline__name", f.name));
      const mark = el("span", "cat-mark"); mark.innerHTML = ic("check", 16); b.append(mark);
      b.addEventListener("click", () => { select(f.id); flyTo(f); });
      li.append(b); list.append(li);
    }
    out.append(head, list);
  }
  paintOutline();
}
function paintOutline() {
  for (const b of $("outline").querySelectorAll(".cat-outline__item")) {
    b.setAttribute("aria-current", String(b.dataset.id === selected));
    b.toggleAttribute("data-approved", approved.has(b.dataset.id));
  }
}

/* ---------- Options panel (the board's inspector: Options, CSS, Made of, Review) ---------- */
const insp = $("inspector");
function section(title, ...kids) { const s = el("section", "cat-inspector__section"); s.setAttribute("aria-label", title); s.append(el("h3", "cat-inspector__heading", title), ...kids); return s; }
function select(id) {
  if (selected === id) return;
  selected = id;
  for (const f of FRAMES) f.node.toggleAttribute("data-selected", f.id === id);
  paintOutline();
  drawInspector();
}
function numberField(label, key, get, set) {
  const l = el("label", "cat-control"); l.append(el("span", "cat-control__label", label));
  const i = el("input", "cat-input"); i.type = "number"; i.value = Math.round(get()); i.dataset.key = key;
  i.addEventListener("input", () => { const v = Number(i.value); if (Number.isFinite(v) && i.value !== "") set(v); });
  l.append(i); return l;
}
function syncInspector() {
  if (!selected) return;
  const f = byId.get(selected);
  for (const [k, v] of [["w", f.w], ["h", f.h], ["x", f.x], ["y", f.y]]) { const i = insp.querySelector(`[data-key="${k}"]`); if (i && document.activeElement !== i) i.value = Math.round(v); }
}
function cssProblem(css) {
  const CLOSER = { "{": "}", "(": ")", "[": "]" }, open = []; let quote = "";
  for (let i = 0; i < css.length; i++) {
    const ch = css[i];
    if (quote) { if (ch === "\\") i++; else if (ch === quote) quote = ""; continue; }
    if (ch === "\\") i++;
    else if (ch === "/" && css[i + 1] === "*") { const end = css.indexOf("*/", i + 2); if (end < 0) return "A comment is never closed"; i = end + 1; }
    else if (ch === '"' || ch === "'") quote = ch;
    else if (ch in CLOSER) open.push(ch);
    else if (ch === "}" && !open.length) return "A } closes a rule that was never opened";
    else if ((ch === "}" || ch === ")" || ch === "]") && CLOSER[open[open.length - 1]] === ch) open.pop();
  }
  if (quote) return "A quote is never closed";
  return open.length ? `A ${open[0]} is never closed` : "";
}
function changeRequest(f, path, before, after) {
  if (before === after) return "";
  const a = before.split("\n"), b = after.split("\n"); let s = 0;
  while (s < a.length && s < b.length && a[s] === b[s]) s++;
  let ea = a.length, eb = b.length;
  while (ea > s && eb > s && a[ea - 1] === b[eb - 1]) { ea--; eb--; }
  return ["Design board change request", `Part: ${f.name} (data-part="${f.id}")`, `File: ${path}`, "Changed lines:", `Line ${s + 1}:`,
    ...a.slice(s, ea).map((l) => `-${l}`), ...b.slice(s, eb).map((l) => `+${l}`), "The file as edited:", "```css", after.trimEnd(), "```",
    "Tried on the canvas only; nothing is in the code yet."].join("\n");
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { /* fall through */ }
  try { const t = el("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.append(t); t.select(); const ok = document.execCommand("copy"); t.remove(); return ok; } catch { return false; }
}
function cssSection(f) {
  const s = el("section", "cat-inspector__section cat-css"); s.setAttribute("aria-label", "CSS"); s.append(el("h3", "cat-inspector__heading", "CSS"));
  const id = "css-text";
  const name = el("label", "cat-css__file", f.css); name.htmlFor = id;
  const text = el("textarea", "cat-input cat-css__text"); text.id = id; text.spellcheck = false; text.wrap = "off"; text.value = buttonText();
  const problem = el("p", "cat-css__problem"); problem.hidden = true;
  const reset = el("button", "button secondary cat-tweak__reset", "Reset"), send = el("button", "button secondary cat-tweak__send");
  reset.type = send.type = "button";
  const sendLabel = () => send.innerHTML = `${ic("sparkle", 16, "icon--before")}Send to agent`;
  sendLabel();
  let timer;
  const paint = (wrong = cssProblem(buttonText())) => {
    const changed = buttonText() !== cssState.before;
    text.rows = buttonText().split("\n").length;
    text.setAttribute("aria-invalid", String(!!wrong)); problem.textContent = wrong; problem.hidden = !wrong;
    s.toggleAttribute("data-changed", changed);
    reset.setAttribute("aria-disabled", String(!changed)); send.setAttribute("aria-disabled", String(!changed || !!wrong));
  };
  paint();
  text.addEventListener("input", () => {
    cssState.text = text.value === cssState.before ? undefined : text.value;
    clearTimeout(timer); sendLabel();
    const wrong = cssProblem(text.value); paint(wrong);
    if (!wrong) applyCss();
  });
  reset.addEventListener("click", () => { if (reset.getAttribute("aria-disabled") === "true") return; cssState.text = undefined; text.value = cssState.before; clearTimeout(timer); sendLabel(); paint(); applyCss(); });
  send.addEventListener("click", async () => {
    const req = changeRequest(f, f.css, cssState.before, buttonText());
    if (send.getAttribute("aria-disabled") === "true" || !req) return;
    const ok = await copyText(req);
    send.innerHTML = ok ? `${ic("check", 16, "icon--before")}Copied` : "Couldn't copy"; send.toggleAttribute("data-problem", !ok);
    clearTimeout(timer); timer = setTimeout(() => { send.removeAttribute("data-problem"); sendLabel(); }, 2000);
  });
  const actions = el("div", "cat-tweak__actions"); actions.append(reset, send);
  s.append(name, text, problem, actions);
  return s;
}
function approveSection(f) {
  const mark = approved.get(f.id);
  const b = el("button", `button ${mark ? "secondary" : "primary"} cat-approve`); b.type = "button";
  if (mark) { b.setAttribute("aria-disabled", "true"); b.innerHTML = `${ic("check", 16, "icon--before")}Approved`; } else b.textContent = "Approve";
  const kids = [b];
  if (mark) kids.push(el("p", "cat-approve__note", `${mark.by} · ${mark.on}`));
  b.addEventListener("click", () => { if (approved.has(f.id)) return; approved.set(f.id, { by: "Lex", on: "2026-11-12" }); paintOutline(); drawInspector(); });
  return section("Review", ...kids);
}
function drawInspector() {
  if (!selected) {
    const e = el("div", "cat-inspector__empty"); e.append(el("span", "", `Approved ${approved.size} of ${FRAMES.length}`));
    insp.replaceChildren(e); return;
  }
  const f = byId.get(selected);
  const head = el("div", "cat-inspector__head"), heads = el("div", "cat-inspector__heads");
  heads.append(el("h2", "cat-inspector__title", f.name), el("span", "cat-inspector__area", AREAS.find((a) => a[0] === f.area)[1]));
  const close = el("button", "cat-icon-button"); close.type = "button"; close.setAttribute("aria-label", "Close"); close.innerHTML = ic("x");
  close.addEventListener("click", () => { select(undefined); setSheet(""); });
  head.append(heads, close);
  const files = el("p", "cat-inspector__files", f.files.join(" · "));
  // Colours: this frame follows the canvas, or shows the other scheme.
  const seg = el("div", "cat-segmented cat-segmented--fill"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "Colours");
  for (const [v, label] of [["follow", "Canvas"], ["light", "Light"], ["dark", "Dark"]]) {
    const b = el("button", "", label); b.type = "button"; b.setAttribute("aria-pressed", String(f.theme === v));
    b.addEventListener("click", () => { f.theme = v; frameTheme(f); for (const o of seg.children) o.setAttribute("aria-pressed", String(o === b)); });
    seg.append(b);
  }
  const colours = el("div", "cat-control"); colours.append(el("span", "cat-control__label", "Colours"), seg);
  const grid = el("div", "dc-grid2");
  grid.append(
    numberField("Width", "w", () => f.w, (v) => { f.w = Math.max(160, v); place(f); }), numberField("Height", "h", () => f.h, (v) => { f.h = Math.max(44, v); place(f); }),
    numberField("X", "x", () => f.x, (v) => { f.x = v; place(f); }), numberField("Y", "y", () => f.y, (v) => { f.y = v; place(f); }));
  const sections = [head, files, section("Options", colours), section("Size", grid)];
  if (f.css) sections.push(cssSection(f));
  if (f.madeOf) {
    const list = el("ul", "cat-made"); list.setAttribute("aria-label", "Made of");
    for (const mid of f.madeOf) {
      const target = byId.get(mid); if (!target) continue;
      const li = el("li"), link = el("button", "cat-made__link", target.name); link.type = "button";
      link.addEventListener("click", () => { select(target.id); flyTo(target); });
      li.append(link); list.append(li);
    }
    sections.push(section("Made of", list));
  }
  sections.push(approveSection(f));
  insp.replaceChildren(...sections);
}

/* ---------- Top bar and narrow-window sheets ---------- */
function setSheet(name) {
  const board = $("board"); board.dataset.sheet = name;
  $("toggle-outline").setAttribute("aria-pressed", String(name === "outline")); $("toggle-options").setAttribute("aria-pressed", String(name === "options"));
}
$("toggle-outline").innerHTML = ic("list", 16); $("toggle-options").innerHTML = ic("gear", 16);
$("toggle-outline").addEventListener("click", () => setSheet($("board").dataset.sheet === "outline" ? "" : "outline"));
$("toggle-options").addEventListener("click", () => setSheet($("board").dataset.sheet === "options" ? "" : "options"));
$("zoom-out").innerHTML = ic("minus", 16); $("zoom-in").innerHTML = ic("plus", 16); $("zoom-fit").innerHTML = ic("corners-out", 16);
const center = () => { const r = vp.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
$("zoom-out").addEventListener("click", () => zoomAt(...center(), view.z / 1.25));
$("zoom-in").addEventListener("click", () => zoomAt(...center(), view.z * 1.25));
$("zoom-pct").addEventListener("click", () => zoomAt(...center(), 1));
$("zoom-fit").addEventListener("click", fitAll);
for (const b of $("theme").children) b.addEventListener("click", () => setTheme(b.dataset.themeSet));

buildFrames();
drawOutline();
drawInspector();
setTheme(theme);
new ResizeObserver(() => { if (!window.__fitted) return; }).observe(vp);
requestAnimationFrame(() => { fitAll(); window.__fitted = true; });
</script>
