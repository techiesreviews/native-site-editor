<body data-mode="today"><main class="mock"><h1>Element row actions</h1><div class="strip"><a href="index.html">All prototypes</a><div class="seg" role="group" aria-label="Comparison"><button data-mode-button="today" aria-pressed="true">Today</button><button data-mode-button="after" aria-pressed="false">After</button></div><button class="p-button" id="restart">Restart</button></div><section class="app" aria-label="Editor prototype"><header class="toolbar"><strong>Larkspur Studio</strong><span id="page-name">Home</span><button class="p-icon-button" id="undo" aria-label="Undo" title="Undo" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4-4 4 4 4M4 8h9a7 7 0 0 1 0 14"/></svg></button></header><div id="scene"><div class="work"><aside class="tree"><h2>Page structure</h2><div id="tree"></div></aside><div class="canvas"><div class="editbar" id="canvas-actions"></div><div class="paper" id="preview"></div></div></div><div id="row-menu" popover></div><dialog id="remove-dialog"><h2>Remove element?</h2><form method="dialog"><div class="actions"><button class="p-button" value="cancel">Cancel</button><button class="p-button danger" id="confirm-remove" value="remove">Remove element</button></div></form></dialog></div></section><p id="announce" class="sr-only" role="status" aria-live="polite"></p></main><script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons = {
 dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V4H4v11h4"/>',
 up:'<path d="m5 14 7-7 7 7"/>', down:'<path d="m5 10 7 7 7-7"/>',
 trash:'<path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',
 back:'<path d="m14 5-7 7 7 7"/>', search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',
 link:'<path d="m10 8 3-3a4 4 0 0 1 6 6l-3 3M14 16l-3 3a4 4 0 0 1-6-6l3-3M8 16l8-8"/>',
 x:'<path d="m6 6 12 12M18 6 6 18"/>', undo:'<path d="m8 4-4 4 4 4M4 8h9a7 7 0 0 1 0 14"/>',
 component:'<path d="m12 3 9 9-9 9-9-9Z"/>', pencil:'<path d="m15 4 5 5-11 11H4v-5ZM12 7l5 5"/>',
 code:'<path d="m8 6-6 6 6 6M16 6l6 6-6 6"/>', picture:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="2"/><path d="m3 17 6-5 4 3 4-4 4 5"/>'
};
const icon = name => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.component}</svg>`;
const ib = (name, glyph, attributes='') => `<button class="p-icon-button" aria-label="${esc(name)}" title="${esc(name)}" ${attributes}>${icon(glyph)}</button>`;
const button = (name, attributes='') => `<button class="p-button" ${attributes}>${esc(name)}</button>`;
const announce = text => $('#announce').textContent = text;
let mode = 'today';
let history = [];
function remember(value) { history.push(structuredClone(value)); $('#undo').disabled = false; }
function closePopovers() { $$('[popover]:popover-open').forEach(p => p.hidePopover()); }
function attachPopovers() {
  $$('[popover]').forEach(p => {
    if (p.dataset.wired) return;
    p.dataset.wired = 'true';
    let trigger;
    p.addEventListener('beforetoggle', e => { if(e.newState === 'open') trigger = document.activeElement; });
    p.addEventListener('toggle', e => {
      if(e.newState === 'open') p.querySelector('button,input,select,textarea')?.focus();
      else if(trigger?.isConnected) trigger.focus();
    });
    p.addEventListener('keydown', e => {
      const controls = [...p.querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')];
      if(e.key === 'Tab' && controls.length) {
        const first=controls[0], last=controls.at(-1);
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      }
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){
        if(document.activeElement?.matches('input,textarea,select')) return;
        e.preventDefault();
        const i=controls.indexOf(document.activeElement), delta=e.key==='ArrowDown'?1:-1;
        controls[(i+delta+controls.length)%controls.length]?.focus();
      }
    });
  });
}
function switchMode(next) {
  closePopovers(); mode=next; history=[];
  document.body.dataset.mode=mode;
  $$('[data-mode-button]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.modeButton===mode)));
  $('#undo').disabled=true;
  reset(); render(); attachPopovers();
}
$$('[data-mode-button]').forEach(b=>b.onclick=()=>switchMode(b.dataset.modeButton));
$('#restart').onclick=()=>switchMode(mode);
$('#undo').onclick=()=>{ if(history.length){ restore(history.pop()); render(); attachPopovers(); $('#undo').disabled=!history.length; announce('Undone'); } };
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.closest('input,textarea,[contenteditable]')){e.preventDefault();$('#undo').click();}
 if(e.key==='Escape') closePopovers();
});


let nodes, selected;
function reset(){ nodes=['Site header','Recent work','Contact']; selected=1; }
function restore(s){ nodes=s.nodes;selected=s.selected; }
function act(action){
 closePopovers();
 if(action==='remove'){ $('#remove-dialog').showModal();return; }
 remember({nodes,selected});
 if(action==='duplicate') {nodes.splice(selected+1,0,nodes[selected]+' copy');selected++;}
 if(action==='up'&&selected>0) {[nodes[selected-1],nodes[selected]]=[nodes[selected],nodes[selected-1]];selected--;}
 if(action==='down'&&selected<nodes.length-1){[nodes[selected+1],nodes[selected]]=[nodes[selected],nodes[selected+1]];selected++;}
 if(action==='component') nodes[selected]='Component: '+nodes[selected];
 render();attachPopovers();announce('Page structure updated');
}
function render(){
 $('#tree').innerHTML=nodes.map((n,i)=>`<div class="row" data-node aria-current="${selected===i}"><button class="node" data-select="${i}">${esc(n)}</button>${ib(n+' menu','dots',`data-menu="${i}" popovertarget="row-menu"`)}</div>`).join('');
 $('#preview').innerHTML=nodes.map((n,i)=>`<button class="canvas-node ${i===selected?'selection':''}" data-select="${i}"><h3>${esc(n)}</h3></button>`).join('');
 $('#canvas-actions').innerHTML=ib('Duplicate element','copy','data-action="duplicate"')+ib('Move element up','up',`data-action="up" ${selected===0?'disabled':''}`)+ib('Move element down','down',`data-action="down" ${selected===nodes.length-1?'disabled':''}`)+ib('Remove selected element','trash','data-action="remove"');
 $('#row-menu').innerHTML=`<button class="p-menu-item" data-action="component">Make component</button>`+(mode==='after'?`<button class="p-menu-item" data-action="duplicate">${icon('copy')}Duplicate</button><button class="p-menu-item" data-action="up" ${selected===0?'disabled':''}>${icon('up')}Move up</button><button class="p-menu-item" data-action="down" ${selected===nodes.length-1?'disabled':''}>${icon('down')}Move down</button><hr><button class="p-menu-item danger" data-action="remove">${icon('trash')}Remove</button>`:'');
 $$('[data-select]').forEach(b=>b.onclick=()=>{selected=+b.dataset.select;render();attachPopovers();});
 $$('[data-menu]').forEach(b=>b.addEventListener('click',()=>{selected=+b.dataset.menu;refreshMenu();}));
 $$('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));
}
function refreshMenu(){
 const p=$('#row-menu');
 p.querySelector('[data-action=up]')?.toggleAttribute('disabled',selected===0);
 p.querySelector('[data-action=down]')?.toggleAttribute('disabled',selected===nodes.length-1);
 $$('[data-node]').forEach((r,i)=>r.setAttribute('aria-current',String(i===selected)));
}
$('#confirm-remove').onclick=()=>{remember({nodes,selected});nodes.splice(selected,1);selected=Math.min(selected,nodes.length-1);render();attachPopovers();};
