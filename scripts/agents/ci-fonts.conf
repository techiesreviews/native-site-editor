<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CI fonts (ubuntu-latest has DejaVu only): FONTCONFIG_FILE=<abs path to this file> -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir prefix="xdg">fontconfig-ci</cachedir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
</fontconfig>
