# Keeps a self-hosted copy of the editor (made by Deploy to Cloudflare) up to
# date: once a week, or when you press "Run workflow", it takes the latest
# editor from techiesreviews/native-site-editor, keeps your settings in
# wrangler.jsonc, and pushes. Cloudflare then deploys the push by itself.
# To stop updating, disable this workflow in your repository's Actions tab.
name: Update the editor

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.repository != 'techiesreviews/native-site-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Take the latest editor
        id: update
        run: |
          sha=$(node scripts/update-editor.mjs)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Commit and push
        if: steps.update.outputs.sha != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update the editor to techiesreviews/native-site-editor@${{ steps.update.outputs.sha }}"
          git push
