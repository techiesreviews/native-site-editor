# The full browser suite (every project in playwright.config.ts, default
# fixture) in 4 shards plus the @actual and @native-static fixture groups,
# nightly, on every push to dev and on "Run workflow". Each run uploads a blob
# report; the last job merges them into one HTML report, uploaded as the
# artifact "playwright-report", and lists every failure (known flaky ones
# labeled from tests/known-failures.json) in the run summary. Pull requests
# and the dev preview run only the @smoke slice (ci.yml, deploy-preview.yml).
name: Browser tests (full suite)

on:
  # GitHub runs the schedule from main's copy of this file only, so it tests
  # main; the push trigger is what tests dev.
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  # A push run is never cut short, so every dev run ends with a result: newer
  # pushes wait as one pending run (GitHub keeps only the newest pending run).
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    if: github.repository == 'techiesreviews/native-site-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium-headless-shell
      - name: Browser tests, shard ${{ matrix.shard }} of 4
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=list,blob
      - name: Upload the shard's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3
      - name: Upload the shard's failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: .scratch/*/results/
          include-hidden-files: true
          retention-days: 14

  tagged:
    if: github.repository == 'techiesreviews/native-site-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [actual, native-static]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium-headless-shell
      - name: Browser tests, @${{ matrix.group }}
        run: npm run test:browser:${{ matrix.group }} -- --reporter=list,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.group }}.zip
      - name: Upload the group's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.group }}
          path: blob-report/
          retention-days: 3
      - name: Upload the group's failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.group }}
          path: .scratch/*/results/
          include-hidden-files: true
          retention-days: 14

  report:
    if: ${{ !cancelled() && github.repository == 'techiesreviews/native-site-editor' }}
    needs: [test, tagged]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge the shards and tagged groups into one HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
      # The test jobs already fail the run; this step only lists what failed,
      # so it never fails itself.
      - name: List the failures in the run summary
        run: |
          npx playwright merge-reports --reporter=json ./all-blob-reports > results.json
          {
            echo '### Browser tests'
            echo '```'
            node scripts/agents/suite-summary.mjs results.json 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
