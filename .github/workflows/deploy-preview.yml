# Deploys the `dev` branch to https://preview-editor.techies.tools on every
# push (wrangler.preview.jsonc). Needs the repository secret
# CLOUDFLARE_API_TOKEN: a Cloudflare API token made from the "Edit Cloudflare
# Workers" template for the techies account.
name: Deploy the dev preview

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'techiesreviews/native-site-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # One unit test (owner setup) drives a headless browser.
      - run: npx playwright install chromium-headless-shell
      - run: npm run check
      - run: npm test
      # Cold-start bytes before the first preview paint, against 350 KB
      # (docs/wayfinder/lean-fast-editor/tickets/02-set-cold-start-budget.md).
      # TODO(lean-fast-editor phases 2 and 4): it measures about 1358 KB today
      # (Monaco loads before the preview paints), so it only reports; drop
      # --report-only once deferring Monaco and the boot-path work bring it under.
      - name: Byte budget
        run: npm run test:budget -- --report-only
      # The @smoke browser slice (about 30 tests) over the fake GitHub server.
      - name: Smoke browser tests
        run: npm run test:browser:smoke -- --reporter=list,html
      - name: Upload the smoke report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            playwright-report/
            .scratch/*/results/
          include-hidden-files: true
          retention-days: 14
      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN secret yet, so the preview was not deployed."
            exit 0
          fi
          npx wrangler deploy --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b9b9a2b4c908c9d03abe92a52c2d0f43
