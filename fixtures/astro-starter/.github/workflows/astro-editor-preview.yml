name: Astro Site Editor preview
# Builds every pushed branch with the project's own build and uploads it as a
# Cloudflare Worker version with a preview alias named after the branch.
# Pushes to the default branch also deploy the live reference site.
on:
  push:
  workflow_dispatch:
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build annotated preview
        run: npx astro build --config .astro-editor/astro.preview.config.mjs
      - run: node .astro-editor/stamp-build.mjs
      - name: Preview alias for this branch
        id: alias
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { previewAlias } from './.astro-editor/preview-alias.mjs';
          const config = JSON.parse(readFileSync('.astro-editor/preview.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `name=${previewAlias(process.env.BRANCH_NAME, config.worker)}\n`);
          NODE
        env:
          BRANCH_NAME: ${{ github.ref_name }}
      - name: Upload preview version
        run: npx --yes wrangler@4 versions upload --config .astro-editor/wrangler.jsonc --preview-alias "${{ steps.alias.outputs.name }}" --message "${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build live site with the project's own build
        if: github.ref_name == github.event.repository.default_branch
        run: rm -rf dist && npm run build && node .astro-editor/stamp-build.mjs
      - name: Deploy live site
        if: github.ref_name == github.event.repository.default_branch
        run: npx --yes wrangler@4 deploy --config .astro-editor/wrangler.jsonc --message "${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
